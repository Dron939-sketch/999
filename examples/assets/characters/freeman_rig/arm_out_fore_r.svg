<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 145" width="46" height="145"><defs><filter id="ink" x="-40%" y="-40%" width="180%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="10" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/></filter></defs>

<!-- СТЫКИ ПРИВЯЗАНЫ К КОСТИ. Ствол идёт от пивота [21,12] до y=114 — ровно
     туда, где сидит пивот кисти (смещение 102 от предплечья). Раньше он
     доходил до 131, то есть на 17 единиц НИЖЕ запястья: предплечье
     торчало из-под кисти хвостом. Оба конца центрированы на x=21 — на пивоте,
     иначе стык расходится при зеркале и при сжатии по x.
     РУКА В ПРОФИЛЬ — ЗАЛИВКА БЕЛЫМ ПО ЧЁРНОМУ.
     С листа разворотов: сбоку рука не чёрная фигура рядом с телом, а СВЕТЛАЯ
     ЛИНИЯ ПОВЕРХ чёрного балахона — контур, не заливка. Этим снимается затык,
     об который я бился: чёрная рука на чёрном плаще пропадает, и чтобы её
     показать, приходилось выносить гнездо наружу — рука отрывалась от фигуры.
     Контуром рука остаётся ВНУТРИ силуэта и при этом читается.
     Геометрия — ровно та же, что у чёрной версии: файл сделан из неё заменой
     заливки на обводку, поэтому крепление и длина совпадают до единицы. -->
<g filter="url(#ink)"><path d="M16 6 Q15 30 17 60 Q18 88 18 114 L24 114 Q25 88 26 60 Q28 30 26 6 Z" fill="#0e0e0e" stroke="#0e0e0e" stroke-width="3.6"/></g></svg>
