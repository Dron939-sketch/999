<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 214" width="160" height="214">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- ЧУЖИЕ ОЧКИ — деталь РИГА, а не проп.
       Пропом они не держались: проп стоит в мировых координатах, а голова
       ездит от позы к позе, и очки то съезжали на рот, то висели над бровью.
       Здесь это кость под `head` в ТЕХ ЖЕ координатах, что и маска (viewBox
       и пивот совпадают с head.svg), поэтому оправы едут с головой в любой
       позе, наклоне и на любом плане — сами собой.
       По умолчанию кость выключена масштабом [0,0]; включают её позы с
       суффиксом `_ochki`.

       ВСЕ ЧИСЛА НИЖЕ СНЯТЫ С КАДРА, А НЕ ПРИКИНУТЫ ПО РИСУНКУ.
       Габарит пути в head.svg врал: обмер контура даёт маску шириной 132,
       а на кадре она 116 — путь меряется вместе с обводкой и с той частью
       дуг копирки, что уходит под соседний слой. Поэтому посадка снята
       калибровкой: в эту кость временно ставились четыре точки с известными
       координатами, кадр рендерился, и по их пикселям бралось соответствие
       «единица head.svg → пиксель». Замер (поза calm, scales 0.80, 1280×720):

           белок маски по строке глаз   X 15.6 .. 121.6
           левый глаз  (чернила)        X 20.4..53.4   Y 38.0..101.4
           правый глаз (чернила)        X 77.6..109.1  Y 43.8..102.8

       ОТСЮДА ГЛАВНОЕ: пара глаз стоит НЕ по центру маски — её середина 65.1
       против 68.6 у белка. Левый глаз почти упирается в кромку: от него до
       контура 4.8 единицы. Концентричную оправу туда не поставить — обод
       ушёл бы ЗА силуэт и слился с контурной линией в тёмный нарост, чем и
       была прежняя посадка. Поэтому левая линза сдвинута внутрь на 3: её
       левая дуга тонет в самом глазу (обод и глаз одного чёрного — стык не
       виден), а читаются правая дуга, верх и низ. Правой линзе места хватает,
       она стоит по своему глазу.

       Обе линзы на ОДНОЙ высоте: очки — жёсткий предмет, они не могут
       повторять разную посадку левого и правого глаза.

       Дужки короткие и упираются в контур изнутри с запасом: за контуром
       начинается чёрный балахон, там дужку всё равно не видно, а пересечение
       силуэта ломает яйцо маски. Слева места почти нет — дужка там короче,
       и это та же асимметрия покоя, что у всей фигуры. -->
  <g filter="url(#ink)" fill="none" stroke="#0e0e0e" stroke-linecap="round">
    <!-- дужки к вискам (изнутри контура) -->
    <path d="M21.5 66 C20 65, 18.8 64.5, 17.6 64" stroke-width="4.6"/>
    <path d="M114.5 67 C116.5 66, 118 65, 119.5 63.5" stroke-width="4.6"/>
    <!-- перемычка: между внутренними кромками линз, дугой вверх -->
    <path d="M60 63 C64 56, 69 56, 73 62" stroke-width="4.6"/>
    <!-- линзы: левая сдвинута внутрь (см. комментарий), правая по своему глазу -->
    <ellipse cx="40" cy="70.5" rx="17" ry="34" stroke-width="5.5"/>
    <ellipse cx="93.5" cy="70.5" rx="18" ry="34" stroke-width="5"/>
  </g>
</svg>
