<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 84" width="120" height="84">
  <defs><filter id="ink" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="41" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/>
  </filter></defs>
  
  <!-- РУКА В ПРОФИЛЬ — ЗАЛИВКА БЕЛЫМ ПО ЧЁРНОМУ.
     С листа разворотов: сбоку рука не чёрная фигура рядом с телом, а СВЕТЛАЯ
     ЛИНИЯ ПОВЕРХ чёрного балахона — контур, не заливка. Этим снимается затык,
     об который я бился: чёрная рука на чёрном плаще пропадает, и чтобы её
     показать, приходилось выносить гнездо наружу — рука отрывалась от фигуры.
     Контуром рука остаётся ВНУТРИ силуэта и при этом читается.
     Геометрия — ровно та же, что у чёрной версии: файл сделан из неё заменой
     заливки на обводку, поэтому крепление и длина совпадают до единицы. -->

  <!-- РУКА В ПРОФИЛЬ — ЧЁРНАЯ ТУШЬ С БЕЛОЙ КАЙМОЙ.
       Двух крайностей избежать пришлось обеих. Сплошная чёрная рука на чёрном
       балахоне пропадает: видно, что фигура идёт, но не видно, чем машет.
       Целиком белый контур решал это на корпусе — и тут же ломался там, где
       рука ВЫХОДИТ за силуэт: на светлом поле она становилась прозрачной
       проволочкой, а гейт разворота считал профиль на 15% уже нормы, потому
       что мерит силуэт по туши.
       Отсюда два слоя: снизу та же чёрная рука, что и была, сверху — белая
       кайма по её краю. За корпусом рука читается тушью, на корпусе её
       очерчивает светлая линия. -->
<g filter="url(#ink)">
    <path d="M49 0 Q60 -5 71 0 Q73 15 60 20 Q47 15 49 0 Z" fill="#0e0e0e" stroke="#0e0e0e" stroke-width="3.6"/>
    <path d="M68.3 18.6 L48.5 32.9 L35.0 45.8 L26.9 39.9 L36.7 20.7 L51.7 1.4 Z" fill="#0e0e0e" stroke="#0e0e0e" stroke-width="3.6"/>
    <path d="M71.4 13.7 L59.6 38.8 L53.3 59.1 L43.4 57.7 L43.4 33.5 L48.6 6.3 Z" fill="#0e0e0e" stroke="#0e0e0e" stroke-width="3.6"/>
    <path d="M71.8 7.9 L73.0 34.5 L76.7 54.6 L67.3 58.0 L56.2 37.5 L48.2 12.1 Z" fill="#0e0e0e" stroke="#0e0e0e" stroke-width="3.6"/>
    <path d="M69.5 2.6 L80.2 22.1 L90.3 35.7 L83.6 43.1 L66.8 32.6 L50.5 17.4 Z" fill="#0e0e0e" stroke="#0e0e0e" stroke-width="3.6"/>
  </g>
  <g filter="url(#ink)">
    <path d="M49 0 Q60 -5 71 0 Q73 15 60 20 Q47 15 49 0 Z" fill="none" stroke="#eef1ec" stroke-width="1.6"/>
    <path d="M68.3 18.6 L48.5 32.9 L35.0 45.8 L26.9 39.9 L36.7 20.7 L51.7 1.4 Z" fill="none" stroke="#eef1ec" stroke-width="1.6"/>
    <path d="M71.4 13.7 L59.6 38.8 L53.3 59.1 L43.4 57.7 L43.4 33.5 L48.6 6.3 Z" fill="none" stroke="#eef1ec" stroke-width="1.6"/>
    <path d="M71.8 7.9 L73.0 34.5 L76.7 54.6 L67.3 58.0 L56.2 37.5 L48.2 12.1 Z" fill="none" stroke="#eef1ec" stroke-width="1.6"/>
    <path d="M69.5 2.6 L80.2 22.1 L90.3 35.7 L83.6 43.1 L66.8 32.6 L50.5 17.4 Z" fill="none" stroke="#eef1ec" stroke-width="1.6"/>
  </g>
</svg>
