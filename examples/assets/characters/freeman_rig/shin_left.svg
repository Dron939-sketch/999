<!-- СТОПА-САПОЖОК. Прежний загиб в 6 единиц на полноразмерном кадре терялся
     вовсе: ноги читались двумя палками, упёртыми в пол. У оригинала стопа —
     горизонтальный сапожок шириной в две-три ноги, носком НАРУЖУ, с круглым
     пятком; это одна из пяти сильных форм силуэта. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 112" width="52" height="112"><defs><filter id="ink" x="-40%" y="-40%" width="180%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="22" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<!-- Голень с каплей-стопой наружу, как у оригинала. -->
<g filter="url(#ink)"><path d="M12 4 Q9 48 11 88 L11 96 Q2 95 0 103 Q0 112 10 112 L32 110 Q34 100 31 92 Q32 48 31 4 Z" fill="#0e0e0e"/></g></svg>
