<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="1" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#ink)">
    <!-- шея -->
    <path d="M70 158 L68 190 L100 190 L98 158 Z" fill="#0e0e0e"/>
    <!-- маска в повороте на ¾ вправо (по экрану): ближняя щека (справа) полнее и
         с намёком на нос, дальняя сторона (слева) уже и уходит -->
    <path d="M92 6 Q134 14 135 86 Q135 142 106 170 Q95 182 87 182 Q79 182 68 171 Q44 146 48 86 Q51 14 92 6 Z"
          fill="#eef1ec" stroke="#0e0e0e" stroke-width="7.2"/>
    <!-- нос-профиль на ближней (правой) грани -->
    <path d="M135 96 q9 5 7 15 q-2 7 -9 7" fill="#eef1ec" stroke="#0e0e0e" stroke-width="5.8"/>
    <!-- тяжёлая кисть по нижней/теневой (дальней) стороне -->
    <path d="M49 98 Q52 148 78 170 Q90 180 87 180 Q95 180 106 170 Q131 148 134 100"
          fill="none" stroke="#0e0e0e" stroke-width="18.0" stroke-linecap="round"/>
    <path d="M48 80 Q50 60 55 46" fill="none" stroke="#0e0e0e" stroke-width="12.0" stroke-linecap="round"/>
    <!-- лёгкие штрихи щеки -->
    <path d="M120 72 Q128 104 112 146" fill="none" stroke="#c2c7c0" stroke-width="3.8" opacity="0.8"/>
  </g>
</svg>
