<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 214" width="160" height="214">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="1" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- ГОЛОВА В ТРИ ЧЕТВЕРТИ — ОТДЕЛЬНЫЙ РИСУНОК, КАК И ПРОФИЛЬ.
       Прежний файл с этим именем был браком и потому ни разу не подключался:
       нос на маске (канон рига прямо запрещает — «на маске только глаза и рот,
       БЕЗ носа»), шея обрубком, тяжёлая кисть по дальней грани, читавшаяся
       чёрным наростом, и viewBox 160×200 вместо 214 — то есть маска другой
       высоты, чем анфас и профиль.
       Вместо него `turn.py` сжимал АНФАСНУЮ маску по x на 0.9. Сжатое яйцо
       остаётся симметричным яйцом, поэтому полуоборот не читался как поворот:
       корпус развёрнут, а лицо смотрит прямо. Ровно та ошибка, которую уже
       разбирали на профиле (head_side.svg) и на плаще.

       ФОРМА. Голова крутится вокруг вертикальной оси, значит ВЫСОТА не
       меняется — только ширина и асимметрия кромок:
         * со стороны ЛИЦА (справа, фигура смотрит вправо) кромка остаётся
           полной круглой дугой: она к нам ближе и укорачивается меньше;
         * со стороны ЗАТЫЛКА (слева) кромка ЗАМЕТНО ПРЯМЕЕ — это срез профиля,
           увиденный под углом. Не прямая, как в профиль, и не дуга, как в
           анфас: пологая кривая на средней трети высоты.
       Асимметрия кромок и есть поворот. Масштабом она не получается.

       ШИРИНА — НЕ НА ГЛАЗ. Маска — яйцо, вращаемое вокруг вертикали; её
       проекция на угле θ равна sqrt(cos²θ + (D/W)²·sin²θ) от анфасной, где
       D/W — отношение профильной ширины к анфасной. Замер рендера: анфас
       287 px, профиль 177 px → D/W = 0.617 (в доктрине профиля 0.615 —
       сходится). На 45°: sqrt(0.5 + 0.617²·0.5) = 0.831. Отсюда ширина
       рисунка 132.4 (ink анфас) × 0.831 ≈ 110.

       Фигура смотрит ВПРАВО. Для левого полуоборота кость масштабируется по x
       в минус; рисунок центрирован по пивоту (80), поэтому зеркалится ровно и
       без сдвига — то же условие, что у head_side.svg.
       viewBox и пивот [80,190] — как у head.svg. -->
  <g filter="url(#ink)" fill="#eef1ec" stroke="#0e0e0e" stroke-width="3.4"
     stroke-linejoin="round">
    <path d="M58.1 7
             C 95.5 0, 125.5 27, 130.6 68
             C 134.7 105, 125.9 143, 105.6 165
             C 92.3 182, 68.8 187, 52.7 179
             C 40.0 174, 27.5 164, 24.0 146
             L 24.0 76
             C 23.6 44, 34.0 13, 58.1 7 Z"/>
  </g>
</svg>
