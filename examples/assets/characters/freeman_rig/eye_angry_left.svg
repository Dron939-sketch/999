<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 60" width="48" height="60">
  <defs>
    <filter id="ink" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- ЗЛОЙ ГЛАЗ — КЛИН, а не прищур.
       Было: симметричная узкая линза, одинаковая в обоих глазах, — то есть
       человек просто сощурился. На схеме сборки злость сделана иначе:
       выражение ВЫРЕЗАНО в яйце. Жёсткая ПРЯМАЯ верхняя кромка идёт наискось
       вниз к переносице, низ подрезан пологой дугой, внутренний угол острый.
       Прямая линия рядом с круглой маской и читается как злость: в покое у
       фигуры скруглено всё.
       Этот глаз — БОЛЬШИЙ клин (левый крупнее правого по всей фигуре).
       Внутренний острый угол — справа, к переносице. -->
  <g filter="url(#ink)">
    <path d="M4 19 L45 37 Q38 42 28 41 Q13 39 5 32 Q2 26 4 19 Z" fill="#0e0e0e"/>
  </g>
</svg>
