    <path d="M68.4 8.8 L70.6 44.1 L74.3 72.2 L68.5 73.6 L59.2 45.7 L51.6 11.2 Z" fill="#0e0e0e"/>
    <path d="M68.1 12.6 L55.3 43.2 L46.7 68.4 L40.8 67.0 L44.3 39.6 L51.9 7.4 Z" fill="#0e0e0e"/>
    <path d="M66.1 15.9 L45.0 33.8 L29.1 49.2 L24.4 45.4 L36.8 25.8 L53.9 4.1 Z" fill="#0e0e0e"/>
