<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 84" width="120" height="84">
  <defs><filter id="ink" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="41" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/>
  </filter></defs>
  <!-- раскрытая ладонь: пальцы веером, почти прямые.
       Кадр оригинала (_9 октября 2024, 30с, кисть крупно): ладони как таковой
       нет — ДЛИННЫЕ пальцы расходятся прямо из запястья веером и сходят на
       нет к кончику. У нас была компактная варежка с толстыми култышками.
       Веер держим НИЖЕ горизонтали (до ±60° от оси руки): разведённый шире
       он читается не кистью, а звёздочкой-фейерверком.
       Все hand_*.svg делят один viewBox и одну точку запястья (60,10) —
       иначе при смене жеста кисть прыгает мимо конца предплечья. -->
  <g filter="url(#ink)">
    <path d="M50 1 Q60 -4 70 1 Q72 15 60 19 Q48 15 50 1 Z" fill="#0e0e0e"/>
    <path d="M64.0 2.5 L88.0 18.3 L108.0 29.8 L105.6 35.3 L82.6 28.5 L56.0 17.5 Z" fill="#0e0e0e"/>
