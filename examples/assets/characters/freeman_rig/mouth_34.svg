<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 30" width="44" height="30">
  <!-- РОТ В ПОЛУОБОРОТ — ДУГА С СОСТАВНЫМ СЖАТИЕМ.
       «Линия губ укорачивается АСИММЕТРИЧНО: ближняя половина тянется, дальняя
       сжимается и убегает за щёку». Равномерное сжатие анфасной улыбки по x
       (scale 0.72) укорачивает обе половины одинаково — рот остаётся анфасным,
       просто узким, и разворот по нему не читается.
       Здесь середина губы сдвинута к ДАЛЬНЕЙ стороне: ближняя половина дуги
       длиннее и положе, дальняя — короче и круче, с обрывом у края.
       Фигура развёрнута ВПРАВО (ближняя сторона — правая); левый полуоборот
       получается зеркалом всей ветки torso.
       viewBox и пивот [22,8] — как у mouth_smile.svg. -->
