<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 214" width="160" height="214">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="1" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- ЗАТЫЛОК — ТОЛЬКО КОНТУР, БЕЗ ЗАЛИВКИ.
       Со спины и с полуспины у Фримена не белое пятно, а ТОНКАЯ ДУГА-ОБРУЧ:
       на листе разворотов (клетки 4, 5, 6) сквозь неё виден фон локации, а
       низ дуги срезан плечами. Маска — это ЛИЦО; со стороны затылка лица нет,
       и показывать нечего, кроме абриса черепа.
       У нас там стояла АНФАСНАЯ маска, сплющенная по вертикали (scale
       [1.12, 0.647]) — то есть залитое светлое пятно с толстой обводкой.
       Ровно та же ошибка, что была с полуоборотом: чужой рисунок, доведённый
       масштабом. Сплющенное яйцо остаётся яйцом, только низким.

       ФОРМА. Со спины череп ШИРЕ, чем в анфас, и НИЖЕ: видна верхушка, а не
       овал лица. Замер листа (белая полость внутри фигуры):
         профиль  41×109  H/W 2.66
         135°     76×76   H/W 1.00
         спина    75×64   H/W 0.85
       Ряд монотонный — отворачиваясь, череп расширяется относительно высоты.
       Ширина со спины 75 при анфасной маске 71, то есть 1.06 анфасной;
       у head.svg ink 132.4 единицы → дуга 140.

       БЕЗ ЗАЛИВКИ, А НЕ С ЗАЛИВКОЙ ЦВЕТА ФОНА: локации у нас разные (светлое
       поле, тёмная камера, титры), и залитый «фоновым» цветом затылок выдал бы
       себя на первой же смене павильона.
       Дуга замкнутая: низ прячется за плащом, потому что в позах спины
       голова стоит z_order 1, то есть ЗА корпусом.
       viewBox и пивот [80,190] — как у head.svg. -->
  <g filter="url(#ink)">
    <ellipse cx="80" cy="120" rx="70" ry="75"
             fill="none" stroke="#0e0e0e" stroke-width="3.4"/>
  </g>
</svg>
