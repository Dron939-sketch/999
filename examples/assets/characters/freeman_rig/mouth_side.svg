<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 30" width="44" height="30">
  <!-- РОТ В ПРОФИЛЬ — РОВНО ПОЛОВИНА ДУГИ, ОТ ЛИНИИ ГОЛОВЫ, УГЛОМ ВВЕРХ.
       Анфасная улыбка mouth_smile — дуга с углами ВВЕРХ и серединой губы внизу.
       Сбоку дальний угол уходит за кромку лица, и остаётся ровно один склон:
       от середины губы — она в профиль лежит НА ПЕРЕДНЕЙ КРОМКЕ маски — назад
       и ВВЕРХ, к ближнему углу рта.
       Первая версия шла от кромки вниз: половину дуги я взял правильную, а
       ориентировал наоборот, и в профиль получалась скорбная чёрточка вместо
       улыбки. Направление задаётся не половиной, а тем, где середина губы:
       середина всегда НИЖЕ угла, а в профиль середина — у самого контура.
       Засечка осталась на углу (задний конец), как на анфасной улыбке.
       viewBox и пивот [22,8] — как у mouth_smile.svg, поэтому поза ставит рот
       теми же смещениями. -->
  <path d="M39 20 Q30 21 22 10" fill="none" stroke="#0e0e0e"
        stroke-width="4.6" stroke-linecap="round"/>
  <path d="M22 10 q-3 -4 -2 -7" fill="none" stroke="#0e0e0e"
        stroke-width="3.6" stroke-linecap="round"/>
</svg>
