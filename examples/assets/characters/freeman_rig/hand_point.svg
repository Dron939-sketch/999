    <path d="M71.6 5.3 L72.5 16.8 L72.6 26.5 L62.4 30.6 L55.8 23.6 L48.4 14.7 Z" fill="#0e0e0e"/>
    <path d="M69.0 1.3 L73.7 11.3 L77.2 19.8 L69.2 27.5 L60.8 23.8 L51.0 18.7 Z" fill="#0e0e0e"/>
