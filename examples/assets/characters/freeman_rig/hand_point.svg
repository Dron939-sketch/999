<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 84" width="120" height="84">
  <defs><filter id="ink" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="41" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/>
  </filter></defs>
  <!-- указующий: длинный палец вытянут, остальные поджаты.
       ЧЕТЫРЕ пальца вместо пяти, толще и короче. Замер изрезанности силуэта
       (периметр в квадрате на площадь) дал у нас 308 против 252 у оригинала:
       пятерня тонких игл добавляла периметра больше, чем читаемости — это и
       есть признак детского рисунка, много мелких отметок при слабой большой
       форме. Кисть должна читаться КОГТЕМ, а не веером.
       Все hand_*.svg делят один viewBox и одну точку запястья (60,10). -->
  <g filter="url(#ink)">
