<!-- ОДНА ЛИНИЯ, А НЕ ДВА ЗВЕНА. Прежнее предплечье было в 16 единиц у локтя
     при плече в 7 — на стыке вырастал бугор, и рука читалась как две
     сочленённые палки. На полноразмерных кадрах оригинала рука — одна
     ровная тонкая линия без утолщений; локоть виден только по изгибу.
     Верх предплечья сужен до 9 единиц, к запястью сходит в 5. -->
