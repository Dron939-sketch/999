<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 145" width="46" height="145"><defs><filter id="ink" x="-40%" y="-40%" width="180%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="10" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="kajma" x="-50%" y="-50%" width="200%" height="200%"><feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="tolshche"/><feFlood flood-color="#eef1ec" result="bumaga"/><feComposite in="bumaga" in2="tolshche" operator="in"/></filter></defs>
<!-- СВЕТЛАЯ КАЙМА (tools/kajma.py). Ниже рисунок напечатан дважды:
