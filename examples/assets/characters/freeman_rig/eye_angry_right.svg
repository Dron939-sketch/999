<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 60" width="48" height="60">
  <defs>
    <filter id="ink" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- ЗЛОЙ ГЛАЗ, ПРАВЫЙ — ЩЕЛЬ, а не такой же клин.
       Пара делает выражение: клин слева и щель справа читаются как перекос
       лица, симметричная пара — как ровный прищур. Раньше здесь стоял тот же
       рисунок, что слева, зеркально: злость выходила «дежурной».
       Щель уже и злее: та же прямая верхняя кромка, но угол круче, а сама
       форма ниже — глаз почти закрыт. Острый угол — слева, к переносице. -->
  <g filter="url(#ink)">
    <path d="M44 21 L6 36 Q12 40 21 39 Q34 37 42 31 Q46 27 44 21 Z" fill="#0e0e0e"/>
  </g>
</svg>
