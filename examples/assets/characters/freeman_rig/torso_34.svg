<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 392" width="220" height="392">
  <defs>
    <filter id="ink" x="-18%" y="-18%" width="136%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- БАЛАХОН В ПОЛУПОВОРОТЕ — ТРЕТЬЯ ПЛОСКОСТЬ.
       Не анфас и не профиль: ширина между ними, а кромки РАЗНЫЕ. Дальняя
       (спина) уходит лёгкой дугой наружу, ближняя (грудь) идёт почти прямо.
       Симметричный силуэт в три четверти читается как анфас, который просто
       сузили, — разворот в нём виден только по лицу, а тело остаётся плоским.
       Асимметрия кромок и есть то, что делает полуповорот полуповоротом.
       АСИММЕТРИЯ БЫЛА СЛИШКОМ СЛАБОЙ, ЧТОБЫ ЧИТАТЬСЯ. Замер прежнего рисунка:
       прогиб дальней кромки 14 единиц на ширине 161, то есть 8%. У профиля —
       23 на 131, и там сразу видно, что фигура повёрнута. Полуоборот же
       выходил ровной колонной чуть у́же анфаса: разворот держался только на
       лице, а силуэт спорил с ним и побеждал.
       Теперь дальняя кромка идёт как в профиль, только мягче: сверху 88
       (0.55 ширины), к середине высоты расходится до полной. Гребень плеча
       сдвинут к ближней стороне. Ближняя кромка почти отвесна — грудь.
       Дуга здесь СЛАБЕЕ, чем в профиль: там спина видна целиком, здесь только
       краем.
       ПЛЕЧЕВАЯ ДУГА НАКЛОНЕНА, И НАКЛОН БЫЛ В ДРУГУЮ СТОРОНУ. Замер листа
       (клетки 2 и 8): верхняя кромка плаща на ДАЛЬНЕЙ стороне лежит НИЖЕ на
       13–16 px при росте фигуры 409, то есть ближнее плечо ВЫШЕ. У прежнего
       рисунка было наоборот: слева (спина, дальняя) y=6, справа (грудь,
       ближняя) y=40. Полуоборот от этого читался как заваливание назад.
       Фигура развёрнута ВПРАВО; для левого полуповорота кость масштабируется
       по x в минус. viewBox и пивот — как у torso.svg, поэтому подмена части
       не сдвигает ни голову, ни руки, ни ноги. -->
  <g filter="url(#ink)" fill="#0e0e0e">
    <path d="M172 6
             C 150 -6, 116 -4, 92 10
             C 70 24, 52 48, 40 84
             C 28 122, 20 160, 17 200
             C 15 236, 17 268, 20 292
             L 27 306 L 34 290 L 42 308 L 50 292 L 58 310 L 67 294
             L 75 312 L 84 296 L 92 312 L 100 296 L 109 310 L 117 294
             L 126 306 L 134 290 L 143 304 L 151 288 L 160 300 L 170 284
             C 174 246, 176 206, 176 168
             C 176 128, 176 88, 175 46
             C 174 24, 173 12, 172 6 Z"/>
  </g>
</svg>
