     ЛИНИЯ ПОВЕРХ чёрного балахона — контур, не заливка. Этим снимается затык,
     об который я бился: чёрная рука на чёрном плаще пропадает, и чтобы её
     показать, приходилось выносить гнездо наружу — рука отрывалась от фигуры.
     Контуром рука остаётся ВНУТРИ силуэта и при этом читается.
     Геометрия — ровно та же, что у чёрной версии: файл сделан из неё заменой
     заливки на обводку, поэтому крепление и длина совпадают до единицы. -->
