<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 214" width="160" height="214">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="1" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- ГОЛОВА В ПРОФИЛЬ — ОТДЕЛЬНЫЙ РИСУНОК.
       Раньше профиль получался сжатием анфасной маски по x (scale 0.578).
       Сжатое яйцо остаётся симметричным яйцом — просто худым; поэтому голова
       сбоку и читалась «не той формы». У профиля затылок КРУГЛЫЙ и уходит
       назад, а лицевая кромка идёт почти прямо, с лёгким выступом надбровья
       и подбородком. Асимметрия передней и задней кромок и есть профиль;
       масштабом она не получается — то же правило, что с плащом и с крысой.

       Замер листа разворотов (NanoBanana model sheet, клетки 1 и 3):
       ширина маски анфас 78 px, в профиль 48 px → 0.615. Высота маски в обоих
       ракурсах одна (яйцо крутится вокруг вертикальной оси, высота не при чём).
       Отсюда ширина рисунка: 132.4 (ink анфас) × 0.615 = 81.

       Наклон ВПЕРЁД — сутулость: макушка вынесена в сторону лица, затылок
       заваливается назад. Поза больше не докручивает голову rotation'ом,
       наклон внутри рисунка.

       Фигура смотрит ВПРАВО. Для левого профиля кость масштабируется по x в
       минус — рисунок центрирован по пивоту (80), поэтому зеркалится ровно
       и без сдвига. Прежний профиль зеркалился криво: анфасная маска
       нарисована с центром на 66, то есть на 14 левее пивота, и минус по x
       перебрасывал её на 28 единиц вбок. Отсюда и был «четвёртый не похож».
       viewBox и пивот [80,190] — как у head.svg. -->
  <g filter="url(#ink)" fill="#eef1ec" stroke="#0e0e0e" stroke-width="3.4"
     stroke-linejoin="round">
    <path d="M96 3
             C 108 7, 116 22, 119 46
             C 121 70, 121 96, 118 120
             C 116 140, 111 160, 103 174
             C 97 183, 89 187, 82 184
             C 72 179, 62 168, 55 152
             C 47 133, 41 110, 40 84
             C 39 58, 45 30, 58 14
             C 68 4, 84 0, 96 3 Z"/>
  </g>
</svg>
