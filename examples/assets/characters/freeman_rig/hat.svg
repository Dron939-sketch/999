<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100" height="90">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- ЦИЛИНДР — перерисован по схеме сборки персонажа.
       Было: прямоугольная тулья + эллипс-обруч полей + светлая крышка. На
       схеме крышки нет вовсе (силуэт сплошной), тулья слегка КОНИЧЕСКАЯ —
       кверху шире, а поля — не обруч, а жирная линза с подъёмом к краям.
       Светлая крышка была прямой ошибкой: она делала из плоского силуэта
       объёмный предмет, а канон здесь — плоская тушь без бликов. -->
  <g filter="url(#ink)" fill="#0e0e0e">
    <!-- тулья: кверху шире, низ уходит под поля -->
    <path d="M28 8 C28 5 74 5 74 8 L78 62 C78 68 24 68 24 62 Z"/>
    <!-- поля: широкая линза, края чуть подняты -->
    <path d="M6 68 C6 59 94 59 94 68 C94 79 82 84 50 84 C18 84 6 79 6 68 Z"/>
  </g>
</svg>
