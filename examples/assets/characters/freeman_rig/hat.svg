<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100" height="90">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#ink)">
    <!-- цилиндр: поля + тулья, слегка набекрень -->
    <ellipse cx="50" cy="70" rx="46" ry="12" fill="#0e0e0e"/>
    <rect x="26" y="10" width="46" height="60" rx="4" fill="#0e0e0e"/>
    <ellipse cx="49" cy="10" rx="23" ry="8" fill="#1c1c1c"/>
  </g>
</svg>
