<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 102" width="120" height="102"><defs><filter id="ink" x="-40%" y="-40%" width="180%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/></filter></defs>


<!-- СТЫКИ ПРИВЯЗАНЫ К КОСТИ. Ствол идёт от пивота [60,8] до y=86 — ровно
     туда, где сидит пивот предплечья (смещение 78 от плеча). Раньше он
     доходил до 92 и обоими концами уезжал вбок от пивота (верх на 60, низ на
     59.5): на толстой руке это пряталось под перекрытием, а после утоньшения
     до 0.48 хвост вылезал за локоть, и рука читалась разорванной.
     Оба конца ствола центрированы на x=60 — на пивоте.
     РУКА В ПРОФИЛЬ — ЗАЛИВКА БЕЛЫМ ПО ЧЁРНОМУ.
     С листа разворотов: сбоку рука не чёрная фигура рядом с телом, а СВЕТЛАЯ
     ЛИНИЯ ПОВЕРХ чёрного балахона — контур, не заливка. Этим снимается затык,
     об который я бился: чёрная рука на чёрном плаще пропадает, и чтобы её
     показать, приходилось выносить гнездо наружу — рука отрывалась от фигуры.
     Контуром рука остаётся ВНУТРИ силуэта и при этом читается.
     Геометрия — ровно та же, что у чёрной версии: файл сделан из неё заменой
     заливки на обводку, поэтому крепление и длина совпадают до единицы. -->
