<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 30" width="44" height="30">
  <defs><filter id="ink" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter></defs>
  <g filter="url(#ink)">
    <!-- эталон: мягкая улыбка-дуга -->
    <path d="M8 11 Q12 15 15 16 Q22 21 29 16 Q32 15 36 11"
          fill="none" stroke="#0e0e0e" stroke-width="3" stroke-linecap="round"/>
    <!-- засечки-складки у ОБОИХ углов рта, короткие и немного ПЕРПЕНДИКУЛЯРНЫ
         улыбке (уголки как скобки ⟨ ⟩) -->
    <path d="M12 14 Q9 18 11 23" fill="none" stroke="#0e0e0e"
          stroke-width="2.2" stroke-linecap="round"/>
    <path d="M32 14 Q35 18 33 23" fill="none" stroke="#0e0e0e"
          stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
