<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 214" width="160" height="214">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="1" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- КОПИРКА С ПОДЛИННОГО КАДРА (maxresdefault (3).jpg): только белое яйцо и
       его обводка. Глаза и рот НЕ впечатаны — они кости.
       Так пришлось сделать после проверки завода: 57 поз в риге подменяют
       глаза (прищур, шок, дуги, грусть), а впечатанные в маску глаза не
       убрать никакой позой — поверх них рисовалась бы вторая пара. Ровно тот
       же класс ошибки, что дал двойную линию губ, только в 57 местах. -->
  <g filter="url(#ink)">
    <!-- Обводка на самом силуэте. Обведённые с кадра дуги (ниже) не смыкаются
         на макушке: между их концами остаётся щель, и белое яйцо ПЕРЕТЕКАЕТ в
         фон. На глаз щель почти не видна, но замер лица через неё проваливался
         («белого ядра маски не нашёл»), а на светлой локации макушка теряла
         край. Тонкий штрих по самому силуэту закрывает разрыв, оставаясь под
         живой рваной линией копирки там, где она есть. -->
    <g transform="translate(-13.379609,195.789358) scale(0.100000,-0.100000)"
fill="#eef1ec" stroke="#0e0e0e" stroke-width="34">
<path d="M613 1941 c-105 -29 -141 -51 -218 -136 -74 -81 -75 -81 -100 -163
-8 -29 -27 -77 -40 -106 -36 -79 -73 -197 -98 -315 -33 -159 -31 -417 5 -552
84 -312 243 -512 437 -549 260 -49 451 41 655 309 40 51 54 77 46 85 -16 16
-12 24 12 28 48 7 118 176 140 339 38 284 -116 704 -346 946 -101 107 -148
127 -301 130 -93 2 -136 -1 -192 -16z"/>
</g>
