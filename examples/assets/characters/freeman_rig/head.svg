<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="1" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#ink)">
    <!-- ЯЙЦО, а не капюшон. Разбор кадра оригинала (_9 октября 2024, 14с)
         показал две вещи, которых у нас не было:
         1) форма — ГЛАДКАЯ, без единого угла и прямого участка; широкий
            свод сверху, плавное сужение к подбородку (H/W ядра = 1.45);
         2) контур — ТОНКИЙ (единицы процентов ширины маски). Прежние 19.2
            съедали пятую часть маски с каждой стороны, и голова читалась
            как чёрный шлем с белой прорезью, а не как белое лицо.
         Рукотворная асимметрия оставлена: левый бок (зритель) полнее,
         макушка смещена, подбородок уведён влево от оси. -->
    <path d="M80 30
             C106 31 128 58 129 93
             C129 132 110 176 74 175
             C40 174 26 131 27 95
             C27 58 54 29 80 30 Z"
          fill="#eef1ec" stroke="#0e0e0e" stroke-width="7.5"
          stroke-linejoin="round"/>
  </g>
</svg>
