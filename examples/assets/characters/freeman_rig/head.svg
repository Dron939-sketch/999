<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="1" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#ink)">
    <!-- ЯВНО АСИММЕТРИЧНОЕ «неровное яйцо» (рукотворное, не эллипс):
         левая сторона (зритель) заметно шире и бульбистее, правая плотнее
         и прямее; макушка смещена вправо, подбородок — влево от центра. -->
    <path d="M85 6
             Q107 8 122 31
             Q135 63 132 103
             Q128 143 107 172
             Q93 188 79 188
             Q64 188 50 172
             Q21 143 17 100
             Q16 61 39 32
             Q55 8 85 6 Z"
          fill="#eef1ec" stroke="#0e0e0e" stroke-width="4.5"/>
  </g>
</svg>
