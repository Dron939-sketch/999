       УЛЫБКА из обводки СНЯТА: поверх неё кость рта рисовала вторую линию губ,
       и на лице шло два рта. Рот остаётся костью — иначе нет ни липсинка, ни
       смены выражения. Тушь ОБРЕЗАНА по границам нутра маски: в исходном
       кадре обводка срослась с линией плеч, и трасса тащила поперечную планку
       через весь торс.
