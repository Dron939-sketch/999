<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 30" width="44" height="30"><defs><filter id="ink" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<!-- Визема B по Rhubarb — «слегка приоткрытый рот», САМАЯ ЧАСТАЯ из всех:
     на замере одной реплики она занимает 42% времени речи. Раньше на неё
     был назначен `mouth_m` — штрих, то есть ЗАКРЫТЫЙ рот, и вместе с
     закрытой же `visA` это давало 67–80% времени с неподвижной линией.
     Отсюда и «рот не двигается».

     Форма ровно между линией и «о»: щель шире, чем штрих, и заметно ниже
     круглых виземы C и E. Её задача — не выразительность, а РАЗЛИЧИМОСТЬ:
     между соседними кадрами силуэт обязан меняться.

     ВЫСОТА ПОДОБРАНА ЗАМЕРОМ В ПИКСЕЛЯХ НА РЕАЛЬНОМ МАСШТАБЕ ФИГУРЫ, а не
     на глаз в редакторе. Первая версия была ry=4.6 — по числам это ТОНЬШЕ
     штриха закрытого рта (у того обводка 12 единиц из 30), и на общем плане
     она читалась той же линией. Глазом на увеличенной картинке разница была
     видна, в кадре — нет. -->
<g filter="url(#ink)"><ellipse cx="22" cy="15" rx="11.2" ry="6.8" fill="#0e0e0e"/></g></svg>
