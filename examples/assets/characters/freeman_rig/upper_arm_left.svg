<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 102" width="120" height="102"><defs><filter id="ink" x="-40%" y="-40%" width="180%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<!-- эталон-разбор: рука — тонкая чёрная сужающаяся линия с лёгким изгибом,
     без серой окантовки (на пересечении с рясой сливается — так и у оригинала) -->
<!-- РУКАВ-ПРУЖИНА, БЕЛАЯ, ВНУТРИ ПЛЕЧА. Здесь стояла «щетина» — веер из
     восемнадцати чёрных штрихов, торчащий НАРУЖУ за силуэт плаща на 40
     единиц в каждую сторону. На полноразмерных кадрах оригинала (part 00,
     0:37, 0:54) видно другое: пружина — это БЕЛАЯ спираль, нарисованная
     ПОВЕРХ чёрного плеча, и силуэт при этом остаётся чистым. Чёрная щетина
     была прочитана с размытого кадра и оказалась самой чужеродной деталью
     фигуры: в сравнении бок о бок она бросалась в глаза раньше головы.
     Витки нарисованы дважды — чёрной обводкой снизу и белой линией сверху:
     на плаще чёрное тонет и остаётся белая спираль, как в оригинале; на
     светлом фоне (рука поднята) обводка даёт читаемый виток. Ось руки на
     x=60. -->
<g filter="url(#ink)">
    <ellipse cx="60.0" cy="20.0" rx="16" ry="12" fill="#0e0e0e"/>
    <path d="M55 10 Q51 38 53 58 Q54 78 56 92 L63 92 Q64 78 64 58 Q66 38 65 10 Z" fill="#0e0e0e"/>
    <path d="M45.0 13 Q58.0 5.8 71.0 13 Q58.0 20.2 45.0 13" stroke="#0e0e0e" stroke-width="4.2" fill="none" stroke-linecap="round"/>
    <path d="M45.0 13 Q58.0 5.8 71.0 13 Q58.0 20.2 45.0 13" stroke="#e9e9e2" stroke-width="1.9" fill="none" stroke-linecap="round"/>
    <path d="M48.0 19 Q62.0 11.4 76.0 19 Q62.0 26.6 48.0 19" stroke="#0e0e0e" stroke-width="4.2" fill="none" stroke-linecap="round"/>
    <path d="M48.0 19 Q62.0 11.4 76.0 19 Q62.0 26.6 48.0 19" stroke="#e9e9e2" stroke-width="1.9" fill="none" stroke-linecap="round"/>
    <path d="M44.5 25 Q58.0 17.8 71.5 25 Q58.0 32.2 44.5 25" stroke="#0e0e0e" stroke-width="4.2" fill="none" stroke-linecap="round"/>
    <path d="M44.5 25 Q58.0 17.8 71.5 25 Q58.0 32.2 44.5 25" stroke="#e9e9e2" stroke-width="1.9" fill="none" stroke-linecap="round"/>
    <path d="M50.0 31 Q62.0 24.6 74.0 31 Q62.0 37.4 50.0 31" stroke="#0e0e0e" stroke-width="4.2" fill="none" stroke-linecap="round"/>
    <path d="M50.0 31 Q62.0 24.6 74.0 31 Q62.0 37.4 50.0 31" stroke="#e9e9e2" stroke-width="1.9" fill="none" stroke-linecap="round"/>
</g></svg>
