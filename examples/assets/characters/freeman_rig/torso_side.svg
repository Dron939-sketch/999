<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 392" width="220" height="392">
  <defs>
    <filter id="ink" x="-18%" y="-18%" width="136%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- БАЛАХОН В ПРОФИЛЬ — КОРПУС ЗАВАЛЕН ВПЕРЁД.
       Замер листа разворотов (клетка 3), нормированный по ширине плаща:
         передняя кромка       СТОИТ ВЕРТИКАЛЬНО, u=1.00 по всей высоте;
         задняя кромка         u=0.28 у плеча → 0.00 к 43% высоты → 0.06 у подола;
         гребень плеча         на u≈0.85, то есть СДВИНУТ К ЛИЦУ.
       ВЕРХ СУЖЕН ВДВОЕ. Плечо сбоку — не полка во всю ширину плаща: видна
       узкая шея-загривок, из которой масса расходится вниз и назад. Прежний
       верх шириной 83 (0.62 полной) читался бочкой; теперь 40 (0.30), и
       ширина набирается только к середине высоты. Это и есть сутулость в
       силуэте: чем ниже, тем дальше назад уходит спина.
       Отсюда силуэт: масса вынесена вперёд сверху, спина длинной дугой уходит
       назад и вниз. Это и есть наклон корпуса вперёд — не поворот всей фигуры
       (тогда уехал бы подол), а перераспределение массы внутри рисунка.

       ШИРИНА. Наклон вперёд ОТКРЫВАЕТ плащ, а не прячет: зритель видит не
       чистое ребро, а спину в три четверти сверху. По листу ширина плаща в
       профиль = 86 px против 122 анфас, то есть 0.70 — а не 0.49, как было у
       прежнего рисунка. Прежние 0.49 брались из ширины профильной проекции
       коробки и давали доску: фигура сбоку выглядела вдвое тоньше себя.
       0.70 × 191 (ink анфас) = 134 — ширина этого рисунка; кость в позе
       масштабируется теми же 1.3, что и анфас, значит пропорция сохраняется
       на любом плане.

       Рисунок центрирован по пивоту (110), поэтому левый профиль получается
       масштабом −1.3 по x без сдвига. viewBox и пивот — как у torso.svg. -->
  <g filter="url(#ink)" fill="#0e0e0e">
    <path d="M158 2
             C 170 6, 175 18, 176 38
             C 177 92, 177 160, 176 220
             C 176 258, 175 280, 174 292
             L 168 304 L 160 288 L 152 306 L 144 290 L 136 308 L 128 292
             L 120 310 L 112 294 L 104 308 L 96 292 L 88 306 L 80 290
             L 72 304 L 64 288 L 56 300 L 49 286
             C 46 250, 44 210, 44 172
             C 44 138, 46 108, 54 84
             C 62 58, 80 34, 106 18
             C 124 7, 144 -1, 158 2 Z"/>
  </g>
</svg>
