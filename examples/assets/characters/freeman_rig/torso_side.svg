<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 392" width="220" height="392">
  <defs>
    <filter id="ink" x="-18%" y="-18%" width="136%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- БАЛАХОН В ПРОФИЛЬ — С СУТУЛОСТЬЮ.
       Отдельный рисунок, а не суженный фронтальный. Сужением сутулость не
       передаётся: у сгорбленной фигуры сбоку ЗАДНЯЯ кромка ВЫПУКЛАЯ, плечо
       завалено вперёд, а передняя кромка вогнута под грудью. Фронтальный
       плащ, сжатый по ширине, остаётся прямой колонной — что мы и получали.
       Это ровно то же правило, что с крысой на стене и с рукой-контуром:
       рисунок обязан соответствовать плоскости, трансформацией он не
       заменяется. Здесь оно применимо без риска: у плаща нет костей-детей,
       чья геометрия от него зависела бы (глаза и рот сидят на голове).
       СПИНА ДУГОЙ, ГРУДЬ ВОГНУТА — силуэт сбоку АСИММЕТРИЧЕН. Задняя кромка
       уходит наружу до x=30 на середине высоты, передняя на той же высоте
       поджимается внутрь до x=139. Симметричный овал сбоку читается как
       бочка, а не как сгорбленная фигура: горб виден именно из разницы между
       выпуклой спиной и втянутой грудью.
       Фигура смотрит ВПРАВО. Для левого профиля кость масштабируется по x
       в минус — зеркалить рисунок отдельно не нужно.
       viewBox и пивот совпадают с torso.svg, поэтому подмена части не сдвигает
       ни голову, ни руки, ни ноги. -->
  <g filter="url(#ink)" fill="#0e0e0e">
    <path d="M140 18
             C 130 4, 96 -4, 74 12
             C 58 24, 48 50, 40 84
             C 32 122, 30 152, 34 182
             C 38 214, 46 250, 52 288
             L 58 302 L 64 286 L 70 304 L 77 288 L 84 306 L 91 290
             L 98 308 L 106 292 L 113 308 L 120 292 L 128 306 L 135 290
             L 143 302 L 149 286
             C 152 246, 153 208, 150 172
             C 147 140, 141 116, 139 92
             C 137 66, 141 40, 140 18 Z"/>
  </g>
</svg>
