<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 392" width="220" height="392">
  <defs>
    <filter id="ink" x="-18%" y="-18%" width="136%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- БАЛАХОН В ПРОФИЛЬ — КОРПУС ЗАВАЛЕН ВПЕРЁД, ПЕРЕДНЯЯ КРОМКА СО СКОСОМ.

       ГЛАВНОЕ ОТЛИЧИЕ ОТ ПРЕЖНЕГО РИСУНКА: передняя (лицевая) кромка больше
       НЕ СТОИТ ВЕРТИКАЛЬНО. Она идёт скосом — у шеи отступает от лица, книзу
       выходит вперёд и добирает полную ширину только к 55% высоты. Верхняя
       часть плаща за счёт этого у́же на 30%. Так плащ и рисуют в оригинале:
       узкий загривок, широкий подол, а между ними длинная диагональ, на
       которую садится маска. Прежний рисунок держал верх той же ширины, что
       и низ, — сбоку выходил столб, из которого спереди торчала голова.

       ПОЧЕМУ СКОС, А НЕ ПРОСТО СУЖЕНИЕ. Сузить можно с двух сторон, и это
       разные фигуры. Сужение со спины отодвигает массу назад — фигура
       выпрямляется, сутулость пропадает. Сужение С ЛИЦА оставляет спину
       дугой на месте и снимает ткань там, где её и не бывает: под
       подбородком. Отсюда правило — задняя кромка НЕ ТРОНУТА ни на единицу,
       весь скос забран у передней.

       ГЕОМЕТРИЯ СКОСА (единицы рисунка, лицо смотрит ВПРАВО):
         y=  26   передняя кромка 145   ширина 0.70 прежней
         y=  66        то же      148              0.72
         y= 100                   157              0.80
         y= 158                   168              0.88
         y= 214                   179              0.98
         ниже — как было, подол не тронут.
       Множитель ползёт плавно: перелома на кромке нет, есть длинная дуга.

       ЗАДНЯЯ КРОМКА (замер листа разворотов, клетка 3): u=0.28 у плеча →
       0.00 к 43% высоты → 0.06 у подола. Спина уходит назад и вниз одной
       дугой большого радиуса — это и есть наклон корпуса вперёд: не поворот
       всей фигуры (тогда уехал бы подол), а перераспределение массы внутри
       рисунка.

       ШИРИНА ЦЕЛИКОМ ЗАДАЁТСЯ МАСШТАБОМ КОСТИ, А НЕ ЭТИМ РИСУНКОМ. Пока
       мерка плаща ломалась о белую кайму руки (см. tools/turnaround.py,
       _close_x), профиль показывал 0.63 от анфаса при фактических 0.94, и
       рисунок правился под сломанные числа. Теперь отношение считается
       честно, и масштаб профиля выводится из него в tools/turn.py.

       Рисунок центрирован по пивоту (110), поэтому левый профиль получается
       отрицательным масштабом по x без сдвига. viewBox и пивот — как у
       torso.svg. -->
  <g filter="url(#ink)" fill="#0e0e0e">
    <path d="M130 4
             C 138 4, 143 12, 145 26
             C 146 40, 146 52, 148 66
             C 152 96, 160 128, 168 158
             C 174 180, 178 196, 179 214
             C 179 252, 177 284, 175 298
             L 168 310 L 160 294 L 152 312 L 144 296 L 136 314 L 128 298
             L 120 316 L 112 300 L 104 314 L 96 298 L 88 312 L 80 296
             L 72 310 L 66 294 L 62 306 L 61 292
             C 59 250, 57 200, 56 150
             C 56 110, 58 78, 66 52
             C 78 26, 104 8, 130 4 Z"/>
  </g>
</svg>
