<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 372" width="220" height="372">
  <defs>
    <filter id="ink" x="-18%" y="-18%" width="136%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#ink)">
    <!-- ТРАПЕЦИЯ, РАСШИРЯЮЩАЯСЯ КНИЗУ — замер кадра оригинала (_9 октября
         2024, 30с, фигура целиком): у плеч тело 1.42 ширины маски, у подола
         1.84, отношение 1.3. Раньше мы рисовали почти параллельную колонну,
         и силуэт читался коробкой. Шеи как таковой нет: масса начинается
         сразу под маской узкой и разъезжается вниз.
         Асимметрия: правый скат положе, правый край подола ниже. -->
    <path d="M86 0
             C70 10 50 30 40 56
             C30 130 20 250 12 352
             L206 344
             C200 250 190 130 180 56
             C170 30 150 10 134 0 Z" fill="#0e0e0e"/>
    <!-- (засученные рукава-пружины теперь на самих руках upper_arm_*.svg —
         на стыке рука↔тело, видны на фоне; в чёрной массе плаща они бы
         сливались чёрное-на-чёрном) -->
    <!-- БАХРОМА подола: густые короткие пряди разной длины и наклона.
         Крупные зубцы читались оборкой, средние — детским рисунком;
         у оригинала низ плаща именно мелкая частая бахрома. -->
    <path d="M10 336 l-7 22 l4 -11 l3 18 l3 -22 Z M20 336 l4 39 l5 -20 l4 31 l4 -39 Z M32 336 l0 56 l6 -28 l5 45 l6 -56 Z M48 336 l-4 33 l4 -16 l4 26 l4 -33 Z M60 336 l7 50 l5 -25 l4 40 l5 -50 Z M74 336 l3 27 l4 -14 l3 22 l3 -27 Z M84 336 l-1 44 l5 -22 l4 35 l4 -44 Z M96 336 l-5 61 l6 -30 l5 49 l6 -61 Z M112 336 l6 38 l4 -19 l4 30 l4 -38 Z M124 336 l2 55 l5 -28 l4 44 l5 -55 Z M138 336 l-2 32 l4 -16 l3 26 l3 -32 Z M148 336 l-6 49 l5 -24 l4 39 l4 -49 Z M160 336 l5 26 l6 -13 l5 21 l6 -26 Z M176 336 l1 43 l4 -22 l4 34 l4 -43 Z M188 336 l-3 60 l5 -30 l4 48 l5 -60 Z M202 336 l-7 37 l4 -18 l3 30 l3 -37 Z" fill="#0e0e0e"/>
    <!-- боковой клок (равномерные фестоны читались как
         оборка платья), плюс боковые клочья -->
    <path d="M190 176 q17 7 12 26 q-12 -6 -15 -15 Z" fill="#0e0e0e"/>
  </g>
</svg>
