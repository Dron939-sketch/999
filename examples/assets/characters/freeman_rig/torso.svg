<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 205" width="140" height="205">
  <defs>
    <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#ink)">
    <!-- тело: ШИРШИЕ плечи (1.6x головы) → колокол с рваным подолом -->
    <path d="M20 18
             Q70 2 120 18
             Q128 60 132 108
             Q138 172 140 200
             L132 190 126 202 119 188 112 203 104 189 96 202 88 188
             80 203 72 188 64 202 56 189 48 203 40 190 32 201 24 190
             L8 200 Q6 172 8 108 Q12 60 20 18 Z" fill="#0e0e0e"/>
    <!-- ПРУЖИНКИ-ЗАВИТКИ у плеч (подлинные кадры + эталон-разбор): плечо
         оканчивается спиральной "мятой" каракулей, из неё растёт рука -->
    <path d="M34 16 q-8 -2 -10 6 q-2 8 5 10 q7 2 9 -5 q2 -7 -4 -9 q-6 -2 -8 4 q-1 5 4 6"
          fill="none" stroke="#0e0e0e" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M26 30 q-7 0 -8 7 q-1 8 6 9 q7 1 8 -6 q1 -7 -5 -8"
          fill="none" stroke="#0e0e0e" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M106 16 q8 -2 10 6 q2 8 -5 10 q-7 2 -9 -5 q-2 -7 4 -9 q6 -2 8 4 q1 5 -4 6"
          fill="none" stroke="#0e0e0e" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M114 30 q7 0 8 7 q1 8 -6 9 q-7 1 -8 -6 q-1 -7 5 -8"
          fill="none" stroke="#0e0e0e" stroke-width="4.2" stroke-linecap="round"/>
    <!-- складки -->
    <path d="M56 50 Q62 118 58 166" fill="none" stroke="#1e1e1e" stroke-width="2.2"/>
    <path d="M84 50 Q78 118 82 166" fill="none" stroke="#1e1e1e" stroke-width="2.2"/>
    <path d="M44 30 Q40 42 34 48" fill="none" stroke="#1e1e1e" stroke-width="2"/>
    <path d="M96 30 Q100 42 106 48" fill="none" stroke="#1e1e1e" stroke-width="2"/>
  </g>
</svg>
