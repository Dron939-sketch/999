  <!-- КОПИРКА С ПОДЛИННОГО КАДРА (maxresdefault (4).jpg): плащ обведён potrace
       с оригинала вместе с настоящей бахромой подола и щетинистыми плечами.
       Верх СРЕЗАН: обводка одного кадра приносит его позу, а в референсе рука
       поднята и плечо ушло блоком. Выше среза стоит простая пластина плеч —
       она всё равно уходит под маску, которая рисуется поверх своей костью.
       Все мои прежние подолы (14 зубцов, 4 разрыва, 16 прядей) были попытками
