<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300" width="220" height="300">
  <defs>
    <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#ink)">
    <!-- ЭТАЛОН (разбор по частям + подлинные кадры): плащ — ОГРОМНАЯ
         бесформенная чёрная масса, ~60% фигуры, расширяется книзу и
         драпирует бо́льшую часть ног. Рваный хаотичный подол. Плечи ~1.6
         головы, из них растут пружинки-завитки, откуда идут руки.
         Pivot смещён на (110,12) — шея-центр, дети не съезжают. -->
    <path d="M60 18
             Q110 0 160 18
             Q176 70 186 140
             Q198 210 206 252
             L198 290 190 260 180 296 168 264 156 300 144 268 132 296
             120 262 108 300 96 266 84 298 72 262 60 300 48 266 36 294
             26 260 14 290
             Q6 210 18 140
             Q28 70 60 18 Z" fill="#0e0e0e"/>
    <!-- ПРУЖИНКИ-ЗАВИТКИ у плеч: плечо оканчивается спиральной «мятой»
         каракулей, из неё растёт рука (сдвиг +40x относительно старых) -->
    <path d="M74 16 q-8 -2 -10 6 q-2 8 5 10 q7 2 9 -5 q2 -7 -4 -9 q-6 -2 -8 4 q-1 5 4 6"
          fill="none" stroke="#0e0e0e" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M66 30 q-7 0 -8 7 q-1 8 6 9 q7 1 8 -6 q1 -7 -5 -8"
          fill="none" stroke="#0e0e0e" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M146 16 q8 -2 10 6 q2 8 -5 10 q-7 2 -9 -5 q-2 -7 4 -9 q6 -2 8 4 q1 5 -4 6"
          fill="none" stroke="#0e0e0e" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M154 30 q7 0 8 7 q1 8 -6 9 q-7 1 -8 -6 q-1 -7 5 -8"
          fill="none" stroke="#0e0e0e" stroke-width="4.2" stroke-linecap="round"/>
    <!-- складки драпировки (тёмно-серые, «жизнь» ткани) -->
    <path d="M92 54 Q100 150 92 240" fill="none" stroke="#1c1c1c" stroke-width="2.4"/>
    <path d="M128 54 Q120 150 130 238" fill="none" stroke="#1c1c1c" stroke-width="2.4"/>
    <path d="M70 120 Q60 190 66 250" fill="none" stroke="#1c1c1c" stroke-width="2"/>
    <path d="M150 120 Q160 190 154 250" fill="none" stroke="#1c1c1c" stroke-width="2"/>
  </g>
</svg>
