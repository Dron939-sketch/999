<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300" width="220" height="300">
  <defs>
    <filter id="ink" x="-18%" y="-18%" width="136%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#ink)">
    <!-- ЭТАЛОН: плащ — БЕСФОРМЕННОЕ неровное облако тьмы, НЕ симметричная
         юбка. Правый край шире и на ~20% длиннее левого; по бокам выступы
         и впадины (не только внизу); хаотичный рваный контур. Складок-
         линий нет — грязь даёт сам рваный силуэт + ink-displacement.
         Pivot (110,12) — шея-центр. -->
    <path d="M60 18
             Q110 0 160 18
             Q186 50 173 90
             Q165 126 201 166
             Q216 210 210 256
             L214 300 205 258 197 292 191 268 179 300 170 259 161 287
             149 300 141 253 129 289 121 271 110 301 99 258 91 285
             79 300 71 255 61 291 52 267 44 250
             Q31 214 41 178
             Q36 138 21 106
             Q30 92 26 70
             Q34 42 60 18 Z" fill="#0e0e0e"/>
    <!-- (засученные рукава-пружины теперь на самих руках upper_arm_*.svg —
         на стыке рука↔тело, видны на фоне; в чёрной массе плаща они бы
         сливались чёрное-на-чёрном) -->
    <!-- рваные боковые «клочья» ткани (выступы по бокам, не только внизу) -->
    <path d="M201 166 q14 6 10 20 q-8 -4 -12 -10 Z" fill="#0e0e0e"/>
    <path d="M21 106 q-13 4 -9 18 q9 -3 12 -9 Z" fill="#0e0e0e"/>
    <path d="M210 232 q13 8 8 22 q-9 -5 -11 -13 Z" fill="#0e0e0e"/>
  </g>
</svg>
