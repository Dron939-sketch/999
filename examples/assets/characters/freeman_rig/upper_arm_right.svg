<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 102" width="120" height="102"><defs><filter id="ink" x="-40%" y="-40%" width="180%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.0" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<!-- эталон-разбор: рука — тонкая чёрная сужающаяся линия с лёгким изгибом,
     без серой окантовки (на пересечении с рясой сливается — так и у оригинала) -->
<!-- РУКАВ-ПРУЖИНА. Кадр оригинала крупно (_9 октября 2024, 33с): это
     ВЕРТИКАЛЬНАЯ СТОПКА коротких мазков вдоль плеча — сжатая пружина сбоку,
     с рваным наружным краем, сходящая на нет книзу. Не круглая гроздь
     фестонов (так она читалась на размытом кадре 30с — ошибка чтения) и не
     одиночный виток, который прежде рисовался чёрным ВНУТРИ чёрной массы
     плаща и не был виден ни в одном кадре.
     Стопка ПЛОТНАЯ: соседние мазки почти смыкаются. Разреженная читается
     гребёнкой/пальцами, а не тканью. Смещена наружу от оси руки — там она
     приходится на фон и видна.
     viewBox расширен под рукав, ось руки поэтому на x=60 (см. pivot). -->
<g filter="url(#ink)">
    <rect x="52.0" y="-3.5" width="30.0" height="13.0" rx="6.5" fill="#0e0e0e" transform="rotate(6 67.0 3)"/>
    <rect x="52.0" y="6.0" width="34.0" height="12.0" rx="6.0" fill="#0e0e0e" transform="rotate(3 69.0 12)"/>
    <rect x="54.0" y="13.5" width="28.0" height="13.0" rx="6.5" fill="#0e0e0e" transform="rotate(-4 68.0 20)"/>
    <rect x="54.0" y="22.0" width="32.0" height="12.0" rx="6.0" fill="#0e0e0e" transform="rotate(5 70.0 28)"/>
    <rect x="54.0" y="30.5" width="26.0" height="11.0" rx="5.5" fill="#0e0e0e" transform="rotate(-3 67.0 36)"/>
    <rect x="58.0" y="38.0" width="22.0" height="10.0" rx="5.0" fill="#0e0e0e" transform="rotate(4 69.0 43)"/>
    <rect x="58.0" y="45.5" width="18.0" height="9.0" rx="4.5" fill="#0e0e0e" transform="rotate(-5 67.0 50)"/>
    <path d="M55 10 Q51 38 53 58 Q54 78 56 92 L63 92 Q64 78 64 58 Q66 38 65 10 Z" fill="#0e0e0e"/>
</g></svg>
