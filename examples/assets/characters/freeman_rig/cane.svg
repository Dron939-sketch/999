<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 260" width="40" height="260">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#ink)">
    <!-- ручка-набалдашник -->
    <ellipse cx="20" cy="16" rx="18" ry="14" fill="#0e0e0e"/>
    <!-- трость: тонкая прямая линия до пола -->
    <rect x="14" y="20" width="7" height="235" fill="#0e0e0e"/>
  </g>
</svg>
