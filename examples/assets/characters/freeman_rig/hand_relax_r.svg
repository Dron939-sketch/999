    <path d="M68.2 12.3 L56.9 41.7 L42.8 64.5 L37.4 61.9 L45.8 38.6 L51.8 7.7 Z" fill="#0e0e0e"/>
    <path d="M66.5 15.5 L47.8 33.5 L29.1 45.7 L25.3 41.1 L39.0 26.1 L53.5 4.5 Z" fill="#0e0e0e"/>
  </g>
</svg>
