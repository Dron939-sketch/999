<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" width="220" height="120">
  <!-- КАМЕНЬ НА КРЫШКЕ — «ДЕРЖАТЬСЯ».
       Был нарисован в `gnev-kryshka.svg` и лежал неподвижно весь пулемёт.
       Метафора при этом статична ровно там, где текст говорит о срыве:
       «утром — держаться, к вечеру — сорвались». Теперь камень отдельный
       предмет: он вдавливается на «держа́ться», подскакивает на «сорвали́сь»
       и садится обратно — крышка держит, пока держит.

       Рубленый силуэт: грани и углы, а не гладкий овал. Гладкий читался
       батоном, а две дуги-трещины складывались в улыбку (раунд 3 зала).
       Плоский низ — камень СТОИТ, а не висит. -->
  <path d="M8 116 L20 62 L52 22 L100 4 L152 10 L192 36 L210 74 L214 116 Z"
        fill="#141410"/>
  <g stroke="#f7f7f4" stroke-width="5" fill="none" stroke-linejoin="round">
    <path d="M60 42 L88 64 L74 92"/>
    <path d="M122 26 L138 58 L170 66"/>
  </g>
</svg>
