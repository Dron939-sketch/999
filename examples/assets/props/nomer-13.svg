<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="88" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- НОМЕР КУРСА «13» на балахон, справа на груди. Белая тушь: балахон —
       сплошное чёрное пятно, чёрная цифра на нём не читается вообще.

       ТРЕТЬЯ ДВУЗНАЧНАЯ МЕТКА СЕРИИ, и правило то же, что у «12» и «10»: две
       цифры внутри готового кружка рука ставит ТЕСНЕЕ типографского интервала —
       места мало, и она поджимает. Разведёшь их «правильно» — выйдет наборный
       шрифт в кружке, то есть печать, а не пометка от руки.

       ТРОЙКА ОПАСНЕЕ ДВОЙКИ И НОЛЯ. У неё две петли, и на общем плане, где
       метка занимает три десятка пикселей, они схлопываются в пятно и цифра
       читается восьмёркой. Поэтому верхняя петля намеренно МЕЛЬЧЕ нижней и
       разомкнута слева: разрыв держит просвет там, где он нужнее всего.

       Круг рваный и незамкнутый, со своим рисунком разрывов и своим наклоном:
       у восьмёрки один разрыв и наклон -24, у девятки 37, у двенадцати два
       разрыва и -63, у десятки 112. Seed фильтра тоже свой (88) — при общем
       seed дрожание линии совпало бы у всех меток, и серия читалась бы одним
       штампом с меняющимся числом.

       Единица рисуется двумя движениями — флажок и стойка, БЕЗ нижней засечки:
       от руки её обычно не ставят. -->
  <g filter="url(#ink)">
    <circle cx="120" cy="120" r="86" fill="none" stroke="#f2f2ec" stroke-width="9"
            stroke-linecap="round" stroke-dasharray="355 48 90 44" transform="rotate(-8 120 120)"/>
    <g transform="translate(57.5 58.1) scale(0.86)" fill="none" stroke="#f2f2ec"
       stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <!-- «1»: флажок и стойка, стойка чуть завалена вправо, как от руки -->
      <path d="M8 32 L31 11"/>
      <path d="M31 11 C33 50 34 96 33 138"/>
      <!-- «3»: верхняя петля мельче и разомкнута слева, нижняя шире -->
      <path d="M62 20 C74 6 100 4 112 18 C122 30 114 48 96 55"/>
      <path d="M96 55 C122 58 136 78 130 102 C124 126 96 138 68 128"/>
    </g>
  </g>
</svg>
