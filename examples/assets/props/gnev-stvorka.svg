<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 480" width="160" height="480">
  <!-- СТВОРКА ДВЕРИ, КОТОРАЯ ЗАКРЫВАЕТСЯ.
       Была частью `gnev-dver.svg` и стояла приоткрытой всю реплику. Дверь,
       которая ЗАКРЫВАЕТСЯ на словах «только на тех, кто не уйдёт», говорит
       то же самое, но происходит при зрителе: щель со светом и ребёнком
       сужается, пока он это слышит.

       Средний тон с жирным контуром: сплошная чёрная створка съела бы фигуру,
       стоящую рядом (LOCATION_STYLE, «крупные массы фона — не чёрные»).
       Ручка — на левой кромке, со стороны щели. -->
  <path d="M6 6 L154 22 L154 474 L6 470 Z"
        fill="#5f625b" stroke="#141410" stroke-width="8"/>
  <circle cx="34" cy="252" r="13" fill="#141410"/>
  <path d="M28 60 L28 444" stroke="#141410" stroke-width="3" fill="none" opacity="0.55"/>
