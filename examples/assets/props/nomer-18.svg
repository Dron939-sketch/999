<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- НОМЕР КУРСА «18» на балахон, справа на груди. Белая тушь: балахон —
       сплошное чёрное пятно, чёрная цифра на нём не читается вообще.
       Круг рваный и незамкнутый — метка от руки, а не печать. -->
  <g filter="url(#ink)">
    <circle cx="120" cy="120" r="86" fill="none" stroke="#f2f2ec" stroke-width="9"
            stroke-linecap="round" stroke-dasharray="470 60" transform="rotate(-24 120 120)"/>
    <g transform="translate(52.4 76.6) scale(0.62)" fill="none" stroke="#f2f2ec"
       stroke-width="20" stroke-linecap="round" stroke-linejoin="round"><path d="M22 34 L54 6 L54 136" transform="translate(0 0)"/><path d="M52 66 C28 66 12 52 12 34 C12 14 30 4 52 4 C74 4 92 14 92 34 C92 52 76 66 52 66 Z M52 66 C80 66 98 82 98 104 C98 124 78 136 52 136 C26 136 6 124 6 104 C6 82 24 66 52 66 Z" transform="translate(118 0)"/></g>
  </g>
</svg>
