<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="93" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- НОМЕР КУРСА «9» на балахон, справа на груди. Белая тушь: балахон —
       сплошное чёрное пятно, чёрная цифра на нём не читается вообще.
       Круг рваный и незамкнутый — метка от руки, а не печать; наклон и
       разрыв другие, чем у восьмёрки, иначе две метки серии выглядят
       одним штампом с подменённой цифрой.
       Девятка рисуется ОДНИМ движением: петля сверху и хвост вниз с
       уводом влево — рука не дотягивает хвост до вертикали, и это видно.
       Петля намеренно не замкнута в месте стыка с хвостом.
       Seed фильтра свой (93): при общем seed дрожание линии совпало бы у
       обеих цифр, и подмена читалась бы как копия. -->
  <g filter="url(#ink)">
    <circle cx="120" cy="120" r="86" fill="none" stroke="#f2f2ec" stroke-width="9"
            stroke-linecap="round" stroke-dasharray="430 55 60 40" transform="rotate(37 120 120)"/>
    <g transform="translate(80.0 58.0) scale(0.86)" fill="none" stroke="#f2f2ec"
       stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M84 62 C84 42 70 26 50 26 C30 26 15 41 15 60 C15 79 30 93 49 93 C67 93 81 81 84 64"/>
      <path d="M84 64 C84 92 80 116 72 133 C66 145 56 152 44 155"/>
    </g>
  </g>
</svg>
