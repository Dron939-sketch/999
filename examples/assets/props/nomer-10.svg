<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="74" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- НОМЕР КУРСА «10» на балахон, справа на груди. Белая тушь: балахон —
       сплошное чёрное пятно, чёрная цифра на нём не читается вообще.

       ВТОРАЯ ДВУЗНАЧНАЯ МЕТКА СЕРИИ, и правило двузначных то же, что у «12»:
       две цифры внутри готового кружка рука ставит ТЕСНЕЕ типографского
       интервала — места мало, и она поджимает. Разведёшь их «правильно» —
       выйдет наборный шрифт в кружке, то есть печать, а не пометка от руки.

       НОЛЬ ЗДЕСЬ ШИРЕ ДВОЙКИ ИЗ «12», И ЭТО ЗАСТАВЛЯЕТ ПОДЖАТЬ ЕДИНИЦУ
       СИЛЬНЕЕ. Овал нельзя сузить: узкий ноль на балахоне читается единицей
       или скобкой, особенно на общем плане, где метка занимает три десятка
       пикселей. Поэтому единица прижата к нолю почти вплотную и стоит чуть
       левее, чем в «12».

       Круг рваный и незамкнутый, СО СВОИМ рисунком разрывов и своим наклоном:
       у восьмёрки один разрыв и наклон -24, у девятки наклон 37, у двенадцати
       два разрыва и -63. Seed фильтра тоже свой (74) — при общем seed дрожание
       линии совпало бы у всех меток, и серия читалась бы одним штампом с
       меняющимся числом.

       Единица рисуется двумя движениями — флажок и стойка, БЕЗ нижней
       засечки: от руки её обычно не ставят. Ноль — ОДНИМ движением, и петля
       намеренно не сомкнута сверху: перо ушло с бумаги раньше, чем встретило
       начало. Это единственное место метки, где видно направление руки. -->
  <g filter="url(#ink)">
    <circle cx="120" cy="120" r="86" fill="none" stroke="#f2f2ec" stroke-width="9"
            stroke-linecap="round" stroke-dasharray="410 50 72 38" transform="rotate(112 120 120)"/>
    <g transform="translate(56.5 58.1) scale(0.86)" fill="none" stroke="#f2f2ec"
       stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <!-- «1»: флажок и стойка, стойка чуть завалена вправо, как от руки -->
      <path d="M7 33 L30 11"/>
      <path d="M30 11 C32 50 33 96 32 138"/>
      <!-- «0»: один овал, начатый слева сверху и не дотянутый до начала -->
      <path d="M96 16 C74 16 60 45 60 76 C60 108 74 134 97 134
               C120 134 134 108 134 76 C134 47 122 20 103 16"/>
    </g>
  </g>
</svg>
