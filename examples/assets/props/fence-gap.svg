<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 420" width="2400" height="420">
<!-- Забор со щелью — вещдок «Лазейки»: доски целы, дыра в зазоре.
     Забор ШИРЕ КАДРА (5.7:1). Щелей в нём две: открытая (доли 0.375–0.44) —
     та, что латают на взлёте, и прикрытая (доли 0.684–0.718) — её закрывает
     отдельная доска board.svg, которая на жале отваливается. Дыра была в
     заборе с самого начала, просто держалась на одной доске.
     В самих щелях НЕТ и перекладин: проход свободен на всю высоту.
     Стиль LOCATION_STYLE.md: плоская тушь #141410, живая линия через #ink. -->
<defs><filter id="ink" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="41" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<g filter="url(#ink)">
  <!-- перекладины: рвутся на обеих щелях -->
  <rect x="10"   y="126" width="880"  height="24" fill="#141410"/>
  <rect x="10"   y="306" width="880"  height="24" fill="#141410"/>
  <rect x="1070" y="126" width="548" height="24" fill="#141410"/>
  <rect x="1730" y="126" width="360" height="24" fill="#141410"/>
  <rect x="1070" y="306" width="548" height="24" fill="#141410"/>
  <rect x="1730" y="306" width="360" height="24" fill="#141410"/>
  <rect x="2090" y="126" width="300" height="24" fill="#141410"/>
  <rect x="2090" y="306" width="300" height="24" fill="#141410"/>
  <!-- доски слева от первой щели -->
  <g fill="#141410">
    <rect x="30"  y="30" width="58" height="380" rx="6"/>
    <rect x="112" y="44" width="56" height="370" rx="6" transform="rotate(-1.2 140 230)"/>
    <rect x="192" y="26" width="60" height="386" rx="6"/>
    <rect x="276" y="40" width="56" height="372" rx="6" transform="rotate(1.4 304 226)"/>
    <rect x="356" y="30" width="58" height="380" rx="6"/>
    <rect x="438" y="46" width="56" height="366" rx="6" transform="rotate(-1.6 466 229)"/>
    <rect x="518" y="28" width="58" height="384" rx="6"/>
    <rect x="600" y="42" width="56" height="370" rx="6" transform="rotate(1.1 628 227)"/>
    <rect x="680" y="30" width="58" height="382" rx="6"/>
    <rect x="762" y="44" width="56" height="368" rx="6" transform="rotate(-1.3 790 228)"/>
    <!-- крайняя доска щели отклонилась наружу, как отжатая плечом -->
    <rect x="842" y="34" width="56" height="380" rx="6" transform="rotate(4.5 870 224)"/>
  </g>
  <!-- ЩЕЛЬ ПЕРВАЯ: 898–1072, пусто -->
  <!-- доски между щелями -->
  <g fill="#141410">
    <rect x="1076" y="36" width="56" height="378" rx="6" transform="rotate(-4.2 1104 225)"/>
    <rect x="1156" y="28" width="58" height="384" rx="6"/>
    <rect x="1238" y="44" width="56" height="368" rx="6" transform="rotate(1.2 1266 228)"/>
    <rect x="1318" y="30" width="58" height="382" rx="6"/>
    <rect x="1400" y="42" width="56" height="370" rx="6" transform="rotate(-1.4 1428 227)"/>
    <rect x="1480" y="28" width="58" height="384" rx="6"/>
    <rect x="1562" y="38" width="56" height="374" rx="6" transform="rotate(2.2 1590 225)"/>
    <rect x="1724" y="44" width="56" height="368" rx="6" transform="rotate(-1.1 1752 228)"/>
    <rect x="1804" y="28" width="58" height="384" rx="6"/>
    <rect x="1886" y="40" width="56" height="372" rx="6" transform="rotate(1.6 1914 226)"/>
    <rect x="1966" y="30" width="58" height="380" rx="6"/>
    <rect x="2048" y="36" width="56" height="376" rx="6" transform="rotate(3.8 2076 224)"/>
  </g>
  <!-- доски справа -->
  <g fill="#141410">
    <rect x="2130" y="34" width="56" height="378" rx="6" transform="rotate(-1.8 2158 223)"/>
    <rect x="2210" y="28" width="58" height="384" rx="6"/>
    <rect x="2272" y="32" width="58" height="380" rx="6" transform="rotate(-3.4 2301 222)"/>
    <rect x="2352" y="30" width="48" height="382" rx="6"/>
  </g>
</g>
</svg>
