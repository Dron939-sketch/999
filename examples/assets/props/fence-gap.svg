<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420">
<!-- Забор со щелью — вещдок «Лазейки»: доски целы, дыра в зазоре.
     Стиль LOCATION_STYLE.md: плоская тушь #141410, живая линия через #ink. -->
<defs><filter id="ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<g filter="url(#ink)">
  <!-- перекладины -->
  <rect x="10" y="120" width="1080" height="26" fill="#141410"/>
  <rect x="10" y="300" width="1080" height="26" fill="#141410"/>
  <!-- доски слева от щели -->
  <g fill="#141410">
    <rect x="30"  y="30" width="58" height="380" rx="6"/>
    <rect x="112" y="44" width="56" height="370" rx="6" transform="rotate(-1.2 140 230)"/>
    <rect x="192" y="26" width="60" height="386" rx="6"/>
    <rect x="276" y="40" width="56" height="372" rx="6" transform="rotate(1.4 304 226)"/>
    <rect x="356" y="30" width="58" height="380" rx="6"/>
    <rect x="438" y="46" width="56" height="366" rx="6" transform="rotate(-1.6 466 229)"/>
    <rect x="518" y="28" width="58" height="384" rx="6"/>
  </g>
  <!-- ЩЕЛЬ: между этой парой досок зазор в полторы доски, крайние чуть развёрнуты -->
  <g fill="#141410">
    <rect x="600" y="38" width="56" height="374" rx="6" transform="rotate(3.4 628 225)"/>
    <rect x="760" y="34" width="56" height="378" rx="6" transform="rotate(-3.8 788 223)"/>
  </g>
  <!-- доски справа от щели -->
  <g fill="#141410">
    <rect x="842" y="28" width="58" height="384" rx="6"/>
    <rect x="924" y="44" width="56" height="368" rx="6" transform="rotate(1.2 952 228)"/>
    <rect x="1004" y="30" width="58" height="382" rx="6"/>
  </g>
</g>
</svg>
