<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 150" width="90" height="150">
  <defs>
    <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- КРЫСА НА СТЕНЕ — вид СО СПИНЫ, мордой вверх.
       Задняя стена обращена к камере, значит того, кто по ней лезет, зритель
       видит сверху-сзади: тушку в ракурсе, лапы врастопырку, хвост свисает
       вниз. Прежде мы брали вид СБОКУ и поворачивали его на −80° — получалась
       не крыса на стене, а крыса, лежащая на боку и приклеенная к ней.
       Поворотом ракурс не заменяется: нужен свой рисунок под свою плоскость.
       Морда вверху viewBox — предмет тянется в сторону движения. -->
  <g filter="url(#ink)" fill="#141410">
    <!-- хвост: свисает вниз, слегка змейкой (гравитация, а не ход) -->
    <path d="M42 104 Q34 122 40 136 Q44 146 40 148 Q32 140 30 126 Q28 112 38 102 Z"/>
    <!-- тело в ракурсе: короткое и широкое, сходится к морде вверху -->
    <path d="M45 14
             Q62 18 66 46
             Q70 78 58 104
             Q45 112 32 104
             Q20 78 24 46
             Q28 18 45 14 Z"/>
    <!-- уши по бокам головы -->
    <circle cx="33" cy="24" r="8"/>
    <circle cx="57" cy="24" r="8"/>
    <!-- лапы врастопырку: две пары в стороны, как у лезущего по вертикали -->
    <g stroke="#141410" stroke-width="6" stroke-linecap="round">
      <line x1="28" y1="42" x2="9" y2="34"/>
      <line x1="62" y1="42" x2="81" y2="34"/>
      <line x1="29" y1="88" x2="12" y2="98"/>
      <line x1="61" y1="88" x2="78" y2="98"/>
    </g>
  </g>
  <!-- два глаза-блика: со спины видно оба, в отличие от вида сбоку -->
  <circle cx="39" cy="27" r="2.2" fill="#d4d7cf"/>
  <circle cx="51" cy="27" r="2.2" fill="#d4d7cf"/>
</svg>
