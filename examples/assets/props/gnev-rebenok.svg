<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 330" width="90" height="330">
  <!-- РЕБЁНОК, КОТОРЫЙ УХОДИТ ИЗ КАДРА.
       Был нарисован прямо в `gnev-kuhnya.svg` и стоял в проёме неподвижно все
       три с половиной секунды хука. Стоящий силуэт — деталь фона; уходящий —
       событие, и происходит оно ровно на словах «из-за пролитого чая».

       Профиль, смотрит ВПРАВО (канон пропов), шаг в развороте: дальняя нога
       вынесена, ближняя отстала. Сплошной чёрный: он стоит в светлом дверном
       проёме и читается силуэтом.

       Натуральный размер 90×330 — это ребёнок ростом чуть выше пояса взрослого
       в кадре 1280×720. -->
  <g fill="#141410">
    <!-- голова -->
    <circle cx="46" cy="30" r="26"/>
    <!-- шея-просвет держится тем, что плечи начинаются ниже -->
    <path d="M28 66 Q46 56 64 66 L70 176 Q46 186 22 176 Z"/>
    <!-- дальняя рука вдоль тела -->
    <path d="M24 76 L14 158" stroke="#141410" stroke-width="13" stroke-linecap="round" fill="none"/>
    <!-- ближняя рука отведена назад: шаг -->
    <path d="M68 80 L82 150" stroke="#141410" stroke-width="13" stroke-linecap="round" fill="none"/>
    <!-- ноги в шаге: передняя вынесена вперёд, задняя отстала -->
    <path d="M30 172 L20 262 L16 320" stroke="#141410" stroke-width="17" stroke-linecap="round" fill="none"/>
    <path d="M60 172 L72 258 L78 318" stroke="#141410" stroke-width="17" stroke-linecap="round" fill="none"/>
    <!-- стопы -->
    <path d="M10 320 L34 316" stroke="#141410" stroke-width="12" stroke-linecap="round"/>
    <path d="M72 318 L92 314" stroke="#141410" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
