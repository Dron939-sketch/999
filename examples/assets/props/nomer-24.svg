<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- НОМЕР КУРСА «24» на балахон, справа на груди. Белая тушь: балахон —
       сплошное чёрное пятно, чёрная цифра на нём не читается вообще.
       Круг рваный и незамкнутый — метка от руки, а не печать. -->
  <g filter="url(#ink)">
    <circle cx="120" cy="120" r="86" fill="none" stroke="#f2f2ec" stroke-width="9"
            stroke-linecap="round" stroke-dasharray="470 60" transform="rotate(-24 120 120)"/>
    <g transform="translate(52.4 76.6) scale(0.62)" fill="none" stroke="#f2f2ec"
       stroke-width="20" stroke-linecap="round" stroke-linejoin="round"><path d="M10 36 C10 12 34 4 52 4 C78 4 92 22 92 44 C92 78 22 96 10 136 L92 136" transform="translate(0 0)"/><path d="M70 136 L70 4 L8 96 L96 96" transform="translate(118 0)"/></g>
  </g>
</svg>
