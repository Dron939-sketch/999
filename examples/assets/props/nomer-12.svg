<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <filter id="ink" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- НОМЕР КУРСА «12» на балахон, справа на груди. Белая тушь: балахон —
       сплошное чёрное пятно, чёрная цифра на нём не читается вообще.

       ПЕРВАЯ ДВУЗНАЧНАЯ МЕТКА СЕРИИ, и одной цифрой больше — это не мелочь.
       Две цифры внутри готового кружка рука ставит ТЕСНЕЕ типографского
       интервала: места мало, и она поджимает. Разведёшь их «правильно» —
       выйдет наборный шрифт в кружке, то есть печать, а не пометка от руки.
       Поэтому единица прижата к двойке почти вплотную, и обе уже, чем
       рисовалась бы одиночная цифра.

       Круг рваный и незамкнутый, с ДВУМЯ разрывами — свой рисунок, не как у
       восьмёрки (один разрыв, наклон -24) и не как у девятки (наклон 37).
       Seed фильтра тоже свой (47): при общем seed дрожание линии совпало бы у
       всех меток, и серия читалась бы одним штампом с меняющимся числом.

       Единица рисуется двумя движениями — флажок и стойка, БЕЗ нижней
       засечки: от руки её обычно не ставят. Двойка одним: петля сверху,
       диагональ вниз-влево и основание вправо. Петля намеренно не замкнута в
       начале — перо опустилось уже на ходу. -->
  <g filter="url(#ink)">
    <circle cx="120" cy="120" r="86" fill="none" stroke="#f2f2ec" stroke-width="9"
            stroke-linecap="round" stroke-dasharray="380 55 65 40" transform="rotate(-63 120 120)"/>
    <g transform="translate(58.1 58.1) scale(0.86)" fill="none" stroke="#f2f2ec"
       stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <!-- «1»: флажок и стойка, стойка чуть завалена вправо, как от руки -->
      <path d="M8 32 L31 11"/>
      <path d="M31 11 C33 50 34 96 33 138"/>
      <!-- «2»: петля, диагональ, основание. Начало петли не замкнуто -->
      <path d="M60 41 C60 19 79 6 99 6 C119 6 133 21 133 41 C133 61 118 74 62 132"/>
      <path d="M62 132 L137 130"/>
    </g>
  </g>
</svg>
