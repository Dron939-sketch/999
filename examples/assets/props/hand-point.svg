<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340">
  <defs>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="1" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- РУКА-В-КАМЕРУ (Волна 2, HOLLYWOOD §8): гигантская кисть с указательным
       пальцем, тычущим ПРЯМО В ЗРИТЕЛЯ (форшортенинг: подушечка пальца огромная,
       ладонь меньше и дальше). Фирменный жест «это ты». Чёрная тушь, появляется
       из нижнего угла кадра телепорт-паттерном. -->
  <g filter="url(#ink)" fill="#14140f">
    <!-- предплечье из угла -->
    <path d="M0 340 L110 340 Q150 290 180 250 L120 200 Q60 270 0 340 Z"/>
    <!-- ладонь/кулак (сжатые пальцы намёком) -->
    <ellipse cx="185" cy="205" rx="85" ry="72" transform="rotate(-28 185 205)"/>
    <path d="M120 235 Q100 210 118 190 L150 215 Z"/>
    <!-- согнутые пальцы кулака (бугры) -->
    <circle cx="235" cy="255" r="26"/>
    <circle cx="200" cy="272" r="24"/>
    <circle cx="163" cy="277" r="22"/>
    <!-- УКАЗАТЕЛЬНЫЙ ПАЛЕЦ на зрителя: конус к камере -->
    <path d="M212 170 Q235 120 268 88 L332 132 Q300 170 262 206 Q232 195 212 170 Z"/>
    <!-- подушечка пальца (ближе всех к камере — самая большая) -->
    <circle cx="305" cy="105" r="58"/>
    <!-- ноготь-блик -->
    <ellipse cx="318" cy="92" rx="20" ry="14" fill="#3a3a32" transform="rotate(-30 318 92)"/>
  </g>
</svg>
