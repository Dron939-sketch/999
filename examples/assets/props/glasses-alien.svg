<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" width="420" height="170">
  <defs>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="1" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- ЧУЖИЕ ОЧКИ — сквозная метафора интро «Теории личности»: зритель уже
       смотрит на людей через линзу, только надел её не он. Круглые «дедовские»
       оправы: намеренно старомодные, чтобы читалось «донашиваю чужое».
       Оправы ЖИРНЫЕ и ЧЁРНЫЕ (канон флэт-инк), стёкла — светлая заливка чуть
       темнее маски, чтобы поверх белого яйца линза читалась, а не исчезала.
       Правая дужка длиннее левой: асимметрия покоя, как у всей фигуры. -->
  <g filter="url(#ink)">
    <!-- дужки (уходят за уши) -->
    <path d="M14 74 L60 68 L62 84 L16 90 Z" fill="#14140f"/>
    <path d="M406 78 L356 70 L354 86 L404 96 Z" fill="#14140f"/>
    <!-- Стёкла ПУСТЫЕ. Первая версия была с заливкой — и очки закрыли глаза:
         маска осталась без взгляда, а мимика (57 поз меняют именно глаза) ушла
         в никуда. Линза должна читаться ободом, а смотреть зритель обязан
         сквозь неё. -->
    <!-- оправы -->
    <circle cx="140" cy="86" r="72" fill="none" stroke="#14140f" stroke-width="17"/>
    <circle cx="286" cy="84" r="68" fill="none" stroke="#14140f" stroke-width="16"/>
    <!-- перемычка -->
    <path d="M208 74 Q213 62 220 74 L218 88 Q213 80 210 88 Z" fill="#14140f"/>
    <!-- Бликов нет. Косая полоса поверх чёрного глаза читалась светлым
         пятном и превращала зрачок в дырку — линза чище пустой. -->
  </g>
</svg>
