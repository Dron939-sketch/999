<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 24" width="60" height="24">
  <defs><filter id="ink" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="1" seed="31" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="0.9" xChannelSelector="R" yChannelSelector="G"/>
  </filter></defs>
  <!-- Сигарета: белое тело, тёмный фильтр, тлеющий уголёк и дымок.
       Уголёк красный — он проходит через монохромный тракт как цветное
       пятно (см. apply_monochrome), и в чёрно-белом кадре тлеет. -->
  <g filter="url(#ink)">
    <rect x="6" y="8" width="34" height="8" rx="2" fill="#eef1ec" stroke="#0e0e0e" stroke-width="2.4"/>
    <rect x="38" y="7" width="12" height="10" rx="2" fill="#0e0e0e"/>
    <circle cx="6" cy="12" r="4" fill="#d8452c"/>
    <path d="M4 8 q-5 -5 -1 -8 q5 4 1 8" fill="none" stroke="#0e0e0e" stroke-width="1.6" opacity="0.55"/>
  </g>
</svg>
