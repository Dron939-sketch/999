<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <defs>
    <filter id="ink" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="1" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- ЛАМПА — настольная, под абажуром, ГОРЯЩАЯ. Разрыв шаблона в картинке
       (STIL-FRIMENA.md §II.8): предмет исправен и не на своём месте — он горит
       там, где светло, и там, где стола нет вовсе. Стоит во всех локациях
       ролика, ни разу не назван словом и не тронут рукой: назвать его значит
       объяснить якорь монолога.

       Рисуется вручную, как кормушка: генератор даёт локацию целиком, а здесь
       нужна ОДНА вещь поверх готового кадра. Тушь плоская, обводка дрожащая —
       тот же язык, что у сетов.

       ЦВЕТА В ЭТОМ ФАЙЛЕ НЕТ, и это не упущение. Гейт `tools/cvet.py` считает
       цветное пятно ТОЛЬКО по локациям, реквизит он не видит; тёплый свет
       живёт в самой кухне (`stress-kuhnya-lampa`), где на столешнице лежит
       тёплая лужа света, и цветная локация в ролике ровно одна. Здесь горение
       читается штрихом: короткие лучи из-под кромки абажура. Своей лужи у
       пропа нет намеренно — она дублировала бы ту, что уже в кухне, и в
       остальных локациях выдавала бы свет там, где цвета быть не должно. -->
  <g filter="url(#ink)" fill="none" stroke="#141410" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- абажур: трапеция, широкая книзу -->
    <path d="M74 40 L166 40 L196 128 L44 128 Z" fill="#d4d7cf"/>
    <!-- нижняя кромка абажура: толщина -->
    <path d="M44 128 L196 128"/>
    <!-- рёбра абажура: две вертикальные засечки -->
    <g stroke-width="4">
      <path d="M104 44 L88 124"/>
      <path d="M140 44 L154 124"/>
    </g>
    <!-- стойка -->
    <path d="M120 128 L120 244"/>
    <!-- основание: приплюснутое блюдце -->
    <path d="M72 252 C72 238 168 238 168 252 C168 264 72 264 72 252 Z" fill="#d4d7cf"/>
    <!-- ЛУЧИ: горение показано штрихом, а не цветом. Короткие, расходящиеся
         из-под кромки абажура — по три с каждой стороны и один вниз. -->
    <g stroke-width="5">
      <path d="M50 142 L34 160"/>
      <path d="M84 146 L76 168"/>
      <path d="M120 148 L120 172"/>
      <path d="M156 146 L164 168"/>
      <path d="M190 142 L206 160"/>
    </g>
  </g>
</svg>
