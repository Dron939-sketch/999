<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340">
  <defs>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="1" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- ВЕЛОСИПЕД, ВИД СБОКУ — реквизит серии. Приехал из «Истории религий», где
       он был нарисован ВНУТРИ сета детской и потому не мог сыграть больше нигде.
       Здесь он вынут в отдельный предмет: его можно прислонить к любой стене.
       Рисунок держится на пяти формах — два колеса, рама, руль, седло, — потому
       что мелочь на общем плане в ч/б всё равно схлопнется в кашу.
       Стоит НА ПОДНОЖКЕ, слегка накренён: ровно стоящий велосипед читается
       чертежом, а не вещью, которой пользуются. -->
  <g filter="url(#ink)" fill="none" stroke="#14140f" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- колёса -->
    <circle cx="112" cy="232" r="88"/>
    <circle cx="404" cy="232" r="88"/>
    <!-- спицы намёком: по три на колесо, иначе в ч/б каша -->
    <g stroke-width="5">
      <path d="M112 232 L112 148 M112 232 L184 274 M112 232 L40 274"/>
      <path d="M404 232 L404 148 M404 232 L476 274 M404 232 L332 274"/>
    </g>
    <!-- рама: два треугольника -->
    <path d="M112 232 L214 232 L268 108 L214 232 M214 232 L322 232"/>
    <path d="M268 108 L322 232 M268 108 L214 232"/>
    <path d="M322 232 L404 232"/>
    <!-- вилка переднего колеса -->
    <path d="M322 232 L360 128"/>
    <!-- руль -->
    <path d="M360 128 L336 104 M360 128 L392 118"/>
    <!-- седло -->
    <path d="M268 108 L262 92"/>
    <path d="M228 88 L296 92" stroke-width="16"/>
    <!-- педаль -->
    <g stroke-width="7">
      <path d="M214 232 L246 268 L274 262"/>
    </g>
    <!-- подножка -->
    <path d="M214 244 L176 300" stroke-width="7"/>
  </g>
</svg>
