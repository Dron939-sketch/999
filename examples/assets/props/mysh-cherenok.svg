<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 600" width="40" height="600">
  <!-- ЧЕРЕНОК ГРАБЕЛЬ, КОТОРЫЙ БЬЁТ В ЛОБ.
       Движок вращает проп вокруг ЦЕНТРА рисунка, а черенок обязан вращаться
       вокруг своего основания — там, где он сидит в зубьях. Поэтому рисунок
       вдвое выше черенка: сам черенок занимает ВЕРХНЮЮ половину, нижняя —
       пустая. Центр рисунка = основание черенка = ось вращения.

       Зубья нарисованы в сете `mysh-pole` (они лежат и не двигаются), проп
       ставится основанием на их левый край: `at (0.469, 0.924)`, высота 600 →
       `scales 2.78`. Лежит при `rotates 90` (вправо по дороге), взлетает до
       `rotates -15` — в лоб персонажу, стоящему слева. -->
  <path d="M20 8 L20 300" stroke="#141410" stroke-width="14" stroke-linecap="round"/>
  <path d="M20 296 L20 302" stroke="#141410" stroke-width="20" stroke-linecap="round"/>
</svg>
