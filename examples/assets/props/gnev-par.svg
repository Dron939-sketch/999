<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 90" width="40" height="90">
  <!-- ПАР НАД КРУЖКОЙ. Утренняя кухня — самая длинная реплика ролика (восемь
       секунд) и была самой мёртвой: персонаж вошёл шагом и встал, а в кадре не
       двигалось ничего. Пар играет ровно то, о чём реплика: утро, разговор,
       тепло — и делает это движением, а не подписью.

       Две струйки, тонкие, чёрные: на светлом поле читается только контраст.
       Проп поднимается и растворяется (`moves-to` + `fades-to`). -->
