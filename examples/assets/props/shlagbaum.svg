<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420">
<!-- Шлагбаум с табличкой — вещдок второго интро «Лазейки»: правило реально,
     но оно про ПРОЕЗД, а герой идёт пешком. Стрела опущена и перекрывает
     дорогу, НО кончается на доле 0.93 — справа остаётся проход, которым
     персонаж и пользуется на взлёте. Табличка пустая: надпись впечатывает
     движок (text), чтобы её было видно при выключенном звуке.
     Стиль LOCATION_STYLE.md: плоская тушь #141410, живая линия через #ink. -->
<defs><filter id="ink" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.017" numOctaves="2" seed="23" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<g filter="url(#ink)">
  <rect x="60" y="60" width="70" height="352" rx="8" fill="#141410"/>
  <rect x="20" y="386" width="150" height="30" rx="8" fill="#141410"/>
  <circle cx="95" cy="150" r="46" fill="#141410"/>
  <g fill="#141410">
    <rect x="130" y="172" width="150" height="56" rx="6"/>
    <rect x="330" y="172" width="150" height="56" rx="6"/>
    <rect x="530" y="174" width="150" height="56" rx="6"/>
    <rect x="730" y="176" width="150" height="56" rx="6"/>
    <rect x="930" y="178" width="150" height="56" rx="6"/>
    <rect x="1130" y="180" width="170" height="56" rx="6"/>
  </g>
  <rect x="130" y="194" width="1170" height="14" fill="#141410"/>
  <rect x="560" y="236" width="8" height="34" fill="#141410"/>
  <rect x="940" y="236" width="8" height="34" fill="#141410"/>
  <rect x="430" y="268" width="640" height="104" rx="10" fill="#141410"/>
  <rect x="446" y="284" width="608" height="72" rx="6" fill="#d4d7cf"/>
</g>
</svg>
