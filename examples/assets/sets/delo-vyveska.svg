<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ВЫВЕСКА РАНЬШЕ КЛИЕНТА.
       Улица, свежий фасад: над пустой витриной уже висит огромная вывеска
       (пустая плашка — надписи в локациях нет), у стены стремянка, банки
       краски и рулон с эмблемой. Улица пустая от края до края: ни одного
       прохожего. Всё, что можно купить ДО первого клиента, — куплено.
       Тротуар на y≈604; персонаж стоит перед витриной. -->
  <rect width="1280" height="720" fill="#d4d7cf"/>
  <rect width="1280" height="120" fill="#c9ccc3"/>
  <rect y="120" width="1280" height="484" fill="#a2a59d"/>
  <rect y="604" width="1280" height="116" fill="#b0b3ab"/>
  <path d="M-10 604 Q640 598 1290 606" stroke="#141410" stroke-width="6" fill="none"/>
  <path d="M-10 120 L1290 120" stroke="#141410" stroke-width="5" fill="none"/>

  <!-- ФАСАД: светлая плоскость с чёрной обводкой -->
  <path d="M180 150 L1100 150 L1100 604 L180 604 Z" fill="#c9ccc3" stroke="#141410" stroke-width="7"/>
  <!-- ВЫВЕСКА: чёрная плашка на всю ширину фасада, огромная, пустая -->
  <path d="M150 156 L1130 156 L1130 268 L150 268 Z" fill="#141410"/>
  <path d="M176 176 L1104 176 L1104 248 L176 248 Z" fill="none" stroke="#c9ccc3" stroke-width="5"/>
  <!-- две цепи, на которых она висит -->
  <path d="M300 120 L300 156 M980 120 L980 156" stroke="#141410" stroke-width="8"/>

  <!-- ВИТРИНА: большое окно, за ним ПУСТО — только светлая стена -->
  <path d="M230 300 L1050 300 L1050 590 L230 590 Z" fill="#d4d7cf" stroke="#141410" stroke-width="8"/>
  <path d="M640 300 L640 590" stroke="#141410" stroke-width="6"/>
  <path d="M230 445 L1050 445" stroke="#141410" stroke-width="6"/>
  <!-- блик стекла: один жёсткий полигон -->
  <path d="M260 320 L420 320 L300 570 L260 570 Z" fill="#f2f4ec" opacity="0.35"/>

  <!-- СТРЕМЯНКА у левого края фасада -->
  <g stroke="#141410" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M92 604 L150 300 L206 604"/>
    <path d="M110 520 L188 520"/><path d="M122 460 L178 460"/>
    <path d="M132 400 L168 400"/><path d="M140 350 L160 350"/>
  </g>
  <!-- БАНКИ КРАСКИ и кисть на тротуаре -->
  <g fill="#141410">
    <path d="M1120 556 L1176 556 L1180 604 L1116 604 Z"/>
    <path d="M1184 566 L1232 566 L1236 604 L1180 604 Z"/>
    <path d="M1130 548 L1166 548 L1166 556 L1130 556 Z"/>
  </g>
  <path d="M1100 600 L1060 540" stroke="#141410" stroke-width="7" stroke-linecap="round"/>
  <path d="M1060 540 L1046 522" stroke="#141410" stroke-width="14" stroke-linecap="round"/>
  <!-- РУЛОН С ЭМБЛЕМОЙ: развёрнут наполовину, на нём круг — логотип без слов -->
  <path d="M840 612 Q900 600 1000 612 L1000 660 Q900 672 840 660 Z" fill="#c9ccc3" stroke="#141410" stroke-width="5"/>
  <path d="M1000 612 Q1024 636 1000 660" fill="#141410"/>
  <circle cx="900" cy="636" r="16" fill="none" stroke="#141410" stroke-width="5"/>

  <!-- ПУСТОЙ ТРОТУАР: плитка, ни одной ноги -->
  <g stroke="#8d9088" stroke-width="4" fill="none" opacity="0.7">
    <path d="M-10 650 L1290 650"/><path d="M-10 690 L1290 690"/>
    <path d="M200 604 L180 720"/><path d="M520 604 L500 720"/>
    <path d="M760 604 L780 720"/><path d="M1080 604 L1100 720"/>
  </g>
</svg>
