<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="ink" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- ЛОКАЦИЯ-ВЕЩДОК, А НЕ ФОН (PRODAZHA.md §5). Дверь стоит В ПУСТОТЕ, без
       стены и без косяка в комнату: пустота вокруг говорит, что за дверью не
       соседняя комната, а НЕПРОЖИТАЯ ЖИЗНЬ. Была бы стена — был бы дом, и
       зритель читал бы бытовую сцену вместо развилки.
       Свет ИЗ-ПОД двери — единственное светлое пятно ниже линии пола: за
       дверью горит, здесь нет. Это и продаёт, без единого слова.
       Пол — та же штриховка, что в поле и в пустоте: одна вселенная роликов. -->
  <rect width="1280" height="720" fill="#6e706a"/>
  <g filter="url(#ink)">
    <!-- горизонт: тёмный верх, светлый пол — канон эталона -->
    <path d="M0 430 L1280 424 L1280 720 L0 720 Z" fill="#d7d8d2"/>
    <path d="M0 430 L1280 424" stroke="#0e0e0e" stroke-width="6" fill="none"/>
    <!-- штриховка пола -->
    <g stroke="#9a9c95" stroke-width="2" opacity="0.55">
      <path d="M-20 470 L520 462 M760 466 L1300 458 M-20 520 L1300 508
               M-20 578 L1300 566 M-20 640 L1300 628 M-20 700 L1300 690
               M120 448 L60 720 M420 442 L360 720 M900 442 L980 720
               M1180 448 L1260 720"/>
    </g>
    <!-- СВЕТ ИЗ-ПОД ДВЕРИ: клин на полу, впереди двери -->
    <path d="M566 596 L714 596 L790 700 L490 700 Z" fill="#f2f3ef"/>
    <!-- ДВЕРЬ: закрыта. Полотно чуть темнее пустоты, чтобы читалось пятном -->
    <path d="M560 176 C 556 300, 556 470, 562 598
             L718 600 C 724 470, 724 300, 720 174 Z" fill="#171714"/>
    <!-- косяк: тонкая рама, оборванная сверху — двери не на что опираться -->
    <path d="M548 172 C 544 300, 544 472, 550 606
             L730 608 C 736 472, 736 300, 732 170"
          stroke="#f2f3ef" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M544 172 L736 168" stroke="#f2f3ef" stroke-width="11" fill="none" stroke-linecap="round"/>
    <!-- ручка: на ТОЙ стороне её нет, на этой — есть. Дверь открывается ОТ нас -->
    <circle cx="586" cy="400" r="11" fill="#e8e9e4" stroke="#0e0e0e" stroke-width="5"/>
    <!-- щель света по контуру полотна сверху: за дверью горит -->
    <path d="M562 180 L718 178" stroke="#f2f3ef" stroke-width="4" fill="none"/>
  </g>
</svg>
