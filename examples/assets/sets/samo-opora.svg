<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ОПОРА: КАМЕНЬ, ВРОСШИЙ В ЗЕМЛЮ.
       Рифма к пьедесталу и его опровержение, кадр в кадр: там узкая плита на
       десяти подпорках и земли не видно; здесь широкая плита, лежащая НА земле,
       и ни одной подпорки. Она низкая — встать на неё можно шагом, а не
       залезть. Из-под камня наружу идут корни: он не приставлен, он вырос.
       Верх плиты на y≈480 — та же высота, на которой стояла плита пьедестала,
       чтобы разница читалась не по росту, а по тому, чем она держится. -->
  <rect width="1280" height="720" fill="#d4d7cf"/>
  <rect width="1280" height="404" fill="#c9ccc3"/>
  <rect y="404" width="1280" height="316" fill="#b0b3ab"/>
  <path d="M-10 404 Q320 398 640 406 Q960 412 1290 402" stroke="#141410" stroke-width="6" fill="none"/>

  <!-- дальние гряды: горизонт живой, но без деталей -->
  <path d="M-10 404 Q140 366 300 402" stroke="#141410" stroke-width="5" fill="none"/>
  <path d="M980 402 Q1130 358 1290 400" stroke="#141410" stroke-width="5" fill="none"/>

  <!-- ПЛИТА: широкая, тяжёлая, чуть неровная сверху -->
  <path d="M336 486 Q640 470 950 488 L978 596 Q640 618 306 594 Z" fill="#141410"/>
  <!-- верхняя грань светлее: на неё встают -->
  <path d="M348 490 Q640 476 938 492 L930 512 Q640 528 356 512 Z" fill="#5f625b"/>

  <!-- КОРНИ: камень не приставлен, он вырос -->
  <g stroke="#141410" fill="none" stroke-linecap="round">
    <path d="M356 592 Q288 620 196 630" stroke-width="14"/>
    <path d="M196 630 Q150 634 116 654" stroke-width="9"/>
    <path d="M420 596 Q380 640 318 664" stroke-width="10"/>
    <path d="M930 594 Q1000 622 1094 632" stroke-width="14"/>
    <path d="M1094 632 Q1140 636 1176 656" stroke-width="9"/>
    <path d="M860 598 Q904 642 968 668" stroke-width="10"/>
    <path d="M640 616 Q636 664 648 700" stroke-width="12"/>
  </g>

  <!-- земля сомкнулась вокруг: трава по краю плиты -->
  <g stroke="#141410" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M262 604 L250 574"/><path d="M282 606 L286 572"/>
    <path d="M1020 606 L1032 576"/><path d="M998 604 L994 572"/>
    <path d="M182 660 L170 630"/><path d="M1116 662 L1128 632"/>
  </g>

  <!-- ОДНА ПОДПОРКА ЛЕЖИТ РЯДОМ, НЕ ПРИСТАВЛЕНА: она больше не нужна -->
  <path d="M120 690 L470 668 L472 690 L122 712 Z" fill="#141410"/>
</svg>
