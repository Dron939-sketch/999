<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ПОЛЕ. РАЗВОРОТ: «грабли те же, вы их не узнаёте в лицо».
       Дорога, у обочины лежат грабли зубьями вверх. Персонаж входит слева,
       наступает — черенок (проп `mysh-cherenok`) взлетает и бьёт в лоб.
       Зубья нарисованы здесь: они лежат на полу и не двигаются, а черенок
       вращается вокруг их левого края (x=600, y=665).

       Горизонт даёт глубину: две дальние опоры и провода — единственная
       локация ролика под открытым небом, и это видно с первого кадра.
       Персонаж останавливается на x≈0.42. -->
  <rect width="1280" height="720" fill="#e2e3e0"/>

  <!-- ГОРИЗОНТ и провода -->
  <path d="M-10 330 L1290 322" stroke="#141410" stroke-width="3"/>
  <path d="M-10 250 Q640 300 1290 240" stroke="#141410" stroke-width="3" fill="none"/>
  <path d="M-10 270 Q640 318 1290 260" stroke="#141410" stroke-width="2" fill="none"/>

  <!-- ДАЛЬНИЕ ОПОРЫ -->
  <path d="M1000 330 L1004 150 M986 168 L1022 166" stroke="#141410" stroke-width="8"/>
  <path d="M220 330 L222 176 M206 190 L238 188" stroke="#141410" stroke-width="7"/>

  <!-- ДОРОГА: средний тон, сужается к горизонту -->
  <path d="M-10 720 L330 330 L950 330 L1290 720 Z" fill="#a2a59d"/>
  <path d="M330 330 L-10 720 M950 330 L1290 720" stroke="#141410" stroke-width="5"/>
  <path d="M-10 558 Q240 553 510 559 Q790 566 1040 556 Q1180 551 1290 558"
        stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- ЗУБЬЯ ГРАБЕЛЬ на дороге, зубьями вверх: сплошные чёрные -->
  <!-- Гребёнка широкая (500..684): персонаж останавливается на x≈0.36, и его
       правая нога обязана стоять на зубьях — иначе черенок взлетает сам собой. -->
  <path d="M500 670 L684 662 L686 680 L502 688 Z" fill="#141410"/>
  <g stroke="#141410" stroke-width="7" stroke-linecap="round">
    <path d="M512 670 L510 642 M546 669 L544 641 M580 668 L578 640 M614 667 L612 639 M648 666 L646 638 M676 664 L674 636"/>
  </g>

  <!-- КАМЕНЬ у обочины: масштаб и то, что дорога не пустая -->
  <path d="M1060 600 L1084 566 L1140 560 L1180 584 L1176 618 L1070 622 Z" fill="#141410"/>
</svg>
