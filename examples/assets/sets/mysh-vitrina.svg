<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ВИТРИНА. ХУК: ценник «9000» перечёркивается, влетает «3000».
       Прилавок, на нём коробка БЕЗ надписи — в этом весь фокус: зритель решает
       «выгодно», не зная, что продают. Ценник и знак вопроса — пропы, они
       играют; коробка нарисована здесь и молчит.

       Одна крупная масса — прилавок справа, средний тон с чёрным контуром
       (сплошной чёрный съел бы силуэт). Задняя полка с одинаковыми коробками
       делает из стены магазин и заполняет верх кадра.

       Линия земли — 0.775; персонаж на 0.839 стоит слева (x≈0.32). -->
  <rect width="1280" height="720" fill="#e2e3e0"/>

  <path d="M-10 558 Q240 553 510 559 Q790 566 1040 556 Q1180 551 1290 558"
        stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ЗАДНЯЯ ПОЛКА: одинаковые коробки, все без надписей -->
  <path d="M600 214 L1180 208 L1180 232 L600 238 Z" fill="#141410"/>
  <g fill="#f7f7f4" stroke="#141410" stroke-width="6">
    <path d="M640 130 L740 128 L742 212 L642 214 Z"/>
    <path d="M776 126 L876 124 L878 210 L778 212 Z"/>
    <path d="M912 124 L1012 122 L1014 208 L914 210 Z"/>
    <path d="M1048 122 L1148 120 L1150 206 L1050 208 Z"/>
  </g>
  <g stroke="#141410" stroke-width="4" fill="none">
    <path d="M640 150 L740 148 M776 146 L876 144 M912 144 L1012 142 M1048 142 L1148 140"/>
  </g>

  <!-- ТЕНЬ ПРИЛАВКА -->
  <ellipse cx="890" cy="574" rx="300" ry="22" fill="#141410"/>

  <!-- ПРИЛАВОК: масса кадра -->
  <path d="M610 384 L1170 376 L1178 566 L604 566 Z" fill="#a2a59d" stroke="#141410" stroke-width="7"/>
  <path d="M596 372 L1184 364 L1186 392 L598 400 Z" fill="#5f625b" stroke="#141410" stroke-width="7"/>

  <!-- КОРОБКА: белая, чистая, ни слова. Здесь и живёт фокус. -->
  <path d="M800 262 L960 258 L964 374 L804 378 Z" fill="#f7f7f4" stroke="#141410" stroke-width="7"/>
  <path d="M800 262 L826 240 L986 236 L960 258 Z" fill="#c9ccc3" stroke="#141410" stroke-width="7"/>
  <path d="M960 258 L986 236 L990 352 L964 374 Z" fill="#a2a59d" stroke="#141410" stroke-width="7"/>
  <path d="M880 260 L882 376" stroke="#141410" stroke-width="4"/>

  <!-- ЛАМПА над прилавком: конуса нет, на светлом поле не виден -->
  <path d="M890 0 L892 70" stroke="#141410" stroke-width="5"/>
  <path d="M846 70 L936 70 L920 108 L864 108 Z" fill="#141410"/>
</svg>
