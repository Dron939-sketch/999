<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="ink" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- ДЕТСКАЯ, КОТОРАЯ ЖДЁТ. Комната пустая, но НЕ заброшенная: кровать
       застелена, велосипед прислонён к стене, окно светлое. Разница
       принципиальная — заброшенность читается «было и кончилось», готовность
       читается «будет и ещё не началось». Ролик про того, кто придёт после,
       и первая же локация обязана держать это без слов.

       ВЕЛОСИПЕД СПРАВА И ОБЯЗАТЕЛЕН: он играет в финале. Персонаж подходит к
       нему, поправляет и уходит — и вся конструкция про «оставить следующему»
       замыкается предметом, а не фразой.

       ПОЛ СВЕТЛЫЙ И ПУСТОЙ ПО ЦЕНТРУ. На него ложится тень фигуры; на тёмном
       полу тени не видно, и персонаж повисает в воздухе. Штриховка та же, что
       в поле и в пустоте, — одна вселенная роликов. -->
  <rect width="1280" height="720" fill="#c9cbc4"/>
  <g filter="url(#ink)">
    <!-- стена и пол: линия пола на 62% высоты -->
    <path d="M0 448 L1280 442 L1280 720 L0 720 Z" fill="#dedfd9"/>
    <path d="M0 448 L1280 442" stroke="#0e0e0e" stroke-width="6" fill="none"/>
    <!-- половицы -->
    <g stroke="#9a9c95" stroke-width="2" opacity="0.5">
      <path d="M-20 500 L1300 492 M-20 560 L1300 550 M-20 630 L1300 620 M-20 706 L1300 698
               M180 452 L100 720 M470 448 L420 720 M820 448 L870 720 M1120 452 L1200 720"/>
    </g>

    <!-- ОКНО: единственный источник света, рама крестом -->
    <rect x="520" y="120" width="250" height="210" fill="#f2f3ef" stroke="#0e0e0e" stroke-width="7"/>
    <path d="M645 122 L645 328 M522 224 L768 224" stroke="#0e0e0e" stroke-width="6"/>
    <!-- подоконник -->
    <path d="M500 330 L790 330" stroke="#0e0e0e" stroke-width="8" stroke-linecap="round"/>

    <!-- КРОВАТЬ СЛЕВА: застелена, изголовье прутьями -->
    <path d="M60 350 L60 470 M100 352 L100 470 M140 354 L140 470 M180 356 L180 470"
          stroke="#0e0e0e" stroke-width="7" stroke-linecap="round"/>
    <path d="M46 348 L196 344" stroke="#0e0e0e" stroke-width="9" stroke-linecap="round"/>
    <!-- матрас и покрывало: ровное, ни складки — никто не ложился -->
    <path d="M56 470 L360 462 L360 512 L56 520 Z" fill="#171714"/>
    <path d="M56 520 L360 512" stroke="#f2f3ef" stroke-width="4"/>
    <!-- ножки -->
    <path d="M72 520 L72 578 M344 512 L344 570" stroke="#0e0e0e" stroke-width="8" stroke-linecap="round"/>

    <!-- ВЕЛОСИПЕД СПРАВА: прислонён к стене, ждёт хозяина -->
    <g stroke="#0e0e0e" fill="none" stroke-width="8" stroke-linecap="round">
      <circle cx="1006" cy="546" r="72"/>
      <circle cx="1178" cy="540" r="72"/>
      <!-- рама -->
      <path d="M1006 546 L1074 452 L1150 456 L1178 540"/>
      <path d="M1074 452 L1120 546 L1178 540"/>
      <path d="M1006 546 L1120 546"/>
      <!-- руль и седло -->
      <path d="M1150 456 L1176 424 M1150 424 L1206 424"/>
      <path d="M1074 452 L1058 414 M1030 410 L1090 412"/>
    </g>
    <!-- спицы: по три штриха на колесо, больше не нужно -->
    <g stroke="#0e0e0e" stroke-width="4" opacity="0.75">
      <path d="M950 512 L1062 580 M950 580 L1062 512 M1006 474 L1006 618
               M1122 506 L1234 574 M1122 574 L1234 506 M1178 468 L1178 612"/>
    </g>

    <!-- плинтус -->
    <path d="M0 452 L1280 446" stroke="#9a9c95" stroke-width="4" fill="none" opacity="0.7"/>
  </g>
</svg>
