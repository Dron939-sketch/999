<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ГАЛЕРЕЯ. ВЗЛЁТ: «схему можно выучить в лицо».
       «В лицо» буквально: на стене три портрета, и на каждом — грабли в своём
       пальто. Те же три одежды, что упали в гардеробе, теперь висят под
       стеклом и подписаны табличками. Ошибка, которую выучили в лицо, — это
       экспонат, а не ловушка.

       Три рамки на x=420..640 / 680..900 / 940..1160, y=110..350. Персонаж
       проходит вдоль них справа налево и останавливается на x≈0.22, рамки не
       закрывая. Скамья и половая доска — чтобы зал читался залом. -->
  <rect width="1280" height="720" fill="#e2e3e0"/>

  <path d="M-10 558 Q240 553 510 559 Q790 566 1040 556 Q1180 551 1290 558"
        stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ТРИ РАМКИ -->
  <g fill="#f7f7f4" stroke="#141410" stroke-width="9">
    <path d="M420 110 L640 106 L642 350 L422 354 Z"/>
    <path d="M680 108 L900 104 L902 348 L682 352 Z"/>
    <path d="M940 106 L1160 102 L1162 346 L942 350 Z"/>
  </g>

  <!-- ПОРТРЕТ 1: грабли в длинном пальто -->
  <g>
    <path d="M528 128 L532 336" stroke="#141410" stroke-width="10"/>
    <path d="M498 316 L566 314 L568 330 L500 332 Z" fill="#141410"/>
    <path d="M496 196 Q530 180 564 196 L590 224 L582 300 L478 302 L470 224 Z"
          fill="#a2a59d" stroke="#141410" stroke-width="6"/>
    <path d="M530 200 L530 300" stroke="#141410" stroke-width="4"/>
  </g>
  <!-- ПОРТРЕТ 2: грабли в куртке с капюшоном -->
  <g>
    <path d="M788 126 L792 334" stroke="#141410" stroke-width="10"/>
    <path d="M758 314 L826 312 L828 328 L760 330 Z" fill="#141410"/>
    <path d="M756 178 Q790 150 824 178 L846 210 L836 276 L744 278 L734 210 Z"
          fill="#f7f7f4" stroke="#141410" stroke-width="6"/>
    <path d="M770 176 Q790 160 810 176" stroke="#141410" stroke-width="6" fill="none"/>
  </g>
  <!-- ПОРТРЕТ 3: грабли в халате с поясом -->
  <g>
    <path d="M1048 124 L1052 332" stroke="#141410" stroke-width="10"/>
    <path d="M1018 312 L1086 310 L1088 326 L1020 328 Z" fill="#141410"/>
    <path d="M1020 192 L1080 190 L1100 310 L1000 312 Z"
          fill="#5f625b" stroke="#141410" stroke-width="6"/>
    <path d="M1004 250 L1098 248" stroke="#f7f7f4" stroke-width="8"/>
  </g>

  <!-- ТАБЛИЧКИ под рамками (без текста: надписи ставит движок или никто) -->
  <g fill="#141410">
    <path d="M500 372 L560 371 L561 390 L501 391 Z"/>
    <path d="M760 370 L820 369 L821 388 L761 389 Z"/>
    <path d="M1020 368 L1080 367 L1081 386 L1021 387 Z"/>
  </g>

  <!-- СКАМЬЯ посреди зала, на среднем плане -->
  <path d="M700 470 L1000 466 L1002 486 L702 490 Z" fill="#5f625b" stroke="#141410" stroke-width="6"/>
  <path d="M724 490 L722 556 M978 486 L982 556" stroke="#141410" stroke-width="12"/>

  <!-- ПЛИНТУС -->
  <path d="M-10 540 L1290 536" stroke="#141410" stroke-width="2" opacity="0.5"/>
</svg>
