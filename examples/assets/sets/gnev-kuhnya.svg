<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ВЕЧЕРНЯЯ КУХНЯ. ХУК.
       Здесь только что кричали, и кадр обязан сказать это без слов: кружка
       лежит на боку, чай натёк на стол и капает через край, детский стул
       ОПРОКИНУТ, в дверном проёме уходит маленький силуэт.

       ПЕРВАЯ ВЕРСИЯ НЕ ЧИТАЛАСЬ, и это стоит помнить. Лужа была нарисована
       средним серым (#8d9088) и лежала под столом — движок с mono-contrast 1.9
       свёл её в один тон с чёрной контактной тенью стола, и на кадре не
       осталось ни лужи, ни повода для крика. Детский стульчик стоял ЗА столом
       и читался палкой. Конус лампы на светлом поле не виден вовсе.

       Отсюда правило для этого языка кадра: на светлом поле читается либо
       СПЛОШНОЕ ЧЁРНОЕ, либо БЕЛОЕ С ЖИРНЫМ КОНТУРОМ. Средние тона живут только
       крупными массами (стол, плита), мелочь в них исчезает.

       Геометрия стола, лампы и линии земли — та же, что в `gnev-utro.svg`:
       рифма вечер ↔ утро работает, только если кадр совпадает.

       Линия земли — 0.775; персонаж на 0.839 стоит слева от стола (x≈0.34). -->
  <rect width="1280" height="720" fill="#e2e3e0"/>

  <!-- ЛИНИЯ ЗЕМЛИ -->
  <path d="M-10 558 Q230 552 500 559 Q780 566 1030 556 Q1180 551 1290 557"
        stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ДВЕРНОЙ ПРОЁМ СПРАВА: чёрная рама, светлый проём, в нём уходит фигура -->
  <path d="M1084 96 L1290 92 L1290 566 L1084 566 Z" fill="#141410"/>
  <path d="M1124 132 L1290 128 L1290 566 L1124 566 Z" fill="#f7f7f4" stroke="#141410" stroke-width="6"/>
  <!-- МАЛЕНЬКИЙ СИЛУЭТ: уходит, видно наполовину — шаг за кромку -->
  <path d="M1178 250 Q1204 214 1230 250 Q1246 276 1244 330 L1250 470 L1226 470 L1214 396 L1200 470 L1176 470 L1180 330 Q1172 278 1178 250 Z"
        fill="#141410"/>
  <path d="M1176 300 L1146 356" stroke="#141410" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M1176 470 L1174 566 M1244 470 L1250 566" stroke="#141410" stroke-width="16"/>

  <!-- ТЕНЬ СТОЛА: та же, что утром -->
  <ellipse cx="800" cy="572" rx="230" ry="22" fill="#141410"/>

  <!-- СТОЛ: та же геометрия, что утром -->
  <path d="M596 392 L1010 386 L1018 424 L590 430 Z" fill="#5f625b" stroke="#141410" stroke-width="7"/>
  <path d="M628 430 L620 566 M978 424 L988 566" stroke="#141410" stroke-width="15"/>

  <!-- ЧАЙ НА СТОЛЕ: сплошное чёрное пятно, натёкшее к левому краю -->
  <path d="M600 392 Q640 380 700 384 Q760 388 800 394 L806 402 Q740 412 660 410 Q610 408 592 400 Z" fill="#141410"/>

  <!-- КРУЖКА НА БОКУ: белая с жирным контуром, ручка вверх -->
  <path d="M652 336 L734 334 Q744 334 744 352 L744 378 Q744 386 734 386 L652 386 Q640 386 640 362 Q640 336 652 336 Z"
        fill="#f7f7f4" stroke="#141410" stroke-width="7"/>
  <path d="M744 342 Q774 340 774 360 Q774 380 744 378" fill="none" stroke="#141410" stroke-width="7"/>

  <!-- КАПЛЯ ЧЕРЕЗ КРАЙ и ЛУЖА НА ПОЛУ: белая с жирным контуром, СЛЕВА от
       тени стола — иначе сливается с ней -->
  <path d="M600 402 Q592 450 596 496 Q598 520 604 534" stroke="#141410" stroke-width="9" fill="none" stroke-linecap="round"/>
  <ellipse cx="596" cy="548" rx="14" ry="18" fill="#141410"/>
  <path d="M470 592 Q512 566 566 572 Q622 578 634 600 Q640 622 588 630 Q522 636 486 622 Q456 610 470 592 Z"
        fill="#f7f7f4" stroke="#141410" stroke-width="7"/>
  <g fill="#141410">
    <ellipse cx="662" cy="614" rx="11" ry="8"/>
    <ellipse cx="440" cy="600" rx="8" ry="6"/>
  </g>

  <!-- ДЕТСКИЙ СТУЛ: ОПРОКИНУТ, лежит на боку слева от стола -->
  <g fill="#141410">
    <path d="M300 500 L318 470 L430 528 L412 558 Z"/>
    <path d="M296 506 L232 536 L242 556 L306 526 Z"/>
    <path d="M420 534 L446 522 L452 536 L426 548 Z"/>
    <path d="M382 508 L406 496 L412 510 L388 522 Z"/>
  </g>

  <!-- ЛАМПА: та же, что утром. Конуса нет — на светлом поле он не виден -->
  <path d="M804 0 L806 96" stroke="#141410" stroke-width="5" fill="none"/>
  <path d="M762 96 L850 96 L832 136 L780 136 Z" fill="#141410"/>
</svg>
