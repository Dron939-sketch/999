<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ВЕЧЕРНЯЯ КУХНЯ. ХУК.
       Здесь только что кричали, и кадр обязан сказать это без слов: кружка
       опрокинута, чай течёт со стола на пол, детский стульчик отодвинут и
       пуст, в дверном проёме справа маленький силуэт уходит — видно только
       половину. Подписывать «вы рявкнули» не нужно.

       ЯЗЫК КАДРА — как у соседних роликов после сведения 08.09.2026: светлое
       поле бумаги, ОДНА рисованная линия земли, одна крупная тёмная масса
       (стол). Тональных полос потолка и пола нет.

       Линия земли — 0.775; персонаж на 0.839 стоит перед ней, слева от стола
       (x≈0.34). Кружка и лужа — на его стороне стола, чтобы он мог на них
       показать. -->
  <rect width="1280" height="720" fill="#e2e3e0"/>

  <!-- ЛИНИЯ ЗЕМЛИ -->
  <path d="M-10 558 Q230 552 500 559 Q780 566 1030 556 Q1180 551 1290 557"
        stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ДВЕРНОЙ ПРОЁМ СПРАВА: тёмный косяк, за ним уходит маленький силуэт -->
  <path d="M1120 120 L1290 116 L1290 566 L1120 566 Z" fill="#c9ccc3" stroke="#141410" stroke-width="7"/>
  <path d="M1120 120 L1152 140 L1152 566 L1120 566 Z" fill="#141410"/>
  <path d="M1196 330 Q1216 300 1236 330 L1246 566 L1188 566 Z" fill="#141410"/>
  <path d="M1188 566 L1246 566 L1252 578 L1182 578 Z" fill="#17170f" opacity="0.8"/>

  <!-- ТЕНЬ СТОЛА: сплошное пятно -->
  <ellipse cx="800" cy="572" rx="230" ry="22" fill="#17170f" opacity="0.8"/>

  <!-- СТОЛ: главная масса кадра, средний тон с жирным контуром -->
  <path d="M596 392 L1010 386 L1018 424 L590 430 Z" fill="#5f625b" stroke="#141410" stroke-width="7"/>
  <path d="M628 430 L620 566 M978 424 L988 566" stroke="#141410" stroke-width="15"/>

  <!-- ОПРОКИНУТАЯ КРУЖКА: лежит на боку, ручка вверх -->
  <path d="M690 352 L760 350 Q770 350 770 366 L770 386 Q770 392 760 392 L690 392 Q680 392 680 372 Q680 352 690 352 Z"
        fill="#f7f7f4" stroke="#141410" stroke-width="6"/>
  <path d="M770 358 Q796 356 796 372 Q796 388 770 386" fill="none" stroke="#141410" stroke-width="6"/>
  <!-- ЧАЙ: пятно на столе и струя через край на пол -->
  <path d="M660 392 Q640 400 618 404 Q600 408 604 418 L672 416 Q690 410 680 396 Z"
        fill="#8d9088" stroke="#141410" stroke-width="4"/>
  <path d="M614 418 Q606 470 612 520 Q616 546 626 558" stroke="#141410" stroke-width="7" fill="none"/>
  <path d="M576 566 Q600 548 640 552 Q684 556 700 566 Q660 578 616 576 Q586 574 576 566 Z"
        fill="#8d9088" stroke="#141410" stroke-width="5"/>

  <!-- ДЕТСКИЙ СТУЛЬЧИК: отодвинут и пуст -->
  <path d="M840 430 L900 428 L904 566 L896 566 L892 470 L850 472 L846 566 L838 566 Z" fill="#141410"/>
  <path d="M838 340 L850 340 L852 432 L840 432 Z" fill="#141410"/>
  <path d="M838 348 L900 346 L900 362 L838 364 Z" fill="#141410"/>

  <!-- ЛАМПА НАД СТОЛОМ: один жёсткий конус -->
  <path d="M804 0 L806 96" stroke="#141410" stroke-width="5" fill="none"/>
  <path d="M762 96 L850 96 L832 136 L780 136 Z" fill="#141410"/>
  <path d="M780 136 L660 392 L952 386 L832 136 Z" fill="#f7f7f4" opacity="0.45"/>
</svg>
