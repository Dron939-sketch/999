<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ВЕЧЕРНЯЯ КУХНЯ. ХУК.
       Здесь только что кричали, и кадр обязан сказать это без слов: кружка
       лежит на боку, чай натёк на стол и капает через край, детский стул
       ОПРОКИНУТ, в дверном проёме уходит маленький силуэт.

       ПЕРВАЯ ВЕРСИЯ НЕ ЧИТАЛАСЬ, и это стоит помнить. Лужа была нарисована
       средним серым (#8d9088) и лежала под столом — движок с mono-contrast 1.9
       свёл её в один тон с чёрной контактной тенью стола, и на кадре не
       осталось ни лужи, ни повода для крика. Детский стульчик стоял ЗА столом
       и читался палкой. Конус лампы на светлом поле не виден вовсе.

       Отсюда правило для этого языка кадра: на светлом поле читается либо
       СПЛОШНОЕ ЧЁРНОЕ, либо БЕЛОЕ С ЖИРНЫМ КОНТУРОМ. Средние тона живут только
       крупными массами (стол, плита), мелочь в них исчезает.

       И поправка к правилу, купленная вторым провалом: белое с контуром берётся
       не «когда рядом чёрное», а когда предмет и в жизни светлый. Тёмное
       остаётся тёмным, а от соседней чёрной массы отделяется БЕЛЫМ ПРОСВЕТОМ
       (обводка в 20px белым под фигурой). Белая лужа чая читается тарелкой.

       Геометрия стола, лампы и линии земли — та же, что в `gnev-utro.svg`:
       рифма вечер ↔ утро работает, только если кадр совпадает.

       Линия земли — 0.775; персонаж на 0.839 стоит слева от стола (x≈0.34). -->
  <rect width="1280" height="720" fill="#e2e3e0"/>

  <!-- ЛИНИЯ ЗЕМЛИ -->
  <path d="M-10 558 Q230 552 500 559 Q780 566 1030 556 Q1180 551 1290 557"
        stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ДВЕРНОЙ ПРОЁМ СПРАВА: чёрная рама, светлый проём, в нём уходит фигура -->
  <path d="M1084 96 L1290 92 L1290 566 L1084 566 Z" fill="#141410"/>
  <path d="M1124 132 L1290 128 L1290 566 L1124 566 Z" fill="#f7f7f4" stroke="#141410" stroke-width="6"/>
  <!-- Уходящий силуэт ОТСЮДА УБРАН и стал пропом `props/gnev-rebenok.svg`:
       нарисованный в фоне, он стоял в проёме неподвижно все три с половиной
       секунды хука. Проп уходит из кадра ровно на словах «пролитого чая». -->


  <!-- ВЕРХ КАДРА БЫЛ ПУСТ. Половина кадра — белая стена без единой вещи, и
       локация читалась «предмет на листе бумаги», а не кухня. Навесной шкаф
       над столом и полка с банками слева заполняют верхний план и дают вторую
       тональную плоскость. Геометрия ОБЩАЯ для вечера и утра: рифма держится
       на совпадении кадра, поэтому обе вещи стоят в обеих кухнях. -->
  <path d="M600 118 L1012 112 L1016 282 L602 288 Z" fill="#a2a59d" stroke="#141410" stroke-width="7"/>
  <path d="M808 115 L810 285" stroke="#141410" stroke-width="6"/>
  <path d="M770 196 L788 195 M832 195 L850 194" stroke="#141410" stroke-width="9" stroke-linecap="round"/>
  <path d="M598 282 L1016 276" stroke="#141410" stroke-width="5"/>

  <path d="M130 232 L424 228 L424 248 L130 252 Z" fill="#141410"/>
  <path d="M186 160 L226 159 Q234 159 234 170 L232 228 L180 230 L178 170 Q178 160 186 160 Z"
        fill="#f7f7f4" stroke="#141410" stroke-width="6"/>
  <path d="M300 172 L344 171 Q352 171 352 182 L350 228 L294 230 L292 182 Q292 172 300 172 Z"
        fill="#f7f7f4" stroke="#141410" stroke-width="6"/>
  <path d="M182 186 L232 185 M294 196 L350 195" stroke="#141410" stroke-width="5"/>

  <!-- ТЕНЬ СТОЛА: та же, что утром -->
  <ellipse cx="800" cy="572" rx="230" ry="22" fill="#141410"/>

  <!-- СТОЛ: та же геометрия, что утром -->
  <path d="M596 392 L1010 386 L1018 424 L590 430 Z" fill="#5f625b" stroke="#141410" stroke-width="7"/>
  <path d="M628 430 L620 566 M978 424 L988 566" stroke="#141410" stroke-width="15"/>

  <!-- ЧАЙ НА СТОЛЕ: сплошное чёрное пятно, натёкшее к левому краю -->
  <path d="M600 392 Q640 380 700 384 Q760 388 800 394 L806 402 Q740 412 660 410 Q610 408 592 400 Z" fill="#141410"/>

  <!-- КРУЖКА НА БОКУ: белая с жирным контуром, ручка вверх -->
  <path d="M652 336 L734 334 Q744 334 744 352 L744 378 Q744 386 734 386 L652 386 Q640 386 640 362 Q640 336 652 336 Z"
        fill="#f7f7f4" stroke="#141410" stroke-width="7"/>
  <path d="M744 342 Q774 340 774 360 Q774 380 744 378" fill="none" stroke="#141410" stroke-width="7"/>

  <!-- КАПЛЯ ЧЕРЕЗ КРАЙ и ЛУЖА НА ПОЛУ.
       ВТОРАЯ ОШИБКА, найденная залом на выпущенной сборке: лужа была БЕЛОЙ с
       контуром — и читалась не чаем, а тарелкой или дырой в полу. Чай обязан
       быть тёмным, иначе повод для крика на кадре отсутствует.
       Развязка с чёрной тенью стола — не цветом, а БЕЛЫМ ПРОСВЕТОМ: лужа
       обведена белым в 11px и потому не слипается с тенью, оставаясь чёрной. -->
  <path d="M600 402 Q592 450 596 496 Q598 520 604 534" stroke="#141410" stroke-width="9" fill="none" stroke-linecap="round"/>
  <ellipse cx="596" cy="548" rx="14" ry="18" fill="#141410"/>
  <path d="M506 602 Q552 574 610 580 Q670 586 684 610 Q690 632 636 642 Q566 648 528 634 Q494 620 506 602 Z"
        fill="#141410" stroke="#f7f7f4" stroke-width="22"/>
  <path d="M506 602 Q552 574 610 580 Q670 586 684 610 Q690 632 636 642 Q566 648 528 634 Q494 620 506 602 Z"
        fill="#141410"/>
  <!-- брызги: тоже чёрные, тоже с белым просветом -->
  <g fill="#141410" stroke="#f7f7f4" stroke-width="10">
    <ellipse cx="722" cy="624" rx="12" ry="9"/>
    <ellipse cx="470" cy="652" rx="9" ry="7"/>
  </g>
  <g fill="#141410">
    <ellipse cx="722" cy="624" rx="12" ry="9"/>
    <ellipse cx="470" cy="652" rx="9" ry="7"/>
  </g>

  <!-- ДЕТСКИЙ СТУЛ: ОПРОКИНУТ НА СПИНКУ, ножки торчат в воздух.
       Первая версия — четыре чёрных четырёхугольника «на боку» — читалась
       доской. Стул рисуется целым (спинка, сиденье, две ножки, проножка) и
       кладётся поворотом: узнаётся сначала стул, потом то, что он лежит. -->
  <g fill="#141410" transform="rotate(-88 310 558)">
    <rect x="334" y="430" width="18" height="108"/>
    <rect x="446" y="430" width="18" height="108"/>
    <rect x="336" y="320" width="20" height="112"/>
    <rect x="444" y="320" width="20" height="112"/>
    <rect x="330" y="300" width="140" height="22"/>
    <path d="M308 452 L442 452 L466 430 L332 430 Z"/>
    <rect x="310" y="452" width="20" height="108"/>
    <rect x="422" y="452" width="20" height="108"/>
    <rect x="312" y="512" width="128" height="12"/>
  </g>

  <!-- ЛАМПА: та же, что утром. Конуса нет — на светлом поле он не виден -->
  <path d="M804 0 L806 96" stroke="#141410" stroke-width="5" fill="none"/>
  <path d="M762 96 L850 96 L832 136 L780 136 Z" fill="#141410"/>
</svg>
