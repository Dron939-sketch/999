<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ПЬЕДЕСТАЛ НА ПОДПОРКАХ.
       Доказывает реплику без подписи: он стоит высоко, земли под ним не видно
       вовсе, а держит его десяток кривых палок, приставленных с разных сторон.
       Две подпорки уже сломаны и висят. Верхняя плита — на y≈480: ровно туда
       встают ноги персонажа при place (0.5, 0.585) scales 0.80, поэтому он
       стоит НА пьедестале, а не парит над ним.

       ПОЧЕМУ ПОДПОРКИ КРУТЫЕ. В первой версии три палки шли под углом ~15° к
       горизонту, и на готовом кадре они слились с плитой в одну чёрную фигуру:
       читался стол во всю ширину, а не шаткая тумба. Ни одна подпорка не идёт
       положе 40° — иначе она перестаёт быть подпоркой и становится столешницей.
       Ствол тоже сузили: широкий сливался с плитой в сплошной блок. -->
  <rect width="1280" height="720" fill="#c9ccc3"/>
  <rect width="1280" height="196" fill="#a2a59d"/>
  <path d="M-10 196 L1290 196" stroke="#141410" stroke-width="5" fill="none"/>

  <!-- редкие штрихи высоты: воздух, а не небо -->
  <path d="M118 96 Q246 88 352 100" stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M812 62 Q944 54 1066 70" stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M402 148 Q506 142 590 152" stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- ПЛИТА: узкая, чуть кривая, с отбитым правым углом -->
  <path d="M508 480 Q640 471 786 482 L780 514 Q640 524 514 512 Z" fill="#141410"/>
  <path d="M786 482 L772 500 L784 508 Z" fill="#c9ccc3"/>

  <!-- СТВОЛ: узкий, уходит за нижнюю рамку — низа нет, высоту нечем измерить -->
  <path d="M596 514 Q590 620 600 730 L692 730 Q700 618 694 514 Z" fill="#141410"/>

  <!-- ПОДПОРКИ: восемь палок, ни одна не положе 40°, ни одна не повторяет
       соседнюю по толщине и точке упора -->
  <g stroke="#141410" fill="none" stroke-linecap="round">
    <path d="M600 528 L436 730" stroke-width="14"/>
    <path d="M592 566 L352 728" stroke-width="10"/>
    <path d="M604 604 L508 730" stroke-width="8"/>
    <path d="M688 530 L864 728" stroke-width="15"/>
    <path d="M696 572 L940 726" stroke-width="9"/>
    <path d="M684 610 L790 730" stroke-width="7"/>
    <path d="M556 516 L268 700" stroke-width="7"/>
    <path d="M732 518 L1024 706" stroke-width="7"/>
  </g>

  <!-- ДВЕ СЛОМАНЫ: держат вид, а не плиту -->
  <g stroke="#141410" fill="none" stroke-linecap="round">
    <path d="M604 582 L544 648" stroke-width="12"/>
    <path d="M516 700 L494 730" stroke-width="12"/>
    <path d="M690 592 L748 654" stroke-width="10"/>
    <path d="M796 712 L810 730" stroke-width="10"/>
  </g>

  <!-- клинья под плитой и две стяжки верёвкой: чинили не раз -->
  <path d="M572 512 L606 512 L590 540 Z" fill="#141410"/>
  <path d="M686 512 L720 512 L704 540 Z" fill="#141410"/>
  <path d="M566 634 Q644 660 726 632" stroke="#141410" stroke-width="6" fill="none"/>
  <path d="M556 678 Q644 706 736 676" stroke="#141410" stroke-width="6" fill="none"/>
</svg>
