<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ПЕРВЫЙ КЛИЕНТ.
       Рифма к сейфу и его опровержение: там огромный чёрный ящик и лампочка
       внутри; здесь простой стол, на нём та же лампочка — вынута и стоит на
       виду, — и напротив ОДИН стул с одной фигурой-силуэтом. Больше ничего:
       ни вывески, ни витрины. Одна монета на столе — первая. Окно с дневным
       светом. Пол на y≈604; персонаж стоит слева от стола, лицом к стулу. -->
  <rect width="1280" height="720" fill="#d4d7cf"/>
  <rect width="1280" height="130" fill="#5f625b"/>
  <rect y="130" width="1280" height="474" fill="#c9ccc3"/>
  <rect y="604" width="1280" height="116" fill="#a2a59d"/>
  <path d="M-10 604 Q640 598 1290 606" stroke="#141410" stroke-width="6" fill="none"/>
  <path d="M-10 130 Q640 136 1290 128" stroke="#141410" stroke-width="6" fill="none"/>

  <!-- ОКНО: один жёсткий луч дневного света на стол -->
  <path d="M880 170 L1140 170 L1140 420 L880 420 Z" fill="#d4d7cf" stroke="#141410" stroke-width="7"/>
  <path d="M1010 170 L1010 420 M880 295 L1140 295" stroke="#141410" stroke-width="6"/>
  <path d="M880 420 L560 604 L1140 604 L1140 420 Z" fill="#f2f4ec" opacity="0.35"/>

  <!-- СТОЛ: простая столешница на двух ножках -->
  <path d="M520 470 L1000 470 L1006 494 L514 494 Z" fill="#141410"/>
  <path d="M560 494 L552 604 M966 494 L974 604" stroke="#141410" stroke-width="12"/>
  <!-- ЛАМПОЧКА НА СТОЛЕ: та же, что была в сейфе, — вынута -->
  <path d="M690 396 Q660 394 660 424 Q660 444 680 454 L680 470 L718 470 L718 454 Q738 444 738 424 Q738 394 708 396 Z"
        fill="#c9ccc3" stroke="#141410" stroke-width="5"/>
  <path d="M684 428 L699 444 L714 428" stroke="#141410" stroke-width="3" fill="none"/>
  <!-- МОНЕТА: одна -->
  <circle cx="850" cy="462" r="14" fill="#141410"/>
  <circle cx="850" cy="462" r="7" fill="none" stroke="#c9ccc3" stroke-width="3"/>

  <!-- СТУЛ НАПРОТИВ И КЛИЕНТ НА НЁМ: силуэт спиной к окну -->
  <path d="M1040 400 L1140 400 L1140 604 L1126 604 L1126 500 L1054 500 L1054 604 L1040 604 Z" fill="#141410"/>
  <path d="M1076 330 Q1096 300 1116 330 L1128 400 L1064 400 Z" fill="#141410"/>
  <path d="M1116 320 Q1140 310 1156 328 L1150 360 Q1132 350 1116 356 Z" fill="#141410"/>
  <path d="M1064 400 L1064 470 L1128 470 L1128 400" fill="#141410"/>

  <!-- ПУСТОЙ ПОЛ: доски, ничего лишнего -->
  <g stroke="#8d9088" stroke-width="4" fill="none" opacity="0.7">
    <path d="M-10 660 L1290 660"/><path d="M-10 700 L1290 700"/>
    <path d="M320 604 L300 720"/><path d="M760 604 L770 720"/><path d="M1180 604 L1200 720"/>
  </g>
</svg>
