<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="ink" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- ОДНО МЕСТО, ДВА РЕШЕНИЯ. Дерево и пень стоят РЯДОМ и одной толщины в
       основании — это и есть весь довод: выбор был один и тот же, разошлись
       только ответы. Кто верит, что вернётся, — сажает; кто уверен, что нет, —
       спиливает и продаёт.

       МЕЖДУ НИМИ ПУСТО, и туда встаёт персонаж: оба варианта оказываются по
       бокам от него, а решать — зрителю. Композиция сама задаёт вопрос, не
       произнося его.

       Горизонт высокий, небо пустое: на холме нет ничего, кроме этих двух
       предметов. Всё, что можно было добавить, ослабило бы сравнение. -->
  <rect width="1280" height="720" fill="#b7b9b2"/>
  <g filter="url(#ink)">
    <!-- земля: линия на 60% высоты, лёгкий горб холма -->
    <path d="M0 452 C 320 424, 960 424, 1280 448 L1280 720 L0 720 Z" fill="#dedfd9"/>
    <path d="M0 452 C 320 424, 960 424, 1280 448" stroke="#0e0e0e" stroke-width="6" fill="none"/>
    <g stroke="#9a9c95" stroke-width="2" opacity="0.5">
      <path d="M-20 506 C 320 480, 960 480, 1300 502
               M-20 572 C 320 544, 960 544, 1300 568
               M-20 646 C 320 616, 960 616, 1300 642
               M-20 712 C 320 684, 960 684, 1300 708"/>
    </g>

    <!-- ДЕРЕВО СЛЕВА: ствол и редкая крона -->
    <path d="M228 452 C 236 380, 232 320, 246 258 L292 256 C 300 320, 296 382, 302 450 Z"
          fill="#171714"/>
    <g stroke="#0e0e0e" stroke-width="11" fill="none" stroke-linecap="round">
      <path d="M262 300 L176 236 M276 288 L364 226 M266 258 L232 186 M280 250 L330 178"/>
    </g>
    <!-- крона: редкие клубы, между ними просветы -->
    <g fill="#171714">
      <path d="M150 232 C 108 196, 148 146, 194 160 C 208 118, 274 116, 288 154
               C 340 132, 380 178, 348 214 C 372 250, 322 282, 288 258
               C 256 292, 190 280, 182 246 C 158 252, 142 244, 150 232 Z"/>
    </g>
    <!-- корни: держится за землю -->
    <g stroke="#0e0e0e" stroke-width="8" fill="none" stroke-linecap="round">
      <path d="M232 450 L182 468 M300 450 L352 470"/>
    </g>

    <!-- ПЕНЬ СПРАВА: та же толщина, свежий срез, щепки -->
    <path d="M966 448 C 974 412, 972 392, 976 372 L1042 370 C 1046 392, 1046 412, 1052 446 Z"
          fill="#171714"/>
    <!-- срез: светлый овал с годовыми кольцами -->
    <ellipse cx="1009" cy="370" rx="36" ry="13" fill="#f2f3ef" stroke="#0e0e0e" stroke-width="6"/>
    <g stroke="#0e0e0e" stroke-width="3" fill="none" opacity="0.8">
      <ellipse cx="1009" cy="370" rx="24" ry="8"/>
      <ellipse cx="1009" cy="370" rx="12" ry="4"/>
    </g>
    <!-- задиры: пилили небрежно -->
    <g stroke="#0e0e0e" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M978 376 L968 356 M1040 376 L1052 358"/>
    </g>
    <!-- щепки вокруг -->
    <g fill="#171714">
      <path d="M900 452 L934 444 L928 458 Z"/>
      <path d="M1088 448 L1124 440 L1112 456 Z"/>
      <path d="M1044 462 L1078 458 L1058 472 Z"/>
      <path d="M930 470 L960 466 L942 480 Z"/>
    </g>
    <!-- корни пня: те же, что у дерева, — место было одно -->
    <g stroke="#0e0e0e" stroke-width="8" fill="none" stroke-linecap="round">
      <path d="M970 446 L920 466 M1048 446 L1100 466"/>
    </g>
  </g>
</svg>
