<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ГАРДЕРОБ. ПУЛЕМЁТ: «вчера — ценник, сегодня — спор, завтра — я знал».
       Вешалка с тремя крючками. Пальто и грабли — ПРОПЫ: на каждом слове
       пулемёта одно пальто падает на пол, и под ним оказываются грабли; к
       «Ошибка одна» стоят три одинаковых грабель. Сет молчит и держит
       геометрию: рейка на y=200, крючки на x=620/830/1040, пол на 558.

       Верх кадра заполнен рейкой и полкой над ней — стена с одной перекладиной
       читалась спортзалом. Персонаж стоит слева (x≈0.22), между ним и первым
       крючком свободно. -->
  <rect width="1280" height="720" fill="#e2e3e0"/>

  <path d="M-10 558 Q240 553 510 559 Q790 566 1040 556 Q1180 551 1290 558"
        stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ПОЛКА над рейкой: шляпные коробки -->
  <path d="M470 96 L1190 90 L1190 112 L470 118 Z" fill="#141410"/>
  <g fill="#f7f7f4" stroke="#141410" stroke-width="6">
    <path d="M540 40 L660 38 L664 94 L544 96 Z"/>
    <path d="M900 36 L1040 34 L1044 92 L904 94 Z"/>
  </g>

  <!-- РЕЙКА ВЕШАЛКИ и три крючка -->
  <path d="M480 190 L1180 184 L1180 212 L480 218 Z" fill="#141410"/>
  <g stroke="#141410" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M620 218 L620 250 Q620 262 634 262"/>
    <path d="M830 216 L830 248 Q830 260 844 260"/>
    <path d="M1040 214 L1040 246 Q1040 258 1054 258"/>
  </g>

  <!-- ПЛИНТУС: даёт стене низ, а полу — край -->
  <path d="M-10 540 L1290 536" stroke="#141410" stroke-width="2" opacity="0.5"/>

  <!-- ЗЕРКАЛО СЛЕВА, за спиной персонажа: гардероб, а не склад -->
  <path d="M60 140 L250 136 L254 470 L64 474 Z" fill="#c9ccc3" stroke="#141410" stroke-width="7"/>
  <path d="M90 180 L120 150" stroke="#f7f7f4" stroke-width="6" stroke-linecap="round"/>
</svg>
