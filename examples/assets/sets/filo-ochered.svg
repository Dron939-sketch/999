<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ОЧЕРЕДЬ ЗА ОТВЕТОМ.
       «Утро. Работа. Лента. Так надо.» — хвост одинаковых силуэтов от центра
       кадра до правой кромки и дальше, у каждого над головой та же записка,
       поднятая как билет. Впереди слева — тот же автомат, к которому и стоят.
       Никто не смотрит по сторонам.

       ЯЗЫК КАДРА СВЕРЕН С СОСЕДЯМИ 08.09.2026. Автомат, голова и стол пришли
       генератором и вернулись в другом языке: чистое поле бумаги и ОДНА
       рисованная линия земли вместо трёх тональных полос. Полосы потолка и
       пола, стоявшие здесь раньше, делали ролик двуязычным — сцены с ними
       читались темнее и «слоистее» соседних. Осталась одна линия.

       Линия земли — 0.775; персонаж на 0.839 стоит перед ней, в разрыве
       очереди по центру, единственный лицом к нам. -->
  <rect width="1280" height="720" fill="#e2e3e0"/>

  <!-- ЛИНИЯ ЗЕМЛИ: одна, кривая от руки -->
  <path d="M-10 558 Q200 553 420 559 Q700 565 960 556 Q1140 551 1290 558"
        stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ТОТ ЖЕ АВТОМАТ, маленький, слева: к нему и стоят -->
  <g>
    <path d="M60 356 L196 352 L200 578 L58 580 Z" fill="#9a9d95" stroke="#141410" stroke-width="5"/>
    <path d="M74 372 L154 369 L155 494 L75 496 Z" fill="#f2f3ef" stroke="#141410" stroke-width="4"/>
    <g stroke="#141410" stroke-width="3">
      <path d="M74 404 L154 401"/><path d="M74 436 L155 433"/><path d="M75 466 L155 463"/>
    </g>
    <g fill="#f7f7f4" stroke="#141410" stroke-width="2.5">
      <rect x="82" y="379" width="15" height="15" rx="3"/><rect x="104" y="379" width="15" height="15" rx="3"/><rect x="126" y="379" width="15" height="15" rx="3"/>
      <rect x="82" y="411" width="15" height="15" rx="3"/><rect x="104" y="411" width="15" height="15" rx="3"/><rect x="126" y="411" width="15" height="15" rx="3"/>
      <rect x="82" y="442" width="15" height="15" rx="3"/><rect x="104" y="442" width="15" height="15" rx="3"/><rect x="126" y="442" width="15" height="15" rx="3"/>
    </g>
    <path d="M166 370 L186 370 L187 494 L167 494 Z" fill="#4a4d46"/>
    <g fill="#e2e3e0"><circle cx="176" cy="386" r="4"/><circle cx="176" cy="404" r="4"/><circle cx="176" cy="440" r="4"/><circle cx="176" cy="458" r="4"/></g>
    <circle cx="176" cy="422" r="6.5" fill="#f7f7f4"/>
    <path d="M82 516 L150 514 L151 542 L83 544 Z" fill="#4a4d46" stroke="#141410" stroke-width="4"/>
  </g>

  <!-- КОНТАКТНЫЕ ТЕНИ: сплошные пятна, как у головы и автомата в соседних
       сценах. Без них силуэты висели над линией земли. -->
  <g fill="#17170f" opacity="0.8">
    <ellipse cx="242" cy="566" rx="30" ry="8"/><ellipse cx="298" cy="572" rx="34" ry="9"/>
    <ellipse cx="362" cy="578" rx="40" ry="10"/>
    <ellipse cx="832" cy="588" rx="46" ry="12"/><ellipse cx="916" cy="598" rx="54" ry="13"/>
    <ellipse cx="1020" cy="606" rx="62" ry="15"/><ellipse cx="1146" cy="614" rx="74" ry="17"/>
    <ellipse cx="1282" cy="622" rx="86" ry="19"/>
    <ellipse cx="128" cy="580" rx="80" ry="14"/>
  </g>

  <!-- ГОЛОВА ОЧЕРЕДИ: три силуэта у автомата, спиной к нам, мельче -->
  <g fill="#141410">
    <path d="M228 424 Q242 400 256 424 L262 566 L222 566 Z"/>
    <path d="M282 418 Q298 392 314 418 L322 572 L274 572 Z"/>
    <path d="M344 410 Q362 380 380 410 L390 578 L334 578 Z"/>
  </g>
  <g stroke="#141410" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M259 452 L271 396"/><path d="M317 444 L331 382"/><path d="M383 434 L401 368"/>
  </g>
  <g fill="#f7f7f4" stroke="#141410" stroke-width="3.5">
    <rect x="261" y="372" width="22" height="22" rx="4"/>
    <rect x="321" y="358" width="24" height="24" rx="4"/>
    <rect x="391" y="344" width="26" height="26" rx="4"/>
  </g>
  <g stroke="#141410" stroke-width="2.6" fill="none">
    <path d="M267 383 Q272 377 277 383 Q272 389 267 383"/>
    <path d="M328 370 Q333 363 338 370 Q333 377 328 370"/>
    <path d="M399 357 Q405 350 411 357 Q405 364 399 357"/>
  </g>

  <!-- ХВОСТ: от правее середины к кромке, каждый крупнее; РАЗРЫВ под фигуру -->
  <g fill="#141410">
    <path d="M812 400 Q832 366 852 400 L864 588 L800 588 Z"/>
    <path d="M892 390 Q916 350 940 390 L954 598 L878 598 Z"/>
    <path d="M992 378 Q1020 332 1048 378 L1064 606 L976 606 Z"/>
    <path d="M1112 364 Q1146 308 1180 364 L1200 614 L1092 614 Z"/>
    <path d="M1242 348 Q1282 284 1322 348 L1342 622 L1222 622 Z"/>
  </g>
  <g stroke="#141410" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M858 428 L880 338"/><path d="M946 418 L972 320"/><path d="M1056 406 L1088 300"/>
    <path d="M1188 390 L1226 274"/><path d="M1330 374 L1374 248"/>
  </g>
  <g fill="#f7f7f4" stroke="#141410" stroke-width="4">
    <rect x="862" y="304" width="36" height="36" rx="6"/><rect x="954" y="284" width="38" height="38" rx="6"/>
    <rect x="1068" y="262" width="42" height="42" rx="7"/><rect x="1204" y="234" width="46" height="46" rx="7"/>
    <rect x="1350" y="206" width="50" height="50" rx="8"/>
  </g>
  <g stroke="#141410" stroke-width="3" fill="none">
    <path d="M870 322 Q880 310 890 322 Q880 334 870 322"/>
    <path d="M962 303 Q973 290 984 303 Q973 316 962 303"/>
    <path d="M1078 283 Q1089 269 1100 283 Q1089 297 1078 283"/>
    <path d="M1216 257 Q1227 242 1238 257 Q1227 272 1216 257"/>
    <path d="M1362 229 Q1375 213 1388 229 Q1375 245 1362 229"/>
  </g>
</svg>
