<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ОЧЕРЕДЬ ЗА ОТВЕТОМ.
       «Утро. Работа. Лента. Так надо.» — улица, хвост одинаковых силуэтов от
       середины кадра до правой кромки и дальше, у каждого над головой та же
       бумажка, поднятая, как билет. Впереди слева — тот же автомат, к которому
       и стоят. Никто не смотрит по сторонам. Пол на y≈604; персонаж стоит в
       разрыве очереди по центру, единственный лицом к нам. -->
  <rect width="1280" height="720" fill="#d4d7cf"/>
  <rect width="1280" height="150" fill="#5f625b"/>
  <rect y="150" width="1280" height="454" fill="#c9ccc3"/>
  <rect y="604" width="1280" height="116" fill="#a2a59d"/>
  <path d="M-10 604 Q640 598 1290 606" stroke="#141410" stroke-width="6" fill="none"/>
  <path d="M-10 150 Q640 156 1290 148" stroke="#141410" stroke-width="6" fill="none"/>

  <!-- ФАСАДЫ ВДАЛИ: глухие, окон нет -->
  <g fill="#a2a59d" stroke="#141410" stroke-width="6">
    <path d="M-10 250 L180 244 L184 604 L-10 604 Z"/>
    <path d="M1010 232 L1290 226 L1290 604 L1006 604 Z"/>
  </g>
  <!-- ТОТ ЖЕ АВТОМАТ, маленький, у левого фасада: к нему и стоят -->
  <path d="M60 372 L190 370 L192 604 L58 604 Z" fill="#5f625b" stroke="#141410" stroke-width="6"/>
  <path d="M74 388 L154 386 L154 520 L74 522 Z" fill="#c9ccc3" stroke="#141410" stroke-width="4"/>
  <g stroke="#141410" stroke-width="3"><path d="M74 430 L154 429"/><path d="M74 474 L154 473"/></g>
  <path d="M164 388 L182 388 L182 520 L164 520 Z" fill="#141410"/>
  <g fill="#a2a59d"><circle cx="173" cy="404" r="5"/><circle cx="173" cy="424" r="5"/><circle cx="173" cy="464" r="5"/><circle cx="173" cy="484" r="5"/></g>
  <circle cx="173" cy="444" r="7" fill="#f2f4ec"/>
  <path d="M84 548 L146 548 L146 572 L84 572 Z" fill="#141410"/>

  <!-- ОЧЕРЕДЬ: силуэты уменьшаются к автомату слева и растут к правой кромке -->
  <!-- голова очереди — у автомата, спиной к нам -->
  <g fill="#141410">
    <path d="M218 440 Q232 416 246 440 L252 560 L212 560 Z"/>
    <path d="M270 436 Q286 410 302 436 L310 566 L262 566 Z"/>
    <path d="M330 430 Q348 400 366 430 L376 574 L320 574 Z"/>
  </g>
  <!-- хвост — от центра вправо, каждый крупнее предыдущего, все с бумажкой -->
  <g fill="#141410">
    <path d="M800 402 Q820 368 840 402 L852 590 L788 590 Z"/>
    <path d="M880 392 Q904 352 928 392 L942 600 L866 600 Z"/>
    <path d="M980 380 Q1008 334 1036 380 L1052 604 L964 604 Z"/>
    <path d="M1100 366 Q1134 310 1168 366 L1188 604 L1080 604 Z"/>
    <path d="M1230 350 Q1270 286 1310 350 L1330 604 L1210 604 Z"/>
  </g>
  <!-- поднятые руки-палки и та же бумажка над каждой головой -->
  <g stroke="#141410" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M846 430 L868 340"/><path d="M934 420 L960 322"/><path d="M1044 408 L1076 302"/>
    <path d="M1176 392 L1214 276"/><path d="M1318 376 L1362 250"/>
    <path d="M250 466 L262 410"/><path d="M306 460 L320 398"/><path d="M370 452 L388 386"/>
  </g>
  <g fill="#f2f4ec" stroke="#141410" stroke-width="4">
    <rect x="850" y="306" width="36" height="36" rx="6"/><rect x="942" y="286" width="38" height="38" rx="6"/>
    <rect x="1056" y="264" width="42" height="42" rx="7"/><rect x="1192" y="236" width="46" height="46" rx="7"/>
    <rect x="1338" y="208" width="50" height="50" rx="8"/>
    <rect x="252" y="386" width="22" height="22" rx="4"/><rect x="310" y="374" width="22" height="22" rx="4"/>
    <rect x="378" y="362" width="24" height="24" rx="4"/>
  </g>
  <g stroke="#141410" stroke-width="3" fill="none">
    <path d="M858 324 Q868 312 878 324 Q868 336 858 324"/><path d="M950 305 Q961 292 972 305 Q961 318 950 305"/>
    <path d="M1066 285 Q1077 271 1088 285 Q1077 299 1066 285"/><path d="M1204 259 Q1215 244 1226 259 Q1215 274 1204 259"/>
  </g>

  <!-- ПУСТОЙ ТРОТУАР: плиты, ничего лишнего -->
  <g stroke="#8d9088" stroke-width="4" fill="none" opacity="0.7">
    <path d="M-10 660 L1290 660"/><path d="M-10 700 L1290 700"/>
    <path d="M420 604 L400 720"/><path d="M700 604 L710 720"/>
  </g>
</svg>
