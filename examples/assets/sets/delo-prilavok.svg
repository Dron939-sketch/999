<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ДВА ПРИЛАВКА.
       Слева — наш: нарядный, с навесом и крошечным ценником-биркой, и перед
       ним никого. Справа, дальше и проще, — чужая тележка без навеса, и к ней
       хвост из шести фигур-силуэтов. Спрос есть — только не там, где его не
       спросили. Цена на бирке не написана: она мелкая сама по себе, и это
       видно. Земля на y≈604; персонаж стоит ЗА своим прилавком, слева. -->
  <rect width="1280" height="720" fill="#d4d7cf"/>
  <rect width="1280" height="380" fill="#c9ccc3"/>
  <rect y="380" width="1280" height="224" fill="#b0b3ab"/>
  <rect y="604" width="1280" height="116" fill="#a2a59d"/>
  <path d="M-10 380 Q640 374 1290 382" stroke="#141410" stroke-width="5" fill="none"/>
  <path d="M-10 604 Q640 598 1290 606" stroke="#141410" stroke-width="6" fill="none"/>

  <!-- НАШ ПРИЛАВОК: чёрная тумба, над ней навес-полоска на двух стойках -->
  <path d="M160 470 L620 470 L626 604 L154 604 Z" fill="#5f625b" stroke="#141410" stroke-width="7"/>
  <path d="M150 460 L630 460 L630 476 L150 476 Z" fill="#141410"/>
  <path d="M176 460 L176 250 M604 460 L604 250" stroke="#141410" stroke-width="9"/>
  <path d="M130 250 Q390 210 650 250 L650 300 Q390 262 130 300 Z" fill="#141410"/>
  <g fill="#c9ccc3">
    <path d="M170 262 L210 262 L200 296 L160 296 Z"/><path d="M300 258 L340 258 L330 292 L290 292 Z"/>
    <path d="M440 258 L480 258 L470 292 L430 292 Z"/><path d="M570 262 L610 262 L600 296 L560 296 Z"/>
  </g>
  <!-- ЦЕННИК: крошечная бирка на верёвочке, единственное светлое на тумбе -->
  <path d="M392 470 L396 508" stroke="#c9ccc3" stroke-width="3"/>
  <path d="M380 508 L414 508 L410 534 L384 534 Z" fill="#c9ccc3" stroke="#141410" stroke-width="3"/>
  <path d="M390 522 L404 522" stroke="#141410" stroke-width="3"/>
  <!-- товар на прилавке: три одинаковых коробки -->
  <g fill="#c9ccc3" stroke="#141410" stroke-width="5">
    <path d="M220 420 L290 420 L290 470 L220 470 Z"/><path d="M310 420 L380 420 L380 470 L310 470 Z"/>
    <path d="M400 420 L470 420 L470 470 L400 470 Z"/>
  </g>

  <!-- ЧУЖАЯ ТЕЛЕЖКА: дальше, проще, без навеса -->
  <path d="M900 452 L1120 452 L1124 530 L896 530 Z" fill="#5f625b" stroke="#141410" stroke-width="7"/>
  <circle cx="930" cy="546" r="16" fill="#141410"/><circle cx="1090" cy="546" r="16" fill="#141410"/>
  <path d="M896 500 L860 520" stroke="#141410" stroke-width="8" stroke-linecap="round"/>
  <path d="M960 440 Q1010 410 1060 440" stroke="#141410" stroke-width="6" fill="none"/>

  <!-- ОЧЕРЕДЬ К ЧУЖОЙ ТЕЛЕЖКЕ: шесть силуэтов, уходят за правую кромку -->
  <g fill="#141410">
    <path d="M1150 402 Q1164 380 1178 402 L1184 530 L1144 530 Z"/>
    <path d="M1200 408 Q1212 388 1224 408 L1230 530 L1194 530 Z"/>
    <path d="M1246 412 Q1256 394 1266 412 L1272 530 L1240 530 Z"/>
    <path d="M1284 416 Q1292 400 1300 416 L1304 530 L1280 530 Z"/>
  </g>
  <!-- две фигуры уже у тележки, спиной к нам -->
  <path d="M1000 398 Q1016 372 1032 398 L1040 452 L992 452 Z" fill="#141410"/>
  <path d="M1052 404 Q1066 380 1080 404 L1086 452 L1046 452 Z" fill="#141410"/>

  <!-- ПЕРЕД НАШИМ ПРИЛАВКОМ — НИКОГО: пустая земля до кромки кадра -->
  <g stroke="#8d9088" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M160 640 Q380 646 600 640"/><path d="M200 680 Q400 686 560 680"/>
  </g>
</svg>
