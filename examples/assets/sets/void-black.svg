<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ПУСТОТА. Локация без единого предмета: чёрное поле, на котором от
       фигуры остаётся ТОЛЬКО БЕЛАЯ МАСКА — балахон чёрный и сливается с
       фоном целиком.

       ЭТО НЕ «КАДР В КОСМОСЕ», А ПРИЁМ. Раньше такой кадр получался случайно:
       локация после монохромного прохода уходила в единицу яркости, фигура
       повисала в черноте, и это читалось браком — потому что вокруг были
       сцены, где мир виден, а тут он необъяснимо пропал. Здесь чернота
       ОБЪЯВЛЕНА: в неё врезаются на одну реплику, ту самую, где ролик
       поворачивается к зрителю. Мир исчезает вместе с оправданиями —
       остаётся лицо и фраза, деть глаз некуда.

       Пол в самом низу кадра чуть светлее абсолютного чёрного: без него
       `cast-shadow` рисует серый мазок по чистому фону и выдаёт, что фигура
       всё-таки стоит в декорации. Полоса ниже линии ступней, в кадр она не
       попадает, но тень ложится уже на неё. -->
  <rect x="0" y="0" width="1280" height="720" fill="#0b0b0b"/>
  <rect x="0" y="700" width="1280" height="20" fill="#0e0e0e"/>
</svg>
