<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- СТЕНД ДЛЯ ЗАМЕРА ФИГУРЫ, а не локация.
       Ровное светлое поле без тёмного верха. Это не вкусовщина: на `void.svg`
       верхняя половина кадра тёмная, и порог «это тушь» ловит небо вместе с
       фигурой — силуэт становится неизмеримым, а вместе с ним и любое
       суждение о посадке головы и ширине плаща. Первый же замер на стенде в
       это и уткнулся.
       Никакой фактуры: пятна и штриховка на полу дают ложные срабатывания при
       поиске контура. Единственная линия — горизонт, по ней видно, стоит ли
       фигура на плоскости или парит.
       Тон полей чуть темнее пола, чтобы контактная тень читалась. -->
  <rect width="1280" height="720" fill="#e9ebe6"/>
  <rect x="0" y="418" width="1280" height="302" fill="#dfe1dc"/>
  <path d="M0 418 L1280 418" stroke="#9a9c95" stroke-width="2" fill="none"/>
</svg>
