<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- КОРИДОР ЗЕРКАЛ.
       Два ряда рам уходят в точку схода. В каждой раме — фигура, и НИ ОДНА не
       он: у всех руки подняты, все крупнее и стоят выше. Чем дальше рама, тем
       чужая фигура больше, а не меньше — перспектива работает наоборот, и это
       единственная неправда в кадре. Так выглядит лента: чем дальше от вас
       человек, тем крупнее он там кажется.
       Пол коридора сходится к y≈300; персонаж стоит на переднем плане. -->
  <rect width="1280" height="720" fill="#c9ccc3"/>
  <rect width="1280" height="300" fill="#a2a59d"/>
  <path d="M-10 300 L1290 300" stroke="#141410" stroke-width="6" fill="none"/>

  <!-- пол: линии схода в точку (640, 300) -->
  <g stroke="#141410" stroke-width="4" fill="none" opacity="0.75">
    <path d="M-10 720 L640 300"/><path d="M240 720 L640 300"/>
    <path d="M480 720 L640 300"/><path d="M800 720 L640 300"/>
    <path d="M1040 720 L640 300"/><path d="M1290 720 L640 300"/>
  </g>

  <!-- ЛЕВЫЙ РЯД РАМ: ближняя большая и пустая, дальние — с чужими -->
  <g fill="#141410">
    <path d="M18 236 L214 288 L214 664 L18 700 Z"/>
    <path d="M262 288 L406 322 L406 618 L262 646 Z"/>
    <path d="M444 326 L544 348 L544 588 L444 606 Z"/>
    <path d="M576 352 L640 366 L640 566 L576 578 Z"/>
  </g>
  <path d="M44 268 L192 306 L192 646 L44 676 Z" fill="#c9ccc3"/>
  <path d="M284 312 L388 336 L388 604 L284 628 Z" fill="#c9ccc3"/>
  <path d="M462 344 L528 358 L528 578 L462 592 Z" fill="#c9ccc3"/>
  <path d="M590 364 L632 374 L632 558 L590 568 Z" fill="#c9ccc3"/>

  <!-- ПРАВЫЙ РЯД: зеркально -->
  <g fill="#141410">
    <path d="M1262 236 L1066 288 L1066 664 L1262 700 Z"/>
    <path d="M1018 288 L874 322 L874 618 L1018 646 Z"/>
    <path d="M836 326 L736 348 L736 588 L836 606 Z"/>
    <path d="M704 352 L640 366 L640 566 L704 578 Z"/>
  </g>
  <path d="M1236 268 L1088 306 L1088 646 L1236 676 Z" fill="#c9ccc3"/>
  <path d="M996 312 L892 336 L892 604 L996 628 Z" fill="#c9ccc3"/>
  <path d="M818 344 L752 358 L752 578 L818 592 Z" fill="#c9ccc3"/>
  <path d="M690 364 L648 374 L648 558 L690 568 Z" fill="#c9ccc3"/>

  <!-- ЧУЖИЕ ОТРАЖЕНИЯ: руки вверх, и чем дальше рама, тем фигура КРУПНЕЕ -->
  <g fill="#141410">
    <!-- ближняя левая рама пустая: своего отражения нет -->
    <path d="M320 420 Q336 396 352 420 L358 574 L314 574 Z"/>
    <path d="M320 424 L296 372" stroke="#141410" stroke-width="9"/>
    <path d="M352 424 L378 370" stroke="#141410" stroke-width="9"/>
    <path d="M478 396 Q498 366 518 396 L526 566 L470 566 Z"/>
    <path d="M478 400 L450 340" stroke="#141410" stroke-width="10"/>
    <path d="M518 400 L548 338" stroke="#141410" stroke-width="10"/>
    <path d="M598 384 Q616 352 632 384 L634 552 L594 552 Z"/>
    <path d="M916 420 Q932 396 948 420 L954 574 L910 574 Z"/>
    <path d="M916 424 L892 372" stroke="#141410" stroke-width="9"/>
    <path d="M948 424 L974 370" stroke="#141410" stroke-width="9"/>
    <path d="M762 396 Q782 366 802 396 L810 566 L754 566 Z"/>
    <path d="M762 400 L734 340" stroke="#141410" stroke-width="10"/>
    <path d="M802 400 L832 338" stroke="#141410" stroke-width="10"/>
    <path d="M648 384 Q664 352 682 384 L684 552 L644 552 Z"/>
  </g>

  <!-- дальняя стена коридора: ещё одно зеркало, и оно чёрное -->
  <path d="M596 300 L684 300 L684 380 L596 380 Z" fill="#141410"/>
</svg>
