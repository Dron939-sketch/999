<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ДВЕРЬ. РАЗВОРОТ: «не на всех — только на тех, кто не уйдёт».
       Коридор. Справа тяжёлая дверь приоткрыта, и в светлой щели на полу сидит
       маленький силуэт, обняв колени. Слева на стене вешалка, и она ПУСТАЯ:
       тот, кто мог уйти, ушёл. Два предмета, одна мысль.

       Одна крупная тёмная масса — дверной блок справа. Свет из щели — плоский
       полигон, не свечение.

       Линия земли — 0.775; персонаж на 0.839 стоит чуть правее центра
       (x≈0.56), между вешалкой и дверью. -->
  <rect width="1280" height="720" fill="#e2e3e0"/>

  <path d="M-10 558 Q240 552 510 559 Q790 566 1040 556 Q1180 551 1290 557"
        stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ДВЕРНОЙ БЛОК: масса кадра -->
  <path d="M900 96 L1290 90 L1290 566 L900 566 Z" fill="#141410"/>
  <!-- ЩЕЛЬ: приоткрытая дверь, за ней свет -->
  <path d="M940 130 L1090 126 L1090 566 L940 566 Z" fill="#f7f7f4" stroke="#141410" stroke-width="6"/>
  <!-- Створка ОТСЮДА УБРАНА и стала пропом `props/gnev-stvorka.svg`: она
       закрывается на словах «только на тех, кто не уйдёт», и щель со светом
       и ребёнком сужается при зрителе. -->
  <!-- СВЕТ ИЗ ЩЕЛИ на пол -->
  <path d="M940 566 L1090 566 L1010 640 L800 640 Z" fill="#f7f7f4" opacity="0.5"/>

  <!-- РЕБЁНОК В ЩЕЛИ: сидит на полу, обняв колени.
       ПЕРВАЯ ВЕРСИЯ ЧИТАЛАСЬ ЧЁРНЫМ ЯЙЦОМ. Силуэт был слитным овалом, и на
       светлом проёме выходило пятно без головы и без коленей. Теперь голова
       отделена шеей-просветом, колени подняты отдельной формой, руки обнимают
       их поверх — три разные формы вместо одной.

       ВТОРАЯ ВЕРСИЯ ЧИТАЛАСЬ КЕГЛЕЙ: круглая голова на округлом туловище
       анфас — это форма кегли или матрёшки, поза в ней не видна. Ребёнок
       развёрнут в ПРОФИЛЬ и посажен НА ПОЛ: спина согнута дугой, колени
       подняты отдельной массой, рука обнимает их белой линией поверх обеих
       масс, между головой и плечом — просвет шеи. Поза читается силуэтом. -->
  <circle cx="1006" cy="438" r="30" fill="#141410"/>
  <!-- спина дугой: от плеча вниз-вправо к тазу на полу -->
  <path d="M1024 470 Q1054 502 1058 552 L1012 556 Q1000 518 1006 482 Z" fill="#141410"/>
  <!-- поднятые колени: отдельная масса слева, ниже головы. Обведены белым,
       иначе слипаются со спиной в одно пятно и поза опять пропадает. -->
  <path d="M1010 494 Q976 498 968 526 Q964 548 976 556 L1014 556 Q1020 522 1014 496 Z"
        fill="#141410" stroke="#f7f7f4" stroke-width="9"/>
  <path d="M1010 494 Q976 498 968 526 Q964 548 976 556 L1014 556 Q1020 522 1014 496 Z" fill="#141410"/>
  <!-- рука обнимает колени -->
  <path d="M1032 490 Q1000 500 972 522" stroke="#f7f7f4" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- просвет шеи: голова не слипается с плечом -->
  <path d="M1018 466 Q1010 476 1004 484" stroke="#f7f7f4" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- ВЕШАЛКА СЛЕВА: три крючка. На дальнем — детская куртка, два пустые.
       Так читается и то, что это вешалка, и то, чего на ней нет: взрослый ушёл,
       ребёнок остался. Пустые крючки сами по себе читались гребёнкой. -->
  <path d="M120 250 L420 246 L420 268 L120 272 Z" fill="#141410"/>
  <g stroke="#141410" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M180 272 L180 306 Q180 318 194 318"/>
    <path d="M270 270 L270 304 Q270 316 284 316"/>
    <path d="M360 268 L360 302 Q360 314 374 314"/>
  </g>
  <!-- КУРТКА ЧИТАЛАСЬ БОКСЁРСКОЙ ГРУШЕЙ — и это была не мелкая ошибка, а
       противоположный смысл: груша в коридоре у злого человека прочитывается
       как «выпустить пар», ровно тот совет, который ролик опровергает.
       Мешок отличается от куртки рукавами и воротом, поэтому у неё теперь
       два висящих рукава, плечи и молния. -->
  <path d="M334 312 Q360 298 386 312 L420 340 L410 396 L392 388 L396 452
           Q360 464 324 452 L328 388 L310 396 L300 340 Z"
        fill="#f7f7f4" stroke="#141410" stroke-width="6" stroke-linejoin="round"/>
  <path d="M360 306 L360 456" stroke="#141410" stroke-width="5" fill="none"/>
  <path d="M334 312 Q360 330 386 312" stroke="#141410" stroke-width="5" fill="none"/>

  <!-- ИГРУШКА НА ПОЛУ у самой двери -->
  <path d="M846 528 L890 524 L894 560 L850 564 Z" fill="#f7f7f4" stroke="#141410" stroke-width="5"/>
  <path d="M846 528 L868 512 L912 508 L890 524 Z" fill="#c9ccc3" stroke="#141410" stroke-width="5"/>
  <path d="M890 524 L912 508 L916 544 L894 560 Z" fill="#a2a59d" stroke="#141410" stroke-width="5"/>
</svg>
