<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ТРИ ДВЕРИ: ЧИНИТЬ, ПОВОРАЧИВАТЬ, ЗАКРЫВАТЬ.
       Пустой коридор, три одинаковые двери в ряд. Первая приоткрыта, к ней
       прислонены молоток и ключ; на второй вместо ручки — стрелка-поворот
       (дверь, за которой другая дорога); третья заколочена крест-накрест.
       Подписей нет: инструмент, стрелка и доски говорят сами. Разворот
       ролика: он стоит перед ними и не открывает ни одну — узнать страшнее,
       чем провалиться. Пол на y≈604. -->
  <rect width="1280" height="720" fill="#d4d7cf"/>
  <rect width="1280" height="120" fill="#5f625b"/>
  <rect y="120" width="1280" height="484" fill="#c9ccc3"/>
  <rect y="604" width="1280" height="116" fill="#a2a59d"/>
  <path d="M-10 604 Q640 598 1290 606" stroke="#141410" stroke-width="6" fill="none"/>
  <path d="M-10 120 Q640 126 1290 118" stroke="#141410" stroke-width="6" fill="none"/>

  <!-- ТРИ ДВЕРНЫХ ПРОЁМА: чёрные коробки, одинаковые -->
  <g fill="#141410">
    <path d="M150 220 L390 220 L390 604 L150 604 Z" fill="#5f625b" stroke="#141410" stroke-width="8"/>
    <path d="M520 220 L760 220 L760 604 L520 604 Z" fill="#5f625b" stroke="#141410" stroke-width="8"/>
    <path d="M890 220 L1130 220 L1130 604 L890 604 Z" fill="#5f625b" stroke="#141410" stroke-width="8"/>
  </g>

  <!-- ДВЕРЬ 1 — ЧИНИТЬ: приоткрыта, за ней темно; молоток и ключ у косяка -->
  <path d="M176 246 L364 246 L364 604 L176 604 Z" fill="#5f625b"/>
  <path d="M176 246 L300 262 L300 604 L176 604 Z" fill="#a2a59d" stroke="#141410" stroke-width="5"/>
  <circle cx="284" cy="430" r="7" fill="#141410"/>
  <path d="M120 604 L146 470" stroke="#141410" stroke-width="10" stroke-linecap="round"/>
  <path d="M132 466 L166 476 L160 500 L126 490 Z" fill="#141410"/>
  <path d="M400 604 L412 500" stroke="#141410" stroke-width="8" stroke-linecap="round"/>
  <circle cx="414" cy="490" r="16" fill="none" stroke="#141410" stroke-width="8"/>

  <!-- ДВЕРЬ 2 — ПОВОРАЧИВАТЬ: закрыта, вместо ручки крупная стрелка-дуга -->
  <path d="M546 246 L734 246 L734 604 L546 604 Z" fill="#a2a59d" stroke="#141410" stroke-width="5"/>
  <path d="M600 470 Q640 380 690 430" stroke="#141410" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M690 430 L664 442 L692 460 Z" fill="#141410"/>
  <path d="M690 430 L696 400" stroke="#141410" stroke-width="12" stroke-linecap="round"/>

  <!-- ДВЕРЬ 3 — ЗАКРЫВАТЬ: заколочена крест-накрест -->
  <path d="M916 246 L1104 246 L1104 604 L916 604 Z" fill="#a2a59d" stroke="#141410" stroke-width="5"/>
  <g stroke="#141410" stroke-width="26" stroke-linecap="butt">
    <path d="M900 280 L1120 560"/><path d="M1120 280 L900 560"/>
  </g>
  <g fill="#c9ccc3">
    <circle cx="930" cy="318" r="6"/><circle cx="1090" cy="318" r="6"/>
    <circle cx="930" cy="522" r="6"/><circle cx="1090" cy="522" r="6"/>
  </g>

  <!-- ПОЛ: доски, сходятся к дверям — идти-то недалеко -->
  <g stroke="#8d9088" stroke-width="4" fill="none" opacity="0.7">
    <path d="M-10 660 L1290 660"/><path d="M-10 700 L1290 700"/>
    <path d="M270 604 L250 720"/><path d="M640 604 L640 720"/><path d="M1010 604 L1030 720"/>
  </g>
</svg>
