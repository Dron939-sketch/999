<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- КАСТРЮЛЯ С КАМНЕМ НА КРЫШКЕ. ПУЛЕМЁТ.
       Это не «гнев вообще», а изображение ОДНОЙ стратегии — «держаться».
       Кастрюля кипит, крышка прижата тяжёлым камнем, пар всё равно бьёт из-под
       неё тремя струями. Камень лежит весь пулемёт и никуда не девается:
       снять его — это «выпустить пар», второй миф курса, и он тоже не ответ.

       Одна крупная тёмная масса — сама кастрюля, справа. Огонь под ней —
       плоские языки, а не свечение: мягкий свет сразу выдаёт генератор.

       Линия земли — 0.775; персонаж на 0.839 стоит слева (x≈0.30), между ним и
       кастрюлей свободно. -->
  <rect width="1280" height="720" fill="#e2e3e0"/>

  <path d="M-10 558 Q250 553 520 559 Q800 566 1040 556 Q1180 551 1290 558"
        stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ТЕНЬ ПЛИТЫ -->
  <ellipse cx="880" cy="574" rx="250" ry="24" fill="#17170f" opacity="0.8"/>

  <!-- ПЛИТА: тёмный блок -->
  <path d="M660 470 L1100 464 L1108 566 L654 566 Z" fill="#5f625b" stroke="#141410" stroke-width="7"/>

  <!-- ОГОНЬ: плоские языки под дном -->
  <g fill="#141410">
    <path d="M736 470 Q744 440 754 470 Z"/><path d="M776 470 Q788 428 800 470 Z"/>
    <path d="M820 470 Q830 436 842 470 Z"/><path d="M864 470 Q876 426 888 470 Z"/>
    <path d="M908 470 Q918 438 930 470 Z"/><path d="M952 470 Q964 432 976 470 Z"/>
    <path d="M996 470 Q1006 442 1016 470 Z"/>
  </g>

  <!-- КАСТРЮЛЯ: главная масса кадра -->
  <path d="M700 268 L1052 262 L1030 466 L724 470 Z" fill="#141410"/>
  <path d="M676 300 Q640 302 640 336 Q640 372 678 370" fill="none" stroke="#141410" stroke-width="16"/>
  <path d="M1074 296 Q1112 298 1112 332 Q1112 368 1076 366" fill="none" stroke="#141410" stroke-width="16"/>

  <!-- КРЫШКА: чуть перекошена, из-под неё щель -->
  <path d="M686 250 L1066 244 L1070 268 L682 274 Z" fill="#5f625b" stroke="#141410" stroke-width="7"/>
  <path d="M700 268 L1052 262" stroke="#141410" stroke-width="5"/>

  <!-- КАМЕНЬ НА КРЫШКЕ: тяжёлый, неровный -->
  <path d="M820 178 Q852 150 906 156 Q958 150 976 184 Q996 214 960 238 Q902 254 852 244 Q806 234 806 210 Q806 190 820 178 Z"
        fill="#5f625b" stroke="#141410" stroke-width="7"/>
  <path d="M846 196 Q876 184 906 196" stroke="#141410" stroke-width="4" fill="none"/>
  <path d="M866 220 Q896 212 926 222" stroke="#141410" stroke-width="4" fill="none"/>

  <!-- ПАР: три струи из-под крышки, рисованные завитками -->
  <g stroke="#141410" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M700 250 Q676 214 700 180 Q722 148 700 112"/>
    <path d="M1064 246 Q1092 210 1068 176 Q1046 144 1070 110"/>
    <path d="M1044 250 Q1074 228 1064 200"/>
  </g>
</svg>
