<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- КАСТРЮЛЯ С КАМНЕМ НА КРЫШКЕ. ПУЛЕМЁТ.
       Это не «гнев вообще», а изображение ОДНОЙ стратегии — «держаться».
       Кастрюля кипит, крышка прижата тяжёлым камнем, пар всё равно бьёт из-под
       неё тремя струями. Камень лежит весь пулемёт и никуда не девается:
       снять его — это «выпустить пар», второй миф курса, и он тоже не ответ.

       Одна крупная тёмная масса — сама кастрюля, справа. Огонь под ней —
       плоские языки, а не свечение: мягкий свет сразу выдаёт генератор.

       Линия земли — 0.775; персонаж на 0.839 стоит слева (x≈0.30), между ним и
       кастрюлей свободно. -->
  <rect width="1280" height="720" fill="#e2e3e0"/>

  <path d="M-10 558 Q250 553 520 559 Q800 566 1040 556 Q1180 551 1290 558"
        stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ТЕНЬ ПЛИТЫ -->
  <ellipse cx="880" cy="574" rx="250" ry="24" fill="#141410"/>

  <!-- ПЛИТА: средний тон, чтобы чёрные языки огня на ней читались -->
  <path d="M660 470 L1100 464 L1108 566 L654 566 Z" fill="#a2a59d" stroke="#141410" stroke-width="7"/>

  <!-- ОГОНЬ: сплошные чёрные языки ПО ЛИЦУ плиты, а не под дном кастрюли.
       В первой версии они стояли за корпусом и не были видны ни одного кадра. -->
  <g fill="#141410">
    <path d="M698 552 Q690 512 712 490 Q706 516 722 502 Q716 528 734 552 Z"/>
    <path d="M764 552 Q752 502 778 476 Q770 508 790 494 Q782 524 802 552 Z"/>
    <path d="M830 552 Q820 508 844 484 Q836 514 856 500 Q848 528 868 552 Z"/>
    <path d="M896 552 Q884 500 910 472 Q902 506 922 492 Q914 522 934 552 Z"/>
    <path d="M962 552 Q952 508 976 484 Q968 514 988 500 Q980 528 1000 552 Z"/>
    <path d="M1028 552 Q1018 512 1040 490 Q1034 516 1050 502 Q1044 528 1062 552 Z"/>
  </g>

  <!-- КАСТРЮЛЯ: главная масса кадра, сплошная чёрная -->
  <path d="M700 286 L1052 280 L1030 468 L724 472 Z" fill="#141410"/>
  <path d="M676 316 Q638 318 638 352 Q638 388 676 386" fill="none" stroke="#141410" stroke-width="16"/>
  <path d="M1076 312 Q1114 314 1114 348 Q1114 384 1078 382" fill="none" stroke="#141410" stroke-width="16"/>

  <!-- КРЫШКА: БЕЛАЯ с жирным контуром, перекошена — только так на светлом поле
       видно, что это отдельная вещь, а не верх кастрюли. Первая версия была
       средним тоном и сливалась с камнем в одно серое пятно. -->
  <!-- Крышка ПРОГИБАЕТСЯ под камнем: тяжесть в рисунке видна раньше, чем
       зритель разберёт, что за предмет сверху. -->
  <path d="M674 258 Q876 280 1074 250 L1078 288 Q876 314 678 296 Z"
        fill="#f7f7f4" stroke="#141410" stroke-width="8"/>

  <!-- Камень ОТСЮДА УБРАН и стал пропом `props/gnev-kamen.svg`: в фоне он
       лежал неподвижно весь пулемёт, а текст в это время говорил про срыв.
       Проп вдавливается, подскакивает и садится обратно. -->

  <!-- ПАР: три толстые струи из-под крышки, по обе стороны -->
  <g stroke="#141410" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M690 262 Q660 222 690 186 Q716 150 690 112"/>
    <path d="M1068 254 Q1100 214 1072 178 Q1046 142 1074 106"/>
    <path d="M1040 258 Q1076 232 1062 198"/>
  </g>
</svg>
