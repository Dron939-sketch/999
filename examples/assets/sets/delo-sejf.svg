<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- СЕЙФ С ИДЕЕЙ.
       Идея хранится, а не проверяется: огромный сейф, дверца приоткрыта на
       ладонь, внутри на полке одна лампочка. На полу перед сейфом — три
       оторванных календарных листа (третий год) и пыль дорожкой к двери.
       Подписывать «вы её бережёте» не нужно — сейф говорит сам.
       Пол на y≈604; персонаж стоит перед сейфом, слева от дверцы. -->
  <rect width="1280" height="720" fill="#d4d7cf"/>
  <rect width="1280" height="140" fill="#5f625b"/>
  <rect y="140" width="1280" height="464" fill="#c9ccc3"/>
  <rect y="604" width="1280" height="116" fill="#a2a59d"/>
  <path d="M-10 604 Q640 598 1290 606" stroke="#141410" stroke-width="6" fill="none"/>
  <path d="M-10 140 Q640 146 1290 138" stroke="#141410" stroke-width="6" fill="none"/>

  <!-- КОРПУС СЕЙФА: чёрный блок от пола почти до потолка, правая треть кадра -->
  <path d="M760 176 L1200 170 L1206 604 L754 604 Z" fill="#141410"/>
  <path d="M754 604 L1206 604 L1214 636 L746 636 Z" fill="#141410"/>
  <!-- ДВЕРЦА: распахнута на ладонь, видна торцом; за ней светлая полка -->
  <path d="M800 210 L1160 206 L1160 570 L800 574 Z" fill="#a2a59d"/>
  <path d="M812 226 L1146 222 L1146 556 L812 560 Z" fill="#141410"/>
  <path d="M760 176 L806 196 L806 590 L754 604 Z" fill="#141410"/>
  <path d="M806 196 L830 214 L830 578 L806 590 Z" fill="#5f625b" stroke="#141410" stroke-width="5"/>
  <!-- полка и ЛАМПОЧКА на ней: единственное, что внутри -->
  <path d="M846 420 L1130 418" stroke="#c9ccc3" stroke-width="8"/>
  <path d="M960 352 Q930 350 930 380 Q930 400 950 410 L950 418 L988 418 L988 410 Q1008 400 1008 380 Q1008 350 978 352 Z"
        fill="#c9ccc3" stroke="#d4d7cf" stroke-width="3"/>
  <path d="M954 384 L969 400 L984 384" stroke="#141410" stroke-width="3" fill="none"/>
  <!-- штурвал замка снаружи и ручка -->
  <circle cx="1090" cy="392" r="46" fill="none" stroke="#c9ccc3" stroke-width="9"/>
  <path d="M1090 346 L1090 438 M1044 392 L1136 392" stroke="#c9ccc3" stroke-width="9"/>
  <path d="M1112 300 L1130 300 L1130 340 L1112 340 Z" fill="#c9ccc3"/>

  <!-- ТРИ КАЛЕНДАРНЫХ ЛИСТА НА ПОЛУ: год, год, год -->
  <g fill="#c9ccc3" stroke="#141410" stroke-width="5">
    <path d="M300 640 L372 634 L378 690 L306 696 Z"/>
    <path d="M410 652 L486 646 L490 700 L416 706 Z"/>
    <path d="M540 646 L616 640 L622 694 L546 700 Z"/>
  </g>
  <g stroke="#141410" stroke-width="4" fill="none">
    <path d="M312 656 L364 652"/><path d="M314 672 L360 668"/>
    <path d="M424 668 L476 664"/><path d="M426 684 L470 680"/>
    <path d="M552 662 L604 658"/><path d="M554 678 L598 674"/>
  </g>

  <!-- ПЫЛЬ: серые полосы дорожкой от сейфа к краю кадра — ходили и ходили -->
  <g stroke="#8d9088" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M740 660 Q560 668 380 664"/>
    <path d="M700 690 Q520 700 330 692"/>
    <path d="M760 620 Q600 624 440 622"/>
  </g>
  <!-- голая лампа на шнуре: свет один, и он не на сейф -->
  <path d="M260 0 L262 110" stroke="#141410" stroke-width="5" fill="none"/>
  <path d="M222 110 L302 110 L286 146 L238 146 Z" fill="#141410"/>
  <path d="M238 146 L120 604 L404 604 L286 146 Z" fill="#f2f4ec" opacity="0.35"/>
</svg>
