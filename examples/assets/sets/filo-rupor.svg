<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- РУПОР НА СТОЛБЕ.
       «Кто сказал? Кто-то.» — пустая площадь, один столб, на нём рупор
       громкоговорителя, из раструба расходятся дуги: говорит, и давно.
       Под столбом никого. Земля усыпана теми же записками, как листвой.

       ЯЗЫК КАДРА СВЕРЕН С СОСЕДЯМИ 08.09.2026, как и у очереди: чистое поле
       и одна рисованная линия земли вместо полос потолка, парапета и пола.
       Парапет убран совсем — он держал глубину, но той же тональной полосой,
       из-за которой сцена читалась темнее генерированных соседей.

       Линия земли — 0.775; персонаж на 0.839 стоит перед ней, под рупором,
       чуть правее центра.

       РУПОР КРУПНЫЙ НАМЕРЕННО. После снятия полос в кадре не осталось ни
       одной большой массы, и склейка на эту сцену перестала читаться: замер
       нашёл вдвое меньше смен кадра, чем раньше. У каждой генерированной
       локации ровно одна крупная тёмная форма — автомат, голова, стол; здесь
       такой формой стал сам раструб. Он же и предмет сцены: «кто сказал?»
       спрашивают у рупора, а не у столба. Тень столба на земле — сплошное
       пятно по канону LOCATION_STYLE §4. -->
  <rect width="1280" height="720" fill="#e2e3e0"/>

  <!-- ЛИНИЯ ЗЕМЛИ -->
  <path d="M-10 558 Q240 552 500 559 Q760 566 1010 556 Q1160 551 1290 557"
        stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ТЕНЬ СТОЛБА: сплошное пятно, как у головы в соседней сцене -->
  <ellipse cx="392" cy="576" rx="150" ry="20" fill="#17170f" opacity="0.8"/>

  <!-- СТОЛБ: от земли выше кадра, толстый -->
  <path d="M286 -10 L330 -10 L340 566 L278 566 Z" fill="#141410"/>
  <path d="M266 566 L352 566 L362 590 L256 590 Z" fill="#141410"/>

  <!-- РУПОР: кронштейн и КРУПНЫЙ раструб вправо-вниз, на площадь.
       Правый край держится левее 660, чтобы не налезть на фигуру (x≈0.56). -->
  <path d="M330 138 L404 186" stroke="#141410" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M380 152 L438 128 L612 244 L578 336 L368 240 Z" fill="#141410"/>
  <path d="M578 336 L612 244 Q664 254 664 292 Q660 340 604 344 Z"
        fill="#5f625b" stroke="#141410" stroke-width="7"/>

  <!-- ДУГИ ЗВУКА: три, всё шире; говорит, и давно -->
  <g stroke="#141410" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M700 232 Q752 292 700 352"/>
    <path d="M760 198 Q854 292 760 386"/>
    <path d="M828 160 Q962 292 828 424"/>
  </g>

  <!-- ЗАПИСКИ НА ЗЕМЛЕ: те же, что в автомате и в голове -->
  <g fill="#f7f7f4" stroke="#141410" stroke-width="3.5">
    <rect x="80" y="620" width="30" height="30" rx="5" transform="rotate(-12 95 635)"/>
    <rect x="196" y="664" width="30" height="30" rx="5" transform="rotate(20 211 679)"/>
    <rect x="430" y="632" width="30" height="30" rx="5" transform="rotate(8 445 647)"/>
    <rect x="556" y="676" width="30" height="30" rx="5" transform="rotate(-25 571 691)"/>
    <rect x="700" y="620" width="30" height="30" rx="5" transform="rotate(14 715 635)"/>
    <rect x="826" y="670" width="30" height="30" rx="5" transform="rotate(-6 841 685)"/>
    <rect x="962" y="628" width="30" height="30" rx="5" transform="rotate(30 977 643)"/>
    <rect x="1086" y="680" width="30" height="30" rx="5" transform="rotate(-18 1101 695)"/>
    <rect x="1186" y="616" width="30" height="30" rx="5" transform="rotate(10 1201 631)"/>
    <rect x="1010" y="580" width="24" height="24" rx="4" transform="rotate(22 1022 592)"/>
    <rect x="884" y="572" width="22" height="22" rx="4" transform="rotate(-14 895 583)"/>
    <rect x="150" y="580" width="22" height="22" rx="4" transform="rotate(6 161 591)"/>
    <rect x="1240" y="596" width="24" height="24" rx="4" transform="rotate(-9 1252 608)"/>
  </g>
  <g stroke="#141410" stroke-width="2.8" fill="none">
    <path d="M437 645 Q446 636 455 645 Q446 654 437 645"/>
    <path d="M707 633 Q716 624 725 633 Q716 642 707 633"/>
    <path d="M969 641 Q978 632 987 641 Q978 650 969 641"/>
    <path d="M87 633 Q96 624 105 633 Q96 642 87 633"/>
    <path d="M833 683 Q842 674 851 683 Q842 692 833 683"/>
    <path d="M1193 629 Q1202 620 1211 629 Q1202 638 1193 629"/>
  </g>
</svg>
