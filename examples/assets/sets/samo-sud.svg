<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ЗАЛ СУДА, В КОТОРОМ НЕТ НИКОГО, КРОМЕ ПОДСУДИМОГО.
       Кафедра нависает и занимает верх кадра, кресло судьи пустое и повёрнуто
       спинкой, молоток лежит на подставке — а заседание идёт. Внизу барьер
       скамьи подсудимых: он внутри. Обвинителя не видно, потому что обвинитель
       и есть подсудимый; в кадре это сказано пустотой кресла, а не подписью.
       Пол кафедры — на y≈604, барьер ниже: персонаж стоит на своём полу. -->
  <rect width="1280" height="720" fill="#c9ccc3"/>
  <rect width="1280" height="120" fill="#5f625b"/>
  <rect y="120" width="1280" height="180" fill="#a2a59d"/>
  <rect y="604" width="1280" height="116" fill="#b0b3ab"/>
  <path d="M-10 604 Q640 598 1290 606" stroke="#141410" stroke-width="6" fill="none"/>

  <!-- КАФЕДРА: массивная чёрная плита во всю ширину, нависает -->
  <path d="M180 300 Q640 288 1100 302 L1116 402 Q640 418 164 400 Z" fill="#141410"/>
  <path d="M164 400 L1116 402 L1116 424 L164 422 Z" fill="#141410"/>
  <!-- панель под кафедрой: три плоскости, разделённые контуром -->
  <path d="M206 424 L1074 426 L1052 546 L228 544 Z" fill="#a2a59d" stroke="#141410" stroke-width="6"/>
  <path d="M470 426 L468 544" stroke="#141410" stroke-width="6"/>
  <path d="M812 427 L814 545" stroke="#141410" stroke-width="6"/>

  <!-- ПУСТОЕ КРЕСЛО СУДЬИ: высокая спинка над кафедрой, развёрнута -->
  <path d="M566 118 Q560 200 566 300 L716 300 Q722 200 716 118 Q640 104 566 118 Z" fill="#141410"/>
  <path d="M596 152 Q640 142 686 152 L682 268 Q640 278 600 268 Z" fill="#c9ccc3"/>

  <!-- МОЛОТОК НА ПОДСТАВКЕ: лежит, но заседание идёт -->
  <path d="M282 268 L392 262 L394 288 L284 294 Z" fill="#141410"/>
  <path d="M330 236 L370 234 L372 264 L332 266 Z" fill="#141410"/>
  <path d="M370 244 L468 240 L470 258 L372 262 Z" fill="#141410"/>

  <!-- ЛАМПА НА ДЛИННОМ ШНУРЕ: свет только на подсудимого -->
  <path d="M900 0 L906 96" stroke="#141410" stroke-width="6" fill="none"/>
  <path d="M846 96 L966 96 L936 148 L876 148 Z" fill="#141410"/>
  <path d="M876 148 L640 604 L1180 604 L936 148 Z" fill="#f2f4ec" opacity="0.35"/>

  <!-- БАРЬЕР СКАМЬИ ПОДСУДИМЫХ: он внутри загородки -->
  <path d="M120 606 L120 690 L1160 690 L1160 606" stroke="#141410" stroke-width="10" fill="none"/>
  <g stroke="#141410" stroke-width="8">
    <path d="M232 610 L232 690"/><path d="M400 610 L400 690"/>
    <path d="M880 610 L880 690"/><path d="M1048 610 L1048 690"/>
  </g>

  <!-- ряды пустых мест по бокам: слушать пришли ноль -->
  <g stroke="#141410" stroke-width="6" fill="none">
    <path d="M-10 470 L120 468 L120 546 L-10 548"/>
    <path d="M-10 512 L120 510"/>
    <path d="M1160 468 L1290 470 L1290 548 L1160 546"/>
    <path d="M1160 510 L1290 512"/>
  </g>
</svg>
