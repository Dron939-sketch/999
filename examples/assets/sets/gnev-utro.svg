<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ТА ЖЕ КУХНЯ УТРОМ. ВЗЛЁТ.
       Рифма к вечерней кухне и её опровержение: тот же стол, та же кружка —
       но стоит ровно, лужи нет, рядом ВТОРАЯ кружка, и два стула развёрнуты
       друг к другу. Ролик обещает не «спокойствие», а разговор после
       (лекция 6, «Разговор после: как чинить»).

       Отличается от вечерней сцены тремя вещами и больше ничем: кружка стоит,
       кружек две, стулья повёрнуты. Лампа погашена, свет из окна.

       Линия земли — 0.775; персонаж на 0.839 стоит слева от стола (x≈0.34). -->
  <rect width="1280" height="720" fill="#e2e3e0"/>

  <path d="M-10 558 Q230 552 500 559 Q780 566 1030 556 Q1180 551 1290 557"
        stroke="#141410" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ОКНО: один жёсткий луч на стол -->
  <path d="M1080 108 L1268 104 L1268 300 L1080 304 Z" fill="#f7f7f4" stroke="#141410" stroke-width="7"/>
  <path d="M1174 106 L1174 302 M1080 204 L1268 202" stroke="#141410" stroke-width="6"/>
  <path d="M1080 304 L820 392 L1160 386 L1268 300 Z" fill="#f7f7f4" opacity="0.45"/>


  <!-- ВЕРХ КАДРА БЫЛ ПУСТ. Половина кадра — белая стена без единой вещи, и
       локация читалась «предмет на листе бумаги», а не кухня. Навесной шкаф
       над столом и полка с банками слева заполняют верхний план и дают вторую
       тональную плоскость. Геометрия ОБЩАЯ для вечера и утра: рифма держится
       на совпадении кадра, поэтому обе вещи стоят в обеих кухнях. -->
  <path d="M600 118 L1012 112 L1016 282 L602 288 Z" fill="#a2a59d" stroke="#141410" stroke-width="7"/>
  <path d="M808 115 L810 285" stroke="#141410" stroke-width="6"/>
  <path d="M770 196 L788 195 M832 195 L850 194" stroke="#141410" stroke-width="9" stroke-linecap="round"/>
  <path d="M598 282 L1016 276" stroke="#141410" stroke-width="5"/>

  <path d="M130 232 L424 228 L424 248 L130 252 Z" fill="#141410"/>
  <path d="M186 160 L226 159 Q234 159 234 170 L232 228 L180 230 L178 170 Q178 160 186 160 Z"
        fill="#f7f7f4" stroke="#141410" stroke-width="6"/>
  <path d="M300 172 L344 171 Q352 171 352 182 L350 228 L294 230 L292 182 Q292 172 300 172 Z"
        fill="#f7f7f4" stroke="#141410" stroke-width="6"/>
  <path d="M182 186 L232 185 M294 196 L350 195" stroke="#141410" stroke-width="5"/>

  <!-- ТЕНЬ СТОЛА -->
  <ellipse cx="800" cy="572" rx="230" ry="22" fill="#17170f" opacity="0.8"/>

  <!-- СТОЛ: тот же -->
  <path d="M596 392 L1010 386 L1018 424 L590 430 Z" fill="#5f625b" stroke="#141410" stroke-width="7"/>
  <path d="M628 430 L620 566 M978 424 L988 566" stroke="#141410" stroke-width="15"/>

  <!-- ДВЕ КРУЖКИ, обе стоят ровно -->
  <path d="M676 336 L734 334 Q740 334 740 344 L738 386 Q738 392 730 392 L682 392 Q674 392 674 384 L672 344 Q672 336 676 336 Z"
        fill="#f7f7f4" stroke="#141410" stroke-width="6"/>
  <path d="M740 346 Q766 344 766 360 Q766 376 740 374" fill="none" stroke="#141410" stroke-width="6"/>
  <path d="M812 340 L866 338 Q872 338 872 348 L870 386 Q870 392 862 392 L818 392 Q810 392 810 384 L808 348 Q808 340 812 340 Z"
        fill="#f7f7f4" stroke="#141410" stroke-width="6"/>
  <path d="M872 350 Q896 348 896 362 Q896 376 872 374" fill="none" stroke="#141410" stroke-width="6"/>

  <!-- ДВА СТУЛА, развёрнуты друг к другу: один слева от стола, один справа -->
  <path d="M470 400 L530 398 L534 566 L524 566 L520 452 L478 454 L474 566 L464 566 Z" fill="#141410"/>
  <path d="M462 300 L474 300 L476 402 L464 402 Z" fill="#141410"/>
  <path d="M462 308 L528 306 L528 324 L462 326 Z" fill="#141410"/>

  <path d="M1046 398 L1106 396 L1110 566 L1100 566 L1096 450 L1054 452 L1050 566 L1040 566 Z" fill="#141410"/>
  <path d="M1096 298 L1108 298 L1110 400 L1098 400 Z" fill="#141410"/>
  <path d="M1044 306 L1110 304 L1110 322 L1044 324 Z" fill="#141410"/>

  <!-- ПОГАСШАЯ ЛАМПА: та же, но конуса нет -->
  <path d="M804 0 L806 96" stroke="#141410" stroke-width="5" fill="none"/>
  <path d="M762 96 L850 96 L832 136 L780 136 Z" fill="#141410"/>
</svg>
