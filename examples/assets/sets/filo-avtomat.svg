<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- АВТОМАТ ГОТОВЫХ ОТВЕТОВ.
       Ответы покупают, а не думают: торговый автомат в правой трети кадра,
       ряды ячеек, в каждой одинаковая скрученная бумажка. Панель с кнопками
       столбиком, лоток внизу — пустой. На полу перед автоматом гора
       скомканных бумажек: уже прочитанных и выброшенных. Подписывать «смысл
       жизни — третья кнопка сверху» не нужно — панель говорит сама.
       Пол на y≈604; персонаж стоит слева от автомата. -->
  <rect width="1280" height="720" fill="#d4d7cf"/>
  <rect width="1280" height="140" fill="#5f625b"/>
  <rect y="140" width="1280" height="464" fill="#c9ccc3"/>
  <rect y="604" width="1280" height="116" fill="#a2a59d"/>
  <path d="M-10 604 Q640 598 1290 606" stroke="#141410" stroke-width="6" fill="none"/>
  <path d="M-10 140 Q640 146 1290 138" stroke="#141410" stroke-width="6" fill="none"/>

  <!-- КОРПУС АВТОМАТА: тёмный блок от пола почти до потолка -->
  <path d="M780 168 L1200 162 L1206 604 L774 604 Z" fill="#5f625b" stroke="#141410" stroke-width="7"/>
  <path d="M774 604 L1206 604 L1214 634 L766 634 Z" fill="#141410"/>
  <!-- ВИТРИНА: светлое окно с полками -->
  <path d="M806 196 L1086 192 L1086 470 L806 474 Z" fill="#c9ccc3" stroke="#141410" stroke-width="6"/>
  <g stroke="#141410" stroke-width="5">
    <path d="M806 262 L1086 260"/><path d="M806 332 L1086 330"/><path d="M806 402 L1086 400"/>
  </g>
  <!-- БУМАЖКИ В ЯЧЕЙКАХ: четыре ряда по пять, все одинаковые -->
  <g fill="#f2f4ec" stroke="#141410" stroke-width="4">
    <rect x="822" y="222" width="34" height="34" rx="6"/><rect x="876" y="222" width="34" height="34" rx="6"/>
    <rect x="930" y="222" width="34" height="34" rx="6"/><rect x="984" y="222" width="34" height="34" rx="6"/>
    <rect x="1038" y="222" width="34" height="34" rx="6"/>
    <rect x="822" y="292" width="34" height="34" rx="6"/><rect x="876" y="292" width="34" height="34" rx="6"/>
    <rect x="930" y="292" width="34" height="34" rx="6"/><rect x="984" y="292" width="34" height="34" rx="6"/>
    <rect x="1038" y="292" width="34" height="34" rx="6"/>
    <rect x="822" y="362" width="34" height="34" rx="6"/><rect x="876" y="362" width="34" height="34" rx="6"/>
    <rect x="930" y="362" width="34" height="34" rx="6"/><rect x="984" y="362" width="34" height="34" rx="6"/>
    <rect x="1038" y="362" width="34" height="34" rx="6"/>
    <rect x="822" y="432" width="34" height="34" rx="6"/><rect x="876" y="432" width="34" height="34" rx="6"/>
    <rect x="930" y="432" width="34" height="34" rx="6"/><rect x="984" y="432" width="34" height="34" rx="6"/>
    <rect x="1038" y="432" width="34" height="34" rx="6"/>
  </g>
  <!-- спираль скрутки на каждой бумажке: один и тот же завиток -->
