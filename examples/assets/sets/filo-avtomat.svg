  <path d="M840 520 L1060 518 L1060 566 L840 568 Z" fill="#141410"/>
  <path d="M852 534 L1048 532 L1048 552 L852 554 Z" fill="#5f625b"/>
  <!-- щель монетоприёмника -->
  <path d="M1128 500 L1164 500 L1164 508 L1128 508 Z" fill="#c9ccc3"/>

  <!-- ГОРА СКОМКАННЫХ БУМАЖЕК НА ПОЛУ: прочитаны и выброшены -->
  <g fill="#f2f4ec" stroke="#141410" stroke-width="4">
    <path d="M560 668 Q576 640 604 650 Q626 640 632 664 Q650 680 624 692 Q596 702 574 690 Q550 686 560 668 Z"/>
