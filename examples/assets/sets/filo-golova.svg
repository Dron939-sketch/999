<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ГОЛОВА С ДВЕРЦЕЙ.
       «Голова своя. А внутри — чужое.» Огромный чёрный профиль головы во весь
       правый край, смотрит вправо, от нас. В затылке распахнута дверца, за ней
       светлый склад: полки, и на полках ряды тех же бумажек из автомата.
       Дверца открыта — заглянуть можно, и это страшнее запертой.
       Пол на y≈604; персонаж стоит перед дверцей, слева. -->
  <rect width="1280" height="720" fill="#d4d7cf"/>
  <rect width="1280" height="130" fill="#5f625b"/>
  <rect y="130" width="1280" height="474" fill="#c9ccc3"/>
  <rect y="604" width="1280" height="116" fill="#a2a59d"/>
  <path d="M-10 604 Q640 598 1290 606" stroke="#141410" stroke-width="6" fill="none"/>
  <path d="M-10 130 Q640 136 1290 128" stroke="#141410" stroke-width="6" fill="none"/>

  <!-- ПРОФИЛЬ: затылок к нам слева, лицо к правой кромке. Стоит на полу шеей -->
  <path d="M760 604 L760 470 Q700 420 706 300 Q716 150 880 150 Q1030 150 1090 240 Q1120 290 1110 320 L1130 340 L1108 350 L1114 380 Q1100 392 1090 400 Q1094 440 1060 452 Q1010 470 980 460 L972 604 Z"
        fill="#141410"/>
  <!-- ДВЕРЦА В ЗАТЫЛКЕ: проём светлый, створка распахнута наружу, к нам -->
  <path d="M736 250 L900 246 L900 470 L736 474 Z" fill="#c9ccc3" stroke="#141410" stroke-width="6"/>
  <path d="M736 250 L660 300 L660 520 L736 474 Z" fill="#5f625b" stroke="#141410" stroke-width="6"/>
  <path d="M676 392 L690 388 L690 408 L676 412 Z" fill="#c9ccc3"/>
  <!-- ПОЛКИ ВНУТРИ -->
  <g stroke="#141410" stroke-width="5">
    <path d="M736 318 L900 316"/><path d="M736 388 L900 386"/><path d="M736 456 L900 454"/>
  </g>
  <!-- ТЕ ЖЕ БУМАЖКИ, ряды на полках -->
  <g fill="#f2f4ec" stroke="#141410" stroke-width="4">
    <rect x="750" y="280" width="30" height="30" rx="5"/><rect x="794" y="280" width="30" height="30" rx="5"/>
    <rect x="838" y="280" width="30" height="30" rx="5"/>
    <rect x="750" y="350" width="30" height="30" rx="5"/><rect x="794" y="350" width="30" height="30" rx="5"/>
    <rect x="838" y="350" width="30" height="30" rx="5"/>
    <rect x="750" y="418" width="30" height="30" rx="5"/><rect x="794" y="418" width="30" height="30" rx="5"/>
    <rect x="838" y="418" width="30" height="30" rx="5"/>
  </g>
  <g stroke="#141410" stroke-width="3" fill="none">
    <path d="M756 295 Q765 285 774 295 Q765 305 756 295"/><path d="M800 295 Q809 285 818 295 Q809 305 800 295"/>
    <path d="M844 295 Q853 285 862 295 Q853 305 844 295"/>
    <path d="M756 365 Q765 355 774 365 Q765 375 756 365"/><path d="M800 365 Q809 355 818 365 Q809 375 800 365"/>
    <path d="M844 365 Q853 355 862 365 Q853 375 844 365"/>
    <path d="M756 433 Q765 423 774 433 Q765 443 756 433"/><path d="M800 433 Q809 423 818 433 Q809 443 800 433"/>
    <path d="M844 433 Q853 423 862 433 Q853 443 844 433"/>
  </g>
  <!-- ГЛАЗ ПРОФИЛЯ: один, смотрит от нас, вправо -->
  <path d="M1020 268 Q1046 252 1066 272 Q1046 286 1020 268 Z" fill="#c9ccc3"/>
  <circle cx="1050" cy="269" r="6" fill="#141410"/>

  <!-- ТЕНЬ ГОЛОВЫ НА ПОЛУ: сплошное пятно -->
  <path d="M700 604 L1010 604 L1080 660 L640 660 Z" fill="#17170f" opacity="0.8"/>
  <!-- ГОЛЫЙ ПОЛ -->
  <g stroke="#8d9088" stroke-width="4" fill="none" opacity="0.7">
    <path d="M-10 680 L1290 680"/><path d="M240 604 L220 720"/><path d="M480 604 L470 720"/>
  </g>
</svg>
