<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- ПУСТОТА НА БУМАГЕ. Локация без единого предмета: голое светлое поле,
       на котором чёрная фигура читается целиком — и балахон, и руки, и жест.

       ЗАЧЕМ ЗАВЕДЕНА, ЕСЛИ УЖЕ ЕСТЬ `void-black.svg`. Чёрная пустота писалась
       как приём: «от фигуры остаётся только белая маска». Приём этот верен на
       УДАР — на секунду-две, когда лицо обязано остаться одно. В «Девяносто
       девятом дне» на чёрной пустоте стояли двадцать четыре секунды и четыре
       реплики: тела не было видно ни разу, жесты уходили в никуда, а после
       того как руки обшили светлой каймой, от фигуры остались маска и две
       проволоки — читалось это как оторванные конечности, а не как приём.

       Замысел «вне помещения, ни тона, ни комнаты» бумага держит ровно так же,
       как чернота: предметов нет, стен нет, пола не видно. Разница только в
       том, что на бумаге видно персонажа.

       Чёрная пустота никуда не делась и остаётся для коротких ударов. -->
  <rect x="0" y="0" width="1280" height="720" fill="#eceee8"/>
</svg>
