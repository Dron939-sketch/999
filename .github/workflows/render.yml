name: Render Videos

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'      # пуши рабочей ветки тоже запускают завод
  # Ручной запуск на любой ветке: Actions → Render Videos → Run workflow
  workflow_dispatch:
    inputs:
      production:
        description: >-
          id продакшенов из tools/productions.json через пробел (например
          teorii-lichnosti-intro). Пусто — только затронутые правкой;
          `all` — весь манифест.
        required: false
        default: ''

permissions:
  contents: write

# Только один прогон на ветку: новый push отменяет предыдущий незавершённый
# (не плодим гонки на git-коммите видео и не жжём раннеры).
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Какие продакшены гнать. УМОЛЧАНИЕ — ТОЛЬКО ЗАТРОНУТЫЕ ПРАВКОЙ.
      #
      # Раньше умолчанием был весь манифест: правка одного интро стоила сорока
      # минут раннера и переозвучки девяти чужих роликов, у которых не менялся
      # ни кадр. Теперь набор считает `tools/affected.py` по diff'у пуша —
      # сценарий, его ассеты (риг, декорации, пропы, транзитивно), VO-файл.
      # Правка движка/завода/тестов задевает всё → `ALL`; правка одних доков не
      # задевает ничего → рендер пропускается целиком.
      #
      # Три ручных перехвата, потому что автоматика не покрывает всё:
      #   * `workflow_dispatch` с полем `production` — но он доступен не всем
      #     токенам (у ассистента отдаёт 403);
      #   * маркер `[only: <id> <id>]` в ЗАГОЛОВКЕ коммита — тот же выбор без
      #     workflow_dispatch;
      #   * маркер `[all]` — перегнать весь манифест (сверка после правок в
      #     доктрине, когда diff «ничего не задел», а пересобрать надо всё);
      #   * маркер `[skip render]` — не гнать ничего. Нужен, когда правка задела
      #     глобальный путь (движок, завод, сам workflow), но ни одного пикселя
      #     не меняет: без него правка комментария в render.yml стоит полного
      #     прогона.
      #
      # МАРКЕРЫ ЧИТАЮТСЯ ТОЛЬКО ИЗ ЗАГОЛОВКА (первой строки). Раньше искали по
      # всему сообщению — и коммит, в теле которого написано «восстанавливается
      # маркером [all]», сам себя и запускал на полный прогон. Проза о маркере
      # неотличима от маркера, если смотреть на всё сообщение; заголовок же
      # человек пишет коротко и осознанно.
      - name: Какие продакшены рендерим
        env:
          INPUT_ONLY: ${{ inputs.production }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          SUBJ=$(git log -1 --pretty=%s)      # ТОЛЬКО заголовок, см. выше
          echo "Заголовок коммита: $SUBJ"
          ONLY="$INPUT_ONLY"
          if [ -z "$ONLY" ]; then
            ONLY=$(printf '%s' "$SUBJ" \
              | sed -n 's/.*\[only:[[:space:]]*\([A-Za-z0-9_ -]*\)\].*/\1/p' | head -1)
          fi
          if printf '%s' "$SUBJ" | grep -qi '\[all\]'; then ONLY="all"; fi
          # `[skip render]` сильнее всех прочих маркеров и ручного поля: если
          # человек сказал «не гони», спорить не о чем.
          if printf '%s' "$SUBJ" | grep -qi '\[skip[ -]render\]'; then
            echo "RENDER_ONLY=" >> "$GITHUB_ENV"
            echo "RENDER_SUBSET=skip" >> "$GITHUB_ENV"
            echo "Маркер [skip render] — рендер пропускается."
            exit 0
          fi

          if [ -z "$ONLY" ]; then
            # Диапазон пуша. Родителя тянем точечно (--depth=1): полный клон
            # этого репо — 600МБ, качать его ради одного diff'а незачем.
            RANGE_OK=0
            case "$BEFORE" in
              ""|0000000000000000000000000000000000000000) ;;
              *) git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null \
                   && RANGE_OK=1 ;;
            esac
            if [ "$RANGE_OK" = 1 ]; then
              CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
              echo "--- изменено в пуше ---"; echo "$CHANGED"
              ONLY=$(printf '%s\n' "$CHANGED" | python3 tools/affected.py - | tr '\n' ' ')
            else
              # Новая ветка / история недоступна — считать нечего, гоним всё:
              # ложное «ALL» стоит раннера, ложное «ничего» — дефекта в релизе.
              echo "База для diff'а недоступна (before=$BEFORE) — гоню весь манифест."
              ONLY="all"
            fi
          fi

          ONLY=$(printf '%s' "$ONLY" | tr -s ' ' | sed 's/^ *//;s/ *$//')
          if [ "$ONLY" = "ALL" ] || [ "$ONLY" = "all" ]; then ONLY=""; SUBSET=0
          elif [ -z "$ONLY" ]; then SUBSET=skip
          else SUBSET=1
          fi
          echo "RENDER_ONLY=$ONLY" >> "$GITHUB_ENV"
          echo "RENDER_SUBSET=$SUBSET" >> "$GITHUB_ENV"
          case "$SUBSET" in
            skip) echo "Правка не задела ни одного ролика — рендер пропускается." ;;
            0)    echo "Продакшены: ВЕСЬ МАНИФЕСТ" ;;
            *)    echo "Продакшены: $ONLY" ;;
          esac

      - name: Install ffmpeg
        if: env.RENDER_SUBSET != 'skip'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Питон-зависимости планки (qc_metrics: golden-diff по SSIM). Без них
      # измеритель падал на `import numpy` — прогон писал «планка не измерена».
      # vtracer — художник (tools/vectorize.py): обводка растра в векторные
      # пути. Ставится готовым колесом, без сборки Rust; без него художник
      # честно падает на вставку растром и говорит об этом в логе.
      - name: Python deps (планка, художник)
        if: env.RENDER_SUBSET != 'skip'
        run: python3 -m pip install --quiet --upgrade numpy pillow vtracer

      # Rhubarb Lip Sync — фонемный липсинк (рот артикулирует слоги, не флэпы).
      # Бинарь кэшируется; при недоступности завод честно падает на RMS-огибающую.
      - name: Rhubarb cache
        if: env.RENDER_SUBSET != 'skip'
        id: rhubarb-cache
        uses: actions/cache@v4
        with:
          path: ~/rhubarb
          key: rhubarb-1.13.0-linux

      - name: Install Rhubarb Lip Sync
        if: env.RENDER_SUBSET != 'skip' && steps.rhubarb-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/rhubarb
          curl -sSL -o /tmp/rhubarb.zip \
            https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip
          unzip -q /tmp/rhubarb.zip -d ~/rhubarb
          find ~/rhubarb -name rhubarb -type f -exec chmod +x {} \;

      - name: Expose RHUBARB_BIN
        if: env.RENDER_SUBSET != 'skip'
        run: echo "RHUBARB_BIN=$(find ~/rhubarb -name rhubarb -type f | head -1)" >> "$GITHUB_ENV"

      - name: Rust cache
        if: env.RENDER_SUBSET != 'skip'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build engine
        if: env.RENDER_SUBSET != 'skip'
        run: cargo build --release

      # Один завод: картинки → рендер → озвучка → сведение → videos/*.mp4(+mp3)
      - name: Studio (render + voice + mux)
        if: env.RENDER_SUBSET != 'skip'
        env:
          # ОСНОВНОЙ путь озвучки — ПРЯМОЙ Fish Audio: студия клонировала свой
          # голос, его id лежит в FISH_AUDIO_VOICE_ID. Frederick — запасной,
          # включается только если ключа Fish нет.
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          # Голос: по умолчанию завод САМ находит в аккаунте модель с
          # «freeman»/«фримен» в названии. Секрет нужен, только чтобы
          # переопределить выбор конкретным id.
          FISH_AUDIO_VOICE_ID: ${{ secrets.FISH_AUDIO_VOICE_ID }}
          FISH_VOICE_NAME: ${{ secrets.FISH_VOICE_NAME }}
          # Модель Fish (s2 — новее и живее s1). Пусто = s2 с откатом.
          FISH_AUDIO_MODEL: ${{ secrets.FISH_AUDIO_MODEL }}
          # Запасной путь (см. выше).
          FREDERICK_ADMIN_TOKEN: ${{ secrets.FREDERICK_ADMIN_TOKEN != '' && secrets.FREDERICK_ADMIN_TOKEN || secrets.ADMIN_TOKEN }}
          FREDERICK_TTS_URL: ${{ secrets.FREDERICK_TTS_URL }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_API_PROVIDER: ${{ secrets.IMAGE_API_PROVIDER }}
        run: |
          # Набор посчитан шагом «Какие продакшены рендерим»: пусто = весь
          # манифест (маркер `[all]`, правка движка/завода, недоступная база
          # для diff'а), иначе — только затронутые правкой.
          # --strict: QC-гейт роняет прогон на немом/рассинхронном ролике, если
          # ключи озвучки заданы (иначе черновой режим — только предупреждения).
          # Без кавычек намеренно: $RENDER_ONLY — СПИСОК id через пробел.
          # shellcheck disable=SC2086
          python3 tools/studio.py --strict $RENDER_ONLY
          echo "=== videos/ ==="
          ls -la videos/

      - name: Upload videos to a GitHub Release
        # РЕЛИЗ НИКОГДА НЕ УДАЛЯЕТСЯ — ТОЛЬКО ДОЗАЛИВАЕТСЯ. Прежде полный прогон
        # делал `release delete --cleanup-tag` и создавал релиз заново из того,
        # что лежит в videos/. Вместе с `always()` и `cancel-in-progress` это
        # один раз уже стоило пяти роликов: следующий push отменил прогон на
        # середине, шаг заливки всё равно отработал (always() ловит и cancelled),
        # снёс релиз и пересоздал его из четырёх роликов, успевших отрендериться.
        # Остальные пять просто исчезли — при том, что их файлы были в порядке.
        #
        # Отсюда два предохранителя:
        #   1) `!cancelled()` вместо `always()` — на отменённом прогоне
        #      выкладывать нечего, он оборван на произвольном ролике. При КРАСНОМ
        #      прогоне заливка остаётся: принцип «отдать хоть что-то» был про QC,
        #      а не про отмену;
        #   2) заливка всегда через `upload --clobber` — свежие файлы затирают
        #      одноимённые, чужие остаются. Ценой того, что ассет удалённого из
        #      манифеста продакшена придётся снять руками, — это дешевле, чем
        #      терять релиз целиком.
        #
        # B2: артефакты НЕ в git (иначе videos/ и история пухнут линейно по
        # прогонам), а в Releases по rolling-тегу на ветку. GitHub Releases
        # держат до 2ГБ на файл — прежний 95МБ-предохранитель под git-пуш не нужен.
        if: '!cancelled() && env.RENDER_SUBSET != ''skip'''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(videos/*.mp4 videos/*.mp3)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "Нет готовых роликов — заливать нечего."
            exit 0
          fi
          TAG="renders-${GITHUB_REF_NAME//\//-}"
          NOTES="Автосборка роликов и озвучки для ветки \`$GITHUB_REF_NAME\` (commit \`$GITHUB_SHA\`). Обновляется на каждый прогон CI. Немой = рендер без голоса (TTS был недоступен)."
          echo "Заливаю ${#assets[@]} файл(ов) в Release '$TAG' (commit $GITHUB_SHA)"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Renders — $GITHUB_REF_NAME" --notes "$NOTES"
          gh release upload "$TAG" "${assets[@]}" --clobber
          # Заметки указывают на коммит последнего прогона — при дозаливке они
          # иначе врут про то, из чего собран релиз.
          gh release edit "$TAG" --notes "$NOTES" >/dev/null
          echo "Готово: $(gh release view "$TAG" --json url -q .url)"
