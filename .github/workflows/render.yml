name: Render Videos

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'      # пуши рабочей ветки тоже запускают завод
  # Ручной запуск на любой ветке: Actions → Render Videos → Run workflow
  workflow_dispatch:
    inputs:
      production:
        description: >-
          id одного продакшена из tools/productions.json (например
          teorii-lichnosti-intro). Пусто — рендерить всё.
        required: false
        default: ''

permissions:
  contents: write

# Только один прогон на ветку: новый push отменяет предыдущий незавершённый
# (не плодим гонки на git-коммите видео и не жжём раннеры).
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Какой продакшен гнать. Два входа, потому что ручной запуск доступен не
      # всем токенам: у ассистента `workflow_dispatch` отдаёт 403, а починить
      # один ролик надо, не переозвучивая остальные восемь. Поэтому тот же
      # выбор читается из сообщения последнего коммита: маркер `[only: <id>]`.
      # Пусто в обоих входах — гоним весь манифест, как и раньше.
      - name: Какой продакшен рендерим
        env:
          INPUT_ONLY: ${{ inputs.production }}
        run: |
          ONLY="$INPUT_ONLY"
          MSG=$(git log -1 --pretty=%B)
          # `[skip render]` — коммит не трогает ролики (документация, оснастка).
          # Без него правка одного README запускает полный прогон на пятнадцать
          # продакшенов: четверть часа раннера и перезалитый релиз ради файла,
          # которого рендер не касается. Маркер уже писали в сообщениях коммитов,
          # считая, что он работает, — он не работал.
          if [ -z "$INPUT_ONLY" ] && printf '%s' "$MSG" | grep -qiE '\[skip[ -]render\]'; then
            echo "Коммит помечен [skip render] — ролики не трогаем."
            echo "RENDER_SKIP=1" >> "$GITHUB_ENV"
            echo "RENDER_ONLY=" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$ONLY" ]; then
            ONLY=$(printf '%s' "$MSG" \
              | sed -n 's/.*\[only:[[:space:]]*\([A-Za-z0-9_-]*\)[[:space:]]*\].*/\1/p' \
              | head -1)
          fi
          # БЕЗ МАРКЕРА ЗАВОД НЕ ГОНИТ НИЧЕГО. Раньше пустой `[only:]` означал
          # «рендерить всё», и это стоило дорого: правка одного ролика или
          # документации запускала прогон на пятнадцать продакшенов, а студия
          # просила ровно обратного — «отправляй только один ролик». Полагаться
          # на то, что автор не забудет маркер, нельзя: забыть его бесплатно, а
          # ошибка стоит четверти часа раннера и перезалитого релиза.
          #
          # Теперь умолчание безопасное: нет маркера — нет прогона. Прогнать
          # весь каталог можно, но это надо СКАЗАТЬ: `[only: all]` или ручной
          # запуск с пустым полем production.
          if [ -z "$ONLY" ]; then
            echo "В сообщении коммита нет [only: <id>] — завод не запускается."
            echo "Нужен весь каталог — напиши [only: all]."
            echo "RENDER_SKIP=1" >> "$GITHUB_ENV"
            echo "RENDER_ONLY=" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$ONLY" = "all" ]; then
            ONLY=""
            echo "Маркер [only: all] — гоним весь каталог."
          fi
          echo "RENDER_ONLY=$ONLY" >> "$GITHUB_ENV"
          echo "Продакшен: ${ONLY:-ВЕСЬ КАТАЛОГ (по явному [only: all])}"

      - name: Install ffmpeg
        if: env.RENDER_SKIP != '1'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Питон-зависимости планки (qc_metrics: golden-diff по SSIM). Без них
      # измеритель падал на `import numpy` — прогон писал «планка не измерена».
      - name: Python deps (планка)
        if: env.RENDER_SKIP != '1'
        run: python3 -m pip install --quiet --upgrade numpy pillow

      # Rhubarb Lip Sync — фонемный липсинк (рот артикулирует слоги, не флэпы).
      # Бинарь кэшируется; при недоступности завод честно падает на RMS-огибающую.
      - name: Rhubarb cache
        if: env.RENDER_SKIP != '1'
        id: rhubarb-cache
        uses: actions/cache@v4
        with:
          path: ~/rhubarb
          key: rhubarb-1.13.0-linux

      - name: Install Rhubarb Lip Sync
        if: env.RENDER_SKIP != '1' && steps.rhubarb-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/rhubarb
          curl -sSL -o /tmp/rhubarb.zip \
            https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip
          unzip -q /tmp/rhubarb.zip -d ~/rhubarb
          find ~/rhubarb -name rhubarb -type f -exec chmod +x {} \;

      - name: Expose RHUBARB_BIN
        if: env.RENDER_SKIP != '1'
        run: echo "RHUBARB_BIN=$(find ~/rhubarb -name rhubarb -type f | head -1)" >> "$GITHUB_ENV"

      - name: Rust cache
        if: env.RENDER_SKIP != '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build engine
        if: env.RENDER_SKIP != '1'
        run: cargo build --release

      # Один завод: картинки → рендер → озвучка → сведение → videos/*.mp4(+mp3)
      - name: Studio (render + voice + mux)
        if: env.RENDER_SKIP != '1'
        env:
          # ОСНОВНОЙ путь озвучки — ПРЯМОЙ Fish Audio: студия клонировала свой
          # голос, его id лежит в FISH_AUDIO_VOICE_ID. Frederick — запасной,
          # включается только если ключа Fish нет.
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          # Голос: по умолчанию завод САМ находит в аккаунте модель с
          # «freeman»/«фримен» в названии. Секрет нужен, только чтобы
          # переопределить выбор конкретным id.
          FISH_AUDIO_VOICE_ID: ${{ secrets.FISH_AUDIO_VOICE_ID }}
          FISH_VOICE_NAME: ${{ secrets.FISH_VOICE_NAME }}
          # Модель Fish (s2 — новее и живее s1). Пусто = s2 с откатом.
          FISH_AUDIO_MODEL: ${{ secrets.FISH_AUDIO_MODEL }}
          # Запасной путь (см. выше).
          FREDERICK_ADMIN_TOKEN: ${{ secrets.FREDERICK_ADMIN_TOKEN != '' && secrets.FREDERICK_ADMIN_TOKEN || secrets.ADMIN_TOKEN }}
          FREDERICK_TTS_URL: ${{ secrets.FREDERICK_TTS_URL }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_API_PROVIDER: ${{ secrets.IMAGE_API_PROVIDER }}
        run: |
          ONLY="$RENDER_ONLY"
          # По умолчанию рендерим ВСЕ продакшены из манифеста — регрессии в
          # любом ролике видны в CI, а не только вручную. Ручной запуск с
          # заполненным полем `production` гонит ОДИН ролик: правка одного
          # интро не должна стоить сорока минут раннера и переозвучки всех
          # остальных.
          # --strict: QC-гейт роняет прогон на немом/рассинхронном ролике, если
          # ключи озвучки заданы (иначе черновой режим — только предупреждения).
          if [ -n "$ONLY" ]; then
            echo "Один продакшен: $ONLY"
            python3 tools/studio.py --strict "$ONLY"
          else
            python3 tools/studio.py --strict
          fi
          echo "=== videos/ ==="
          ls -la videos/

      - name: Upload videos to a GitHub Release
        # always(): даже при красном QC уже отрендеренные здоровые ролики должны
        # уехать в Release — принцип «отдать хоть что-то». B2: артефакты НЕ в git
        # (иначе videos/ и история пухнут линейно по прогонам), а в Releases по
        # rolling-тегу на ветку. GitHub Releases держат до 2ГБ на файл — прежний
        # 95МБ-предохранитель под git-пуш больше не нужен.
        if: always() && env.RENDER_SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ONLY="$RENDER_ONLY"
          shopt -s nullglob
          assets=(videos/*.mp4 videos/*.mp3)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "Нет готовых роликов — заливать нечего."
            exit 0
          fi
          TAG="renders-${GITHUB_REF_NAME//\//-}"
          NOTES="Автосборка роликов и озвучки для ветки \`$GITHUB_REF_NAME\` (commit \`$GITHUB_SHA\`). Обновляется на каждый прогон CI. Немой = рендер без голоса (TTS был недоступен)."
          echo "Заливаю ${#assets[@]} файл(ов) в Release '$TAG' (commit $GITHUB_SHA)"
          if [ -n "$ONLY" ]; then
            # Прогон одного ролика ДОЗАЛИВАЕТ, а не пересоздаёт релиз: videos/
            # не лежит в git, поэтому в таком прогоне собран ровно один ролик,
            # и пересоздание стёрло бы ссылки на все остальные.
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --target "$GITHUB_SHA" \
                --title "Renders — $GITHUB_REF_NAME" --notes "$NOTES"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            # Полный прогон — пересоздаём rolling-релиз на текущий SHA.
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Renders — $GITHUB_REF_NAME" \
              --notes "$NOTES"
          fi
          echo "Готово: $(gh release view "$TAG" --json url -q .url)"

      # ХРОНОМЕТРАЖ ПО ФАКТУ ВОЗВРАЩАЕТСЯ В ВЕТКУ.
      #
      # `tools/hronometrazh.py` переписывает `speaks for` и таймкоды VO-таблицы
      # по реальной длине синтезированных реплик. Эти числа существуют ТОЛЬКО
      # здесь: mp3 живут в рабочем каталоге раннера, в git их нет и не будет.
      # Не забрав правку обратно, мы чиним ролик и оставляем раскадровку врать
      # — тот самый случай «разовая правка чинит один ролик и оставляет причину
      # на месте», с которого начинается RABOTA-NAD-OSHIBKAMI.
      #
      # Коммит помечен `[skip render]`, иначе он запустит завод по кругу.
      # Шаг стоит ПОСЛЕДНИМ: пуш поднимет новый прогон, а `cancel-in-progress`
      # снимет текущий — к этому моменту ролики уже залиты в Release.
      # Любая неудача здесь не роняет прогон: ролик собран, а числа снимутся
      # заново на следующем.
      - name: Вернуть фактический хронометраж в ветку
        if: env.RENDER_SKIP != '1' && github.ref_type == 'branch'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Только раскадровки и VO-сценарии: ролики и озвучка в git не едут.
          # `:(glob)` — чтобы `**` означало «сквозь каталоги», а не «любой текст».
          git add -- ':(glob)examples/**/*.anim' ':(glob)examples/**/*-VO.md' || true
          if git diff --cached --quiet; then
            echo "Хронометраж сходится с озвучкой — возвращать нечего."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Хронометраж по факту озвучки: ${RENDER_ONLY:-весь каталог} [skip render]"
          # Обычный случай — ветка не уезжала, хватает одного пуша. Клон здесь
          # мелкий (checkout@v4 берёт один коммит), поэтому тянем чужую историю
          # только когда пуш отбили, а не на всякий случай.
          if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
            exit 0
          fi
          echo "Ветка уехала, пока шёл прогон — подбираю чужие коммиты."
          git fetch --depth=50 origin "$GITHUB_REF_NAME"
          git rebase FETCH_HEAD || { git rebase --abort || true; exit 0; }
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" || true
